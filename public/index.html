<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at top,#3b0a0a 0%,#160505 35%,#050505 80%);
    color:#fff;
}

button{
    border:0;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

.app{
    width:100%;
    max-width:900px;
    min-height:100vh;
    margin:auto;
    padding:12px;
}

.header{
    background:rgba(10,10,10,.97);
    border:1px solid #571414;
    border-radius:20px;
    padding:20px;
    margin-bottom:12px;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    text-shadow:0 0 18px rgba(220,38,38,.4);
}

.subtitle{
    text-align:center;
    color:#999;
    margin:7px 0 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.stat{
    background:#090909;
    border:1px solid #351010;
    border-radius:13px;
    padding:12px;
    text-align:center;
}

.stat-title{
    color:#999;
    font-size:11px;
}

.stat-value{
    margin-top:5px;
    font-size:19px;
    font-weight:bold;
}

.bar{
    height:7px;
    margin-top:7px;
    background:#2b1111;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#b91c1c;
    transition:.3s;
}

.energy .progress{background:#ca8a04}
.happiness .progress{background:#16a34a}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.menu button{
    padding:13px 7px;
    border-radius:12px;
    background:#100909;
    border:1px solid #4a1212;
    transition:.15s;
}

.menu button:hover{
    background:#280b0b;
    transform:translateY(-1px);
}

.content{
    background:rgba(8,8,8,.97);
    border:1px solid #4a1212;
    border-radius:20px;
    padding:20px;
    min-height:450px;
}

.card{
    background:#120909;
    border:1px solid #451111;
    border-radius:15px;
    padding:16px;
    margin:10px 0;
}

.card h3{
    margin-top:0;
}

.action{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:10px;
    background:#991b1b;
}

.action:hover{background:#b91c1c}
.green{background:#166534}
.green:hover{background:#15803d}
.gray{background:#3f3f46}
.red{background:#7f1d1d}

.home-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.big-card{
    background:#120909;
    border:1px solid #451111;
    border-radius:15px;
    padding:18px;
}

.big-card button{
    width:100%;
    padding:11px;
    border-radius:9px;
    background:#2a0d0d;
}

.inventory{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.item{
    background:#120909;
    border:1px solid #451111;
    border-radius:13px;
    padding:15px;
}

.equipped{
    border-color:#b91c1c;
    box-shadow:0 0 10px rgba(185,28,28,.2);
}

.online{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    background:#092b16;
    color:#6ee7a0;
    font-weight:bold;
}

.admin{
    border:1px solid #7f1d1d;
    border-radius:15px;
    padding:5px;
}

.admin-title{color:#ef4444}

input{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #571414;
    background:#080808;
    color:white;
    font-size:16px;
}

.notice{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    background:#181818;
    border:1px solid #6b1a1a;
    border-radius:12px;
    padding:13px 18px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:999;
    max-width:90%;
    text-align:center;
}

.notice.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.small{
    color:#999;
    font-size:13px;
}

.good{color:#4ade80}
.warn{color:#fbbf24}
.bad{color:#f87171}

@media(max-width:650px){
    .app{padding:8px}
    .logo{font-size:28px}
    .stats{grid-template-columns:1fr}
    .menu{grid-template-columns:repeat(2,1fr)}
    .home-grid{grid-template-columns:1fr}
    .inventory{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">🔥 CUBIX CITY</div>

    <div class="subtitle">
        Deine Stadt. Dein Charakter. Dein Fortschritt.
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">💰 COINS</div>
            <div class="stat-value" id="coins">250</div>
        </div>

        <div class="stat">
            <div class="stat-title">⭐ LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-title">⚡ ENERGIE</div>
            <div class="stat-value">
                <span id="energy">100</span>/100
            </div>
            <div class="bar energy">
                <div class="progress" id="energyProgress"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">😊 GLÜCKLICHKEIT</div>
            <div class="stat-value">
                <span id="happiness">80</span>/100
            </div>
            <div class="bar happiness">
                <div class="progress" id="happinessProgress"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">⚡ XP</div>
            <div class="stat-value">
                <span id="xp">0</span>/<span id="xpNeeded">100</span>
            </div>
            <div class="bar">
                <div class="progress" id="xpProgress"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">🔥 STREAK</div>
            <div class="stat-value" id="streak">0</div>
        </div>

    </div>

</div>

<div class="menu">

    <button onclick="navigate('home')">🏠 Stadt</button>
    <button onclick="navigate('jobs')">💼 Jobs</button>
    <button onclick="navigate('shop')">🏪 Shop</button>
    <button onclick="navigate('daily')">🎁 Daily</button>
    <button onclick="navigate('inventory')">🎒 Inventar</button>
    <button onclick="navigate('profile')">👤 Profil</button>
    <button onclick="navigate('activities')">🎯 Aktivitäten</button>
    <button id="adminButton" style="display:none" onclick="navigate('admin')">👑 Admin</button>

</div>

<div class="content" id="content"></div>

</div>

<div class="notice" id="notice"></div>

<script>

/* =====================================================
   SPIELER
===================================================== */

const defaultPlayer = {
    coins:250,
    xp:0,
    level:1,
    energy:100,
    happiness:80,
    streak:0,
    lastDaily:null,
    inventory:[],
    equipped:{},
    jobs:{},
    activities:{}
};

let player = loadPlayer();

function loadPlayer(){
    try{
        const saved = JSON.parse(localStorage.getItem("cubixPlayer"));
        return {
            ...defaultPlayer,
            ...(saved || {}),
            equipped:(saved && saved.equipped) || {},
            jobs:(saved && saved.jobs) || {},
            activities:(saved && saved.activities) || {},
            inventory:(saved && saved.inventory) || []
        };
    }catch{
        return {...defaultPlayer};
    }
}

function save(){
    localStorage.setItem("cubixPlayer",JSON.stringify(player));
    updateStats();
}

function notify(message){
    const box=document.getElementById("notice");
    box.textContent=message;
    box.classList.add("show");

    clearTimeout(window.noticeTimer);

    window.noticeTimer=setTimeout(()=>{
        box.classList.remove("show");
    },2200);
}

/* =====================================================
   NAVIGATION
===================================================== */

function navigate(page){

    try{
        if(page==="home") home();
        else if(page==="jobs") jobs();
        else if(page==="shop") shop();
        else if(page==="daily") daily();
        else if(page==="inventory") inventory();
        else if(page==="profile") profile();
        else if(page==="activities") activities();
        else if(page==="admin") adminPanel();
    }catch(error){
        console.error(error);
        notify("⚠️ Etwas ist schiefgelaufen.");
    }
}

/* =====================================================
   STATS
===================================================== */

function xpNeeded(){
    return 100 + ((player.level-1)*50);
}

function clampStats(){

    player.energy=Math.max(0,Math.min(100,player.energy));
    player.happiness=Math.max(0,Math.min(100,player.happiness));

}

function updateStats(){

    clampStats();

    document.getElementById("coins").textContent=player.coins;
    document.getElementById("level").textContent=player.level;
    document.getElementById("xp").textContent=player.xp;
    document.getElementById("xpNeeded").textContent=xpNeeded();

    document.getElementById("energy").textContent=player.energy;
    document.getElementById("happiness").textContent=player.happiness;
    document.getElementById("streak").textContent=player.streak;

    document.getElementById("xpProgress").style.width=
        Math.min(100,player.xp/xpNeeded()*100)+"%";

    document.getElementById("energyProgress").style.width=
        player.energy+"%";

    document.getElementById("happinessProgress").style.width=
        player.happiness+"%";
}

function addXP(amount){

    player.xp+=amount;

    let leveled=false;

    while(player.xp>=xpNeeded()){
        player.xp-=xpNeeded();
        player.level++;
        leveled=true;
    }

    if(leveled){
        notify("🔥 Level Up! Du bist jetzt Level "+player.level+"!");
    }

    save();
}

function changeEnergy(amount){
    player.energy=Math.max(0,Math.min(100,player.energy+amount));
}

function changeHappiness(amount){
    player.happiness=Math.max(0,Math.min(100,player.happiness+amount));
}

/* =====================================================
   HOME
===================================================== */

function home(){

    document.getElementById("content").innerHTML=`

        <h2>🏠 Willkommen in CUBIX CITY</h2>

        <p>
            Verdiene Coins, sammle XP und kümmere dich
            um deinen Charakter.
        </p>

        <div class="home-grid">

            <div class="big-card">
                <h3>💼 Arbeiten</h3>
                <p>Verdiene Geld und XP.</p>
                <button onclick="navigate('jobs')">
                    Jobs öffnen
                </button>
            </div>

            <div class="big-card">
                <h3>⚡ Energie</h3>
                <p>
                    Energie: <b>${player.energy}/100</b>
                </p>
                <p class="small">
                    Energy Drinks können dir helfen.
                </p>
            </div>

            <div class="big-card">
                <h3>😊 Stimmung</h3>
                <p>
                    Glücklichkeit: <b>${player.happiness}/100</b>
                </p>
                <p class="small">
                    Freizeit und bestimmte Items verbessern deine Stimmung.
                </p>
            </div>

            <div class="big-card">
                <h3>👥 CUBIX CITY</h3>
                <p>
                    <span class="online" id="onlineCount">
                        🟢 Lade...
                    </span>
                </p>
            </div>

        </div>
    `;

    updateOnline();
}

/* =====================================================
   JOBS
===================================================== */

const jobList=[

    {
        id:"trash",
        emoji:"🧹",
        name:"Müll sammeln",
        reward:20,
        xp:10,
        energy:8,
        happiness:4,
        cooldown:15000
    },

    {
        id:"pizza",
        emoji:"🍕",
        name:"Pizza liefern",
        reward:50,
        xp:25,
        energy:15,
        happiness:7,
        cooldown:30000
    },

    {
        id:"taxi",
        emoji:"🚕",
        name:"Taxi fahren",
        reward:100,
        xp:50,
        energy:22,
        happiness:10,
        cooldown:60000
    },

    {
        id:"developer",
        emoji:"💻",
        name:"Programmieren",
        reward:200,
        xp:100,
        energy:30,
        happiness:14,
        cooldown:120000
    }

];

function jobs(){

    let html=`
        <h2>💼 Jobs</h2>
        <p class="small">
            Arbeiten kostet Energie und etwas Glücklichkeit.
            Ausgerüstete Items können deine Belohnung verbessern.
        </p>
    `;

    jobList.forEach(job=>{

        const last=player.jobs[job.id]||0;

        const remaining=Math.max(
            0,
            job.cooldown-(Date.now()-last)
        );

        const seconds=Math.ceil(remaining/1000);

        let reward=job.reward;

        if(player.equipped.headphones==="headphones"){
            reward=Math.floor(reward*1.12);
        }

        if(player.equipped.pc==="gaming_pc"){
            reward=Math.floor(reward*1.08);
        }

        const enoughEnergy=player.energy>=job.energy;

        html+=`

        <div class="card">

            <h3>${job.emoji} ${job.name}</h3>

            <p>
                💰 +${reward} Coins<br>
                ⭐ +${job.xp} XP<br>
                ⚡ -${job.energy} Energie<br>
                😊 -${job.happiness} Glücklichkeit
            </p>

            ${
                remaining>0
                ?
                `<button class="action gray" disabled>
                    ⏳ Noch ${seconds} Sekunden
                </button>`
                :
                !enoughEnergy
                ?
                `<button class="action gray" disabled>
                    ⚡ Zu wenig Energie
                </button>`
                :
                `<button class="action"
                    onclick="work('${job.id}')">
                    💼 Arbeiten
                </button>`
            }

        </div>
        `;
    });

    document.getElementById("content").innerHTML=html;
}

function work(id){

    const job=jobList.find(x=>x.id===id);
    if(!job)return;

    const last=player.jobs[id]||0;

    if(Date.now()-last<job.cooldown){
        notify("⏳ Dieser Job ist noch nicht bereit.");
        return;
    }

    if(player.energy<job.energy){
        notify("⚡ Du hast nicht genug Energie.");
        return;
    }

    let reward=job.reward;

    if(player.equipped.headphones==="headphones"){
        reward=Math.floor(reward*1.12);
    }

    if(player.equipped.pc==="gaming_pc"){
        reward=Math.floor(reward*1.08);
    }

    player.jobs[id]=Date.now();

    player.coins+=reward;
    changeEnergy(-job.energy);
    changeHappiness(-job.happiness);

    addXP(job.xp);
    save();

    notify(
        `💼 +${reward} Coins • +${job.xp} XP • ⚡ -${job.energy}`
    );

    jobs();
}

/* =====================================================
   DAILY
===================================================== */

function daily(){

    const today=new Date().toISOString().slice(0,10);

    if(player.lastDaily===today){

        document.getElementById("content").innerHTML=`

            <h2>🎁 Daily Reward</h2>

            <div class="card">

                <h3>😴 Schon abgeholt!</h3>

                <p>
                    Morgen wartet die nächste Belohnung.
                </p>

                <p>🔥 Streak: ${player.streak}</p>

            </div>
        `;

        return;
    }

    const yesterday=new Date();
    yesterday.setDate(yesterday.getDate()-1);

    const yesterdayString=
        yesterday.toISOString().slice(0,10);

    if(
        player.lastDaily &&
        player.lastDaily!==yesterdayString
    ){
        player.streak=0;
    }

    player.lastDaily=today;
    player.streak++;

    const reward=
        Math.min(
            250,
            100+((player.streak-1)*10)
        );

    player.coins+=reward;

    addXP(20);
    changeHappiness(5);

    save();

    document.getElementById("content").innerHTML=`

        <h2>🎁 Daily Reward</h2>

        <div class="card">

            <h3 class="good">
                🎉 Belohnung erhalten!
            </h3>

            <p>💰 +${reward} Coins</p>
            <p>⭐ +20 XP</p>
            <p>😊 +5 Glücklichkeit</p>
            <p>🔥 Streak: ${player.streak}</p>

        </div>
    `;
}

/* =====================================================
   SHOP
===================================================== */

const shopItems=[

    {
        id:"energy_drink",
        name:"🥤 Energy Drink",
        price:50,
        description:"+30 Energie bei Benutzung.",
        type:"consumable"
    },

    {
        id:"headphones",
        name:"🎧 Kopfhörer",
        price:150,
        description:"Bei Jobs +12% Coins. Haltbarkeit: 15 Jobs.",
        type:"equipment",
        slot:"headphones",
        durability:15
    },

    {
        id:"controller",
        name:"🎮 Controller",
        price:300,
        description:"+20 Glücklichkeit bei Benutzung.",
        type:"consumable"
    },

    {
        id:"bike",
        name:"🚲 Fahrrad",
        price:500,
        description:"Bei Pizza-Jobs 15% weniger Energie.",
        type:"equipment",
        slot:"bike",
        durability:20
    },

    {
        id:"gaming_pc",
        name:"💻 Gaming PC",
        price:750,
        description:"Bei Jobs +8% Coins. Haltbarkeit: 25 Jobs.",
        type:"equipment",
        slot:"pc",
        durability:25
    },

    {
        id:"apartment",
        name:"🏠 Kleine Wohnung",
        price:1500,
        description:"Regeneriert täglich etwas Glücklichkeit.",
        type:"equipment",
        slot:"home",
        durability:30
    },

    {
        id:"snack",
        name:"🍫 Snack",
        price:30,
        description:"+10 Energie.",
        type:"consumable"
    },

    {
        id:"movie",
        name:"🎬 Kinokarte",
        price:80,
        description:"+25 Glücklichkeit.",
        type:"consumable"
    }

];

function shop(){

    let html=`
        <h2>🏪 CUBIX Shop</h2>
        <p class="small">
            Items kaufen und anschließend im Inventar verwenden.
        </p>
    `;

    shopItems.forEach((item,index)=>{

        html+=`

        <div class="card">

            <h3>${item.name}</h3>

            <p>${item.description}</p>

            <p>
                💰 <strong>${item.price} Coins</strong>
            </p>

            <button
                class="action"
                onclick="buy(${index})">
                🛒 Kaufen
            </button>

        </div>
        `;
    });

    document.getElementById("content").innerHTML=html;
}

function buy(index){

    const item=shopItems[index];

    if(!item){
        notify("❌ Item nicht gefunden.");
        return;
    }

    if(player.coins<item.price){
        notify("❌ Nicht genug Coins.");
        return;
    }

    player.coins-=item.price;

    player.inventory.push({
        id:item.id,
        durability:item.durability||1
    });

    save();

    notify(`🛒 ${item.name} gekauft!`);

    shop();
}

/* =====================================================
   INVENTAR
===================================================== */

function getItemCount(id){

    return player.inventory.filter(
        item=>item.id===id
    ).length;
}

function getItemData(id){

    return shopItems.find(
        item=>item.id===id
    );
}

function inventory(){

    if(player.inventory.length===0){

        document.getElementById("content").innerHTML=`

            <h2>🎒 Inventar</h2>

            <div class="card">
                Dein Inventar ist leer.
                <br><br>
                Besuche den Shop!
            </div>
        `;

        return;
    }

    const grouped={};

    player.inventory.forEach((item,index)=>{

        if(!grouped[item.id]){
            grouped[item.id]=[];
        }

        grouped[item.id].push({
            ...item,
            index
        });

    });

    let html=`
        <h2>🎒 Inventar</h2>
        <p class="small">
            Verbrauchbare Items kannst du direkt benutzen.
            Ausrüstung kannst du anlegen.
        </p>
    `;

    Object.keys(grouped).forEach(id=>{

        const itemData=getItemData(id);
        const items=grouped[id];

        if(!itemData)return;

        const equipped=Object.values(player.equipped)
            .includes(id);

        html+=`

        <div class="item ${equipped?"equipped":""}">

            <h3>${itemData.name}</h3>

            <p>${itemData.description}</p>

            <p>
                Anzahl: <b>${items.length}</b>
            </p>

            ${
                itemData.type==="consumable"
                ?
                `<button
                    class="action green"
                    onclick="useItem('${id}')">
                    ✨ Benutzen
                </button>`
                :
                `
                ${
                    equipped
                    ?
                    `<button
                        class="action gray"
                        onclick="unequipItem('${id}')">
                        ❌ Ablegen
                    </button>`
                    :
                    `<button
                        class="action"
                        onclick="equipItem('${id}')">
                        ⚙️ Ausrüsten
                    </button>`
                }
                `
            }

        </div>
        `;
    });

    document.getElementById("content").innerHTML=html;
}

/* =====================================================
   ITEMS BENUTZEN
===================================================== */

function useItem(id){

    const index=player.inventory.findIndex(
        item=>item.id===id
    );

    if(index===-1){
        notify("❌ Dieses Item ist nicht im Inventar.");
        return;
    }

    if(id==="energy_drink"){

        if(player.energy>=100){
            notify("⚡ Deine Energie ist bereits voll.");
            return;
        }

        player.energy=Math.min(
            100,
            player.energy+30
        );

        player.inventory.splice(index,1);

        notify("🥤 +30 Energie");

    }else if(id==="controller"){

        player.happiness=Math.min(
            100,
            player.happiness+20
        );

        player.inventory.splice(index,1);

        notify("🎮 +20 Glücklichkeit");

    }else if(id==="snack"){

        player.energy=Math.min(
            100,
            player.energy+10
        );

        player.inventory.splice(index,1);

        notify("🍫 +10 Energie");

    }else if(id==="movie"){

        player.happiness=Math.min(
            100,
            player.happiness+25
        );

        player.inventory.splice(index,1);

        notify("🎬 +25 Glücklichkeit");

    }else{
        notify("❌ Dieses Item kann nicht direkt benutzt werden.");
        return;
    }

    save();
    inventory();
}

/* =====================================================
   AUSRÜSTUNG
===================================================== */

function equipItem(id){

    const itemData=getItemData(id);

    if(!itemData || itemData.type!=="equipment"){
        return;
    }

    const existing=player.equipped[itemData.slot];

    if(existing===id){
        notify("⚙️ Bereits ausgerüstet.");
        return;
    }

    player.equipped[itemData.slot]=id;

    save();

    notify(`⚙️ ${itemData.name} ausgerüstet!`);

    inventory();
}

function unequipItem(id){

    const itemData=getItemData(id);

    if(!itemData)return;

    if(player.equipped[itemData.slot]===id){

        delete player.equipped[itemData.slot];

        save();

        notify(`❌ ${itemData.name} abgelegt.`);

        inventory();
    }
}

function activities(){

    document.getElementById("content").innerHTML=`

        <h2>🎯 Aktivitäten</h2>

        <div class="card">

            <p>
                😊 +15 Glücklichkeit<br>
                ⚡ -8 Energie
            </p>

                class="action"
                onclick="doActivity('gaming',15,8)">
                Spielen
            </button>

        </div>

        <div class="card">

            <h3>🚶 Spaziergang</h3>

            <p>
                😊 +10 Glücklichkeit<br>
                ⚡ -5 Energie
            </p>

            <button
                class="action"
                onclick="doActivity('walk',10,5)">
                Spazieren
            </button>

        </div>

        <div class="card">

            <h3>😴 Ausruhen</h3>

            <p>
                ⚡ +25 Energie
            </p>

            <button
                class="action green"
                onclick="rest()">
                Ausruhen
            </button>

        </div>
    `;
}

function doActivity(id,happinessCost,energyCost){

    if(player.energy<energyCost){
        notify("⚡ Nicht genug Energie.");
        return;
    }

    player.energy-=energyCost;

    let happiness=happinessCost;

    if(
        id==="gaming" &&
        player.equipped.controller==="controller"
    ){
        happiness+=5;
    }

    player.happiness=Math.min(
        100,
        player.happiness+happiness
    );

    save();

    notify(`😊 +${happiness} Glücklichkeit`);

    activities();
}

function rest(){

    player.energy=Math.min(
        100,
        player.energy+25
    );

    if(player.equipped.home==="apartment"){
        player.happiness=Math.min(
            100,
            player.happiness+5
        );
    }

    save();

    notify("😴 Du hast dich ausgeruht.");

    activities();
}

/* =====================================================
   ONLINE
===================================================== */

const playerId=
    localStorage.getItem("cubixPlayerId")||
    crypto.randomUUID();

localStorage.setItem("cubixPlayerId",playerId);

async function heartbeat(){

    try{

        const response=await fetch("/api/heartbeat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({playerId})
        });

        if(!response.ok)return;

        const data=await response.json();

        const element=
            document.getElementById("onlineCount");

        if(element){
            element.textContent=
                "🟢 "+data.online+" Spieler online";
        }

    }catch(error){
        console.log("Online-System nicht erreichbar.");
    }
}

async function updateOnline(){

    try{

        const response=
            await fetch("/api/online");

        if(!response.ok)return;

        const data=
            await response.json();

        const element=
            document.getElementById("onlineCount");

        if(element){
            element.textContent=
                "🟢 "+data.online+" Spieler online";
        }

    }catch(error){}
}

setInterval(heartbeat,30000);
heartbeat();

/* =====================================================
   ADMIN
===================================================== */

let adminPassword=
    sessionStorage.getItem("cubixAdmin")||null;

function adminLogin(){

    const password=
        prompt("👑 Admin-Passwort:");

    if(!password)return;

    fetch("/api/admin/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({password})

    })
    .then(response=>{

        if(!response.ok)
            throw new Error();

        return response.json();

    })
    .then(data=>{

        if(data.success){

            adminPassword=password;

            sessionStorage.setItem(
                "cubixAdmin",
                password
            );

            document.getElementById(
                "adminButton"
            ).style.display="block";

            adminPanel();

        }

    })
    .catch(()=>{
        notify("❌ Falsches Admin-Passwort.");
    });
}

async function adminPanel(){

    if(!adminPassword){
        adminLogin();
        return;
    }

    try{

        const response=
            await fetch("/api/admin/stats",{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    password:adminPassword
                })

            });

        if(!response.ok){

            adminPassword=null;

            sessionStorage.removeItem(
                "cubixAdmin"
            );

            document.getElementById(
                "adminButton"
            ).style.display="none";

            adminLogin();

            return;
        }

        const data=await response.json();

        document.getElementById("content").innerHTML=`

            <div class="admin">

                <h2 class="admin-title">
                    👑 CUBIX ADMIN
                </h2>

                <div class="card">

                    <h3>👥 Spieler online</h3>

                    <p class="online">
                        🟢 ${data.onlinePlayers}
                        Spieler online
                    </p>

                    <button
                        class="action"
                        onclick="adminPanel()">
                        🔄 Aktualisieren
                    </button>

                </div>

                <div class="card">

                    <h3>💰 Coins</h3>

                    <input
                        id="adminCoins"
                        type="number"
                        min="1"
                        placeholder="z.B. 10000">

                    <button
                        class="action green"
                        onclick="adminGiveCoins()">
                        💰 Coins geben
                    </button>

                </div>

                <div class="card">

                    <h3>⭐ XP</h3>

                    <input
                        id="adminXP"
                        type="number"
                        min="1"
                        placeholder="z.B. 500">

                    <button
                        class="action green"
                        onclick="adminGiveXP()">
                        ⭐ XP geben
                    </button>

                </div>

                <div class="card">

                    <button
                        class="action red"
                        onclick="adminLogout()">
                        🔐 Admin verlassen
                    </button>

                </div>

            </div>
        `;

    }catch(error){

        console.error(error);
        notify("⚠️ Admin-Bereich konnte nicht geladen werden.");

    }
}

function adminGiveCoins(){

    const input=document.getElementById("adminCoins");

    if(!input)return;

    const amount=Number(input.value);

    if(!Number.isFinite(amount)||amount<=0){
        notify("Bitte eine gültige Zahl eingeben.");
        return;
    }

    player.coins+=amount;

    save();

    notify(`👑 +${amount} Coins`);

    adminPanel();
}

function adminGiveXP(){

    const input=document.getElementById("adminXP");

    if(!input)return;

    const amount=Number(input.value);

    if(!Number.isFinite(amount)||amount<=0){
        notify("Bitte eine gültige Zahl eingeben.");
        return;
    }

    addXP(amount);

    notify(`👑 +${amount} XP`);

    adminPanel();
}

function adminLogout(){

    adminPassword=null;

    sessionStorage.removeItem("cubixAdmin");

    document.getElementById(
        "adminButton"
    ).style.display="none";

    home();

    notify("🔐 Admin-Modus beendet.");
}

   ADMIN AUTOMATISCH PRÜFEN
===================================================== */

if(adminPassword){

    document.getElementById(
        "adminButton"
    ).style.display="block";
}

/* =====================================================
   START
===================================================== */

updateStats();
home();

</script>
