<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120303">

<title>CUBIX CITY</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top,#450909 0%,#170404 35%,#050505 80%);
}

button{
    border:0;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    transition:.15s;
}

button:hover:not(:disabled){
    transform:translateY(-1px);
    filter:brightness(1.15);
}

button:disabled{
    opacity:.42;
    cursor:not-allowed;
    transform:none;
}

.app{
    width:100%;
    max-width:950px;
    margin:auto;
    min-height:100vh;
    padding:12px;
}

.header,
.content{
    background:rgba(8,8,8,.97);
    border:1px solid #551313;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.header{
    padding:20px;
    margin-bottom:12px;
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 0 20px rgba(220,38,38,.35);
}

.subtitle{
    text-align:center;
    color:#999;
    margin:7px 0 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#101010;
    border:1px solid #351010;
    border-radius:13px;
    padding:11px;
    text-align:center;
}

.stat-title{
    color:#888;
    font-size:11px;
}

.stat-value{
    margin-top:4px;
    font-size:18px;
    font-weight:bold;
}

.bar{
    height:7px;
    background:#291010;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

.fill{
    height:100%;
    width:0%;
    transition:width .25s;
}

.energy{
    background:#d97706;
}

.happy{
    background:#db2777;
}

.xp{
    background:#b91c1c;
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.menu button{
    padding:13px 7px;
    border-radius:12px;
    background:#170707;
    border:1px solid #521313;
}

.admin-button{
    display:none;
    background:#4a0909 !important;
    border-color:#dc2626 !important;
}

.admin-button.visible{
    display:block;
}

.content{
    min-height:480px;
    padding:20px;
}

h2{
    margin-top:0;
}

h3{
    margin-top:0;
}

.card{
    background:#120707;
    border:1px solid #461111;
    border-radius:14px;
    padding:16px;
    margin:10px 0;
}

.card strong{
    color:#fff;
}

.action{
    width:100%;
    padding:13px;
    margin-top:8px;
    border-radius:10px;
    background:#991b1b;
}

.action:hover:not(:disabled){
    background:#b91c1c;
}

.green{
    background:#166534;
}

.gray{
    background:#3f3f46;
}

.pink{
    background:#9d174d;
}

.dark{
    background:#211010;
}

.item{
    background:#120707;
    border:1px solid #461111;
    border-radius:13px;
    padding:15px;
    margin:9px 0;
}

.item.equipped{
    border-color:#dc2626;
    box-shadow:0 0 12px rgba(220,38,38,.12);
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#421111;
}

.success{
    color:#4ade80;
}

.warning{
    color:#fbbf24;
}

.danger{
    color:#f87171;
}

.muted{
    color:#999;
}

.small{
    font-size:13px;
}

.limit{
    background:#1a0b0b;
    border:1px solid #511414;
    border-radius:11px;
    padding:11px;
    margin-bottom:12px;
}

.cooldown{
    font-family:monospace;
    color:#fbbf24;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

input{
    width:100%;
    padding:13px;
    margin:5px 0;
    border-radius:10px;
    border:1px solid #571414;
    background:#080808;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#dc2626;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    background:#111;
    border:1px solid #6b1717;
    border-radius:12px;
    padding:12px 17px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:9999;
    max-width:90%;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.5);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.stat-positive{
    color:#4ade80;
}

.stat-negative{
    color:#f87171;
}

.admin-panel{
    border:1px solid #dc2626;
    border-radius:15px;
    padding:4px;
    background:#100404;
}

.admin-title{
    color:#ef4444;
}

.online{
    display:inline-block;
    background:#092b16;
    color:#6ee7a0;
    padding:7px 11px;
    border-radius:20px;
    font-weight:bold;
}

@media(max-width:650px){

    .app{
        padding:8px;
    }

    .logo{
        font-size:27px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    .content{
        padding:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">🔥 CUBIX CITY</div>

    <div class="subtitle">
        Deine Stadt. Dein Charakter. Dein Fortschritt.
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">💰 COINS</div>
            <div class="stat-value" id="coins">250</div>
        </div>

        <div class="stat">
            <div class="stat-title">⭐ LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">

            <div class="stat-title">⚡ ENERGIE</div>

            <div class="stat-value">
                <span id="energy">100</span>/100
            </div>

            <div class="bar">
                <div class="fill energy" id="energyBar"></div>
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">😊 GLÜCK</div>

            <div class="stat-value">
                <span id="happy">70</span>/100
            </div>

            <div class="bar">
                <div class="fill happy" id="happyBar"></div>
            </div>

        </div>

    </div>

</div>


<div class="menu">

    <button onclick="home()">🏠 Stadt</button>
    <button onclick="jobs()">💼 Arbeit</button>
    <button onclick="shop()">🏪 Shop</button>
    <button onclick="inventory()">🎒 Inventar</button>

    <button onclick="rest()">😴 Ausruhen</button>
    <button onclick="freeTime()">🎮 Freizeit</button>
    <button onclick="daily()">🎁 Daily</button>
    <button onclick="profile()">👤 Profil</button>

    <button
        id="adminButton"
        class="admin-button"
        onclick="adminPanel()">
        👑 Admin
    </button>

</div>


<div class="content" id="content"></div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   CUBIX CITY
   Komplettes Frontend
===================================================== */


/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function today(){

    const d = new Date();

    return d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0");

}


function uid(){

    if(
        typeof crypto !== "undefined" &&
        crypto.randomUUID
    ){
        return crypto.randomUUID();
    }

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);

}


function formatTime(ms){

    if(ms <= 0)
        return "bereit";

    const total =
        Math.ceil(ms / 1000);

    const minutes =
        Math.floor(total / 60);

    const seconds =
        total % 60;

    if(minutes > 0){

        return (
            minutes +
            "m " +
            String(seconds).padStart(2,"0") +
            "s"
        );

    }

    return seconds + "s";

}


function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            el.classList.remove("show");

        },2200);

}


/* =====================================================
   SPIELER
===================================================== */

let player =
    JSON.parse(
        localStorage.getItem("cubixPlayer")
    ) || {

        coins:250,

        xp:0,

        level:1,

        energy:100,

        happiness:70,

        streak:0,

        lastDaily:null,

        inventory:[],

        career:null,

        lastWork:0,

        workToday:0,

        careerChangedToday:0,

        restsToday:0,

        lastRest:0,

        freeTimeToday:0,

        lastFreeTime:0,

        lastActionDay:today()

    };


/* =====================================================
   DATEN REPARIEREN
===================================================== */

if(typeof player.coins !== "number")
    player.coins = 250;

if(typeof player.xp !== "number")
    player.xp = 0;

if(typeof player.level !== "number")
    player.level = 1;

if(typeof player.energy !== "number")
    player.energy = 100;

if(typeof player.happiness !== "number")
    player.happiness = 70;

if(typeof player.streak !== "number")
    player.streak = 0;

if(!Array.isArray(player.inventory))
    player.inventory = [];

if(typeof player.career !== "string")
    player.career = null;

if(typeof player.lastWork !== "number")
    player.lastWork = 0;

if(typeof player.workToday !== "number")
    player.workToday = 0;

if(typeof player.careerChangedToday !== "number")
    player.careerChangedToday = 0;

if(typeof player.restsToday !== "number")
    player.restsToday = 0;

if(typeof player.lastRest !== "number")
    player.lastRest = 0;

if(typeof player.freeTimeToday !== "number")
    player.freeTimeToday = 0;

if(typeof player.lastFreeTime !== "number")
    player.lastFreeTime = 0;

if(typeof player.lastActionDay !== "string")
    player.lastActionDay = today();


/* =====================================================
   ITEMS
===================================================== */

const items = {

    "🥤 Energy Drink":{
        price:50,
        uses:3,
        effect:"energy",
        value:25,
        text:"+25 Energie beim Benutzen"
    },

    "☕ Kaffee":{
        price:80,
        uses:4,
        effect:"energy",
        value:15,
        happy:2,
        text:"+15 Energie und +2 Glück"
    },

    "🍫 Schokoriegel":{
        price:70,
        uses:3,
        effect:"energy",
        value:10,
        happy:5,
        text:"+10 Energie und +5 Glück"
    },

    "🎧 Kopfhörer":{
        price:150,
        uses:8,
        effect:"work",
        value:.10,
        text:"Bei einer Arbeitsschicht +10% Coins"
    },

    "🎮 Controller":{
        price:300,
        uses:6,
        effect:"free",
        value:15,
        text:"Bei Freizeit +15 zusätzliches Glück"
    },

    "📱 Smartphone":{
        price:250,
        uses:8,
        effect:"free",
        value:7,
        text:"Bei Freizeit +7 zusätzliches Glück"
    },

    "💻 Gaming PC":{
        price:750,
        uses:6,
        effect:"free",
        value:20,
        text:"Bei Freizeit +20 zusätzliches Glück"
    },

    "🚲 Fahrrad":{
        price:500,
        uses:10,
        effect:"jobenergy",
        value:5,
        text:"Eine Arbeitsschicht kostet 5 Energie weniger"
    },

    "👟 Arbeitsschuhe":{
        price:350,
        uses:12,
        effect:"jobenergy",
        value:3,
        text:"Eine Arbeitsschicht kostet 3 Energie weniger"
    },

    "🎒 Rucksack":{
        price:400,
        uses:10,
        effect:"jobenergy",
        value:2,
        text:"Eine Arbeitsschicht kostet 2 Energie weniger"
    },

    "🏠 Kleine Wohnung":{
        price:1500,
        uses:8,
        effect:"rest",
        value:15,
        text:"Eine Ruhepause gibt 15 zusätzliche Energie"
    },

    "🛏️ Bequemes Bett":{
        price:900,
        uses:10,
        effect:"rest",
        value:8,
        text:"Eine Ruhepause gibt 8 zusätzliche Energie"
    },

    "📚 Motivationsbuch":{
        price:450,
        uses:5,
        effect:"workxp",
        value:8,
        text:"Eine Arbeitsschicht gibt +8 zusätzliche XP"
    },

    "🧃 Isotonisches Getränk":{
        price:120,
        uses:3,
        effect:"energy",
        value:20,
        happy:1,
        text:"+20 Energie und +1 Glück"
    }

};


/* =====================================================
   ALTES INVENTAR REPARIEREN
===================================================== */

player.inventory =
    player.inventory
        .map(item => {

            if(typeof item === "string"){

                if(!items[item])
                    return null;

                return {

                    id:uid(),

                    name:item,

                    uses:items[item].uses,

                    equipped:false

                };

            }


            if(
                item &&
                typeof item === "object" &&
                item.name &&
                items[item.name]
            ){

                if(!item.id)
                    item.id = uid();

                if(typeof item.uses !== "number")
                    item.uses =
                        items[item.name].uses;

                if(typeof item.equipped !== "boolean")
                    item.equipped = false;

                return item;

            }

            return null;

        })
        .filter(Boolean);


/* =====================================================
   SPEICHERN
===================================================== */

function save(){

    localStorage.setItem(
        "cubixPlayer",
        JSON.stringify(player)
    );

    updateStats();

}


/* =====================================================
   TAGESRESET
===================================================== */

function checkNewDay(){

    const current = today();

    if(player.lastActionDay !== current){

        player.restsToday = 0;

        player.freeTimeToday = 0;

        player.workToday = 0;

        player.careerChangedToday = 0;

        player.lastActionDay = current;

        save();

    }

}


/* =====================================================
   XP
===================================================== */

function xpNeeded(){

    return 100 +
        ((player.level - 1) * 50);

}


function addXP(amount){

    player.xp += amount;

    let levels = 0;

    while(player.xp >= xpNeeded()){

        player.xp -= xpNeeded();

        player.level++;

        levels++;

    }

    if(levels > 0){

        toast(
            "🔥 Level Up! Du bist jetzt Level " +
            player.level
        );

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    player.energy =
        Math.max(
            0,
            Math.min(
                100,
                player.energy
            )
        );

    player.happiness =
        Math.max(
            0,
            Math.min(
                100,
                player.happiness
            )
        );


    document.getElementById("coins").textContent =
        Math.floor(player.coins);

    document.getElementById("level").textContent =
        player.level;

    document.getElementById("energy").textContent =
        Math.round(player.energy);

    document.getElementById("happy").textContent =
        Math.round(player.happiness);

    document.getElementById("energyBar").style.width =
        player.energy + "%";

    document.getElementById("happyBar").style.width =
        player.happiness + "%";

}


/* =====================================================
   ITEM HILFSFUNKTIONEN
===================================================== */

function equipped(name){

    return player.inventory.find(
        item =>
            item.name === name &&
            item.equipped === true &&
            item.uses > 0
    );

}


function consumeItem(name){

    const item =
        equipped(name);

    if(!item)
        return false;

    item.uses--;

    if(item.uses <= 0){

        const index =
            player.inventory.indexOf(item);

        if(index !== -1)
            player.inventory.splice(index,1);

    }

    return true;

}


function getItem(id){

    return player.inventory.find(
        item => item.id === id
    );

}


/* =====================================================
   BERUFE
===================================================== */

const jobList = [

    {
        id:"cleaner",
        name:"🧹 Stadtreinigung",
        reward:45,
        xp:18,
        energy:14,
        happiness:3,
        unlock:1
    },

    {
        id:"delivery",
        name:"🍕 Pizza-Lieferant",
        reward:60,
        xp:22,
        energy:18,
        happiness:4,
        unlock:1
    },

    {
        id:"taxi",
        name:"🚕 Taxifahrer",
        reward:105,
        xp:35,
        energy:25,
        happiness:6,
        unlock:3
    },

    {
        id:"developer",
        name:"💻 Entwickler",
        reward:180,
        xp:55,
        energy:35,
        happiness:8,
        unlock:5
    }

];


/* =====================================================
   SPIELBALANCE
===================================================== */

const MAX_WORK_TODAY = 8;

const WORK_COOLDOWN =
    5 * 60 * 1000;

const MAX_REST_TODAY = 3;

const REST_COOLDOWN =
    45 * 60 * 1000;

const MAX_FREE_TODAY = 5;

const FREE_COOLDOWN =
    30 * 60 * 1000;


/* =====================================================
   BERUF HILFE
===================================================== */

function currentJob(){

    return jobList.find(
        job => job.id === player.career
    ) || null;

}


function workRemaining(){

    if(!player.lastWork)
        return 0;

    return Math.max(
        0,
        WORK_COOLDOWN -
        (Date.now() - player.lastWork)
    );

}


function restRemaining(){

    if(!player.lastRest)
        return 0;

    return Math.max(
        0,
        REST_COOLDOWN -
        (Date.now() - player.lastRest)
    );

}


function freeRemaining(){

    if(!player.lastFreeTime)
        return 0;

    return Math.max(
        0,
        FREE_COOLDOWN -
        (Date.now() - player.lastFreeTime)
    );

}


function jobEnergy(job){

    let cost = job.energy;

    if(equipped("🚲 Fahrrad"))
        cost -= 5;

    if(equipped("👟 Arbeitsschuhe"))
        cost -= 3;

    if(equipped("🎒 Rucksack"))
        cost -= 2;

    return Math.max(5,cost);

}


/* =====================================================
   HOME
===================================================== */

function home(){

    checkNewDay();

    const job =
        currentJob();

    const workTimer =
        workRemaining();

    const restTimer =
        restRemaining();

    const freeTimer =
        freeRemaining();


    document.getElementById("content").innerHTML = `

        <h2>🏠 CUBIX CITY</h2>

        <p class="muted">
            Verdiene Coins, sammle XP und manage
            deine Energie und dein Glück.
        </p>

        <div class="grid">

            <div class="card">

                <h3>💰 Wirtschaft</h3>

                <p>
                    Du besitzt
                    <strong>${Math.floor(player.coins)}</strong>
                    Coins.
                </p>

                <button
                    class="action"
                    onclick="shop()">
                    🏪 Shop
                </button>

            </div>


            <div class="card">

                <h3>💼 Arbeit</h3>

                <p>
                    ${
                        job
                        ? "👔 " + job.name
                        : "Noch kein Beruf"
                    }
                </p>

                ${
                    workTimer > 0

                    ?

                    `<p class="cooldown">
                        ⏳ ${formatTime(workTimer)}
                    </p>`

                    :

                    `<p class="success">
                        ✅ Arbeitsbereit
                    </p>`
                }

                <button
                    class="action"
                    onclick="jobs()">
                    💼 Arbeit öffnen
                </button>

            </div>


            <div class="card">

                <h3>😴 Erholung</h3>

                <p>
                    ${player.restsToday}/${MAX_REST_TODAY}
                    Pausen heute
                </p>

                ${
                    restTimer > 0
                    ?
                    `<p class="cooldown">
                        ⏳ ${formatTime(restTimer)}
                    </p>`
                    :
                    `<p class="success">
                        ✅ Pause möglich
                    </p>`
                }

            </div>


            <div class="card">

                <h3>🎮 Freizeit</h3>

                <p>
                    ${player.freeTimeToday}/${MAX_FREE_TODAY}
                    Aktionen heute
                </p>

                ${
                    freeTimer > 0
                    ?
                    `<p class="cooldown">
                        ⏳ ${formatTime(freeTimer)}
                    </p>`
                    :
                    `<p class="success">
                        ✅ Freizeit möglich
                    </p>`
                }

            </div>

        </div>


        <div class="card">

            <h3>📊 Dein Zustand</h3>

            <p>
                ⚡ Energie:
                <strong>${Math.round(player.energy)}/100</strong>
            </p>

            <p>
                😊 Glück:
                <strong>${Math.round(player.happiness)}/100</strong>
            </p>

            <p>
                ⭐ XP:
                <strong>
                    ${player.xp}/${xpNeeded()}
                </strong>
            </p>

        </div>


        <div class="card">

            <h3>💡 So funktioniert CUBIX CITY</h3>

            <p>
                Arbeit bringt Coins und XP, kostet aber
                Energie und Glück.
            </p>

            <p>
                Freizeit macht dich glücklicher,
                kostet aber Energie.
            </p>

            <p>
                Ausruhen gibt Energie zurück,
                hat aber ein Tageslimit und einen Cooldown.
            </p>

            <p>
                Items geben kleine Vorteile und
                werden nach ihrer Nutzung verbraucht.
            </p>

        </div>

    `;

}


/* =====================================================
   JOBS
===================================================== */

function jobs(){

    checkNewDay();

    const job =
        currentJob();

    const remaining =
        workRemaining();


    let html = `

        <h2>💼 Arbeit</h2>

        <p class="muted">
            Du kannst nur einen Beruf gleichzeitig haben.
            Jede Schicht startet einen globalen Cooldown.
        </p>

        <div class="limit">

            📅 Schichten heute:
            <strong>
                ${player.workToday}/${MAX_WORK_TODAY}
            </strong>

        </div>

    `;


    if(!job){

        html += `

            <div class="card">

                <h3>👔 Beruf auswählen</h3>

                <p>
                    Wähle einen Beruf. Später kannst du
                    dich weiterentwickeln und bessere
                    Berufe freischalten.
                </p>

            </div>

        `;


        jobList.forEach(j => {

        `;

        document.getElementById("content").innerHTML =

    }


    let disabled = false;

    let text = "💼 Arbeiten";


    if(remaining > 0){

        disabled = true;

        text =

            formatTime(remaining);

    }
    else if(player.energy < cost){

        disabled = true;

        text =

    else if(player.happiness <= 0){

function chooseCareer(id){

    checkNewDay();

    const job =
        jobList.find(
            j => j.id === id
        );

    if(!job)
        return;


    if(player.level < job.unlock){

        toast(
            "🔒 Dieser Beruf ist noch gesperrt."
        );

        return;

    }


    if(player.career){

        changeCareer();

        return;

    }


    player.career = job.id;

    save();

    toast(
        "👔 Neuer Beruf: " +
        job.name
    );

    jobs();

}

/* =====================================================
   ARBEITEN
===================================================== */

function work(){

    checkNewDay();

    const job =
        currentJob();


    if(!job){

        jobs();

        return;

    }


    const remaining =
        workRemaining();


    if(remaining > 0){

        toast(
            "⏳ Deine nächste Schicht ist noch nicht bereit."
        );

        jobs();

        return;

    }


    if(player.workToday >= MAX_WORK_TODAY){

        toast(
            "🌙 Für heute ist Feierabend."
        );

        jobs();

        return;

    }


    const cost =
        jobEnergy(job);


    if(player.energy < cost){

        toast(
            "⚡ Du hast nicht genug Energie."
        );

        jobs();

        return;

    }


    if(player.happiness <= 0){

        toast(
            "😞 Du bist zu unglücklich zum Arbeiten."
        );

        jobs();

        return;

    }


    let reward =
        job.reward;


    if(equipped("🎧 Kopfhörer")){

        reward =
            Math.round(
                reward * 1.10
            );

    }


    let gainedXP =
        job.xp;


    if(equipped("📚 Motivationsbuch")){

        gainedXP += 8;

    }


    player.energy -= cost;


    player.happiness =
        Math.max(
            0,
            player.happiness -
            job.happiness
        );


    player.coins += reward;

    player.workToday++;

    player.lastWork =
        Date.now();


    addXP(gainedXP);


    if(equipped("🎧 Kopfhörer"))
        consumeItem("🎧 Kopfhörer");

    if(equipped("📚 Motivationsbuch"))
        consumeItem("📚 Motivationsbuch");

    if(equipped("🚲 Fahrrad"))
        consumeItem("🚲 Fahrrad");

    if(equipped("👟 Arbeitsschuhe"))
        consumeItem("👟 Arbeitsschuhe");

    if(equipped("🎒 Rucksack"))
        consumeItem("🎒 Rucksack");


    save();


    toast(
        "💼 Schicht beendet: +" +
        reward +
        " Coins, +" +
        gainedXP +
        " XP"
    );


    jobs();

}

                <p class="cooldown">

                </p>

        `;

    }


    if(player.energy >= 100){

        document.getElementById("content").innerHTML = `

                <p>

/* =====================================================
   AUSRÜSTEN
===================================================== */

function equip(id){

    const item =
        getItem(id);


    if(!item || item.uses <= 0)
        return;


    const data =
        items[item.name];


    if(!data)
        return;


    /*
       Nur ein Item derselben Kategorie
       gleichzeitig.
    */

    player.inventory.forEach(other => {

        if(
            other.id !== item.id &&
            other.equipped === true &&
            items[other.name] &&
            items[other.name].effect === data.effect
        ){

            other.equipped = false;

        }

    });


    item.equipped = true;


    save();


    toast(
        "⚙️ " +
        item.name +
        " ausgerüstet"
    );


    inventory();

}


function unequip(id){

    const item =
        getItem(id);


    if(!item)
        return;


    item.equipped = false;


    save();


    toast(
        "↩️ Item abgelegt"
    );


    inventory();

}


/* =====================================================
   ENERGIE ITEMS BENUTZEN
===================================================== */

function useEnergy(id){

    const item =
        getItem(id);


    if(!item)
        return;


    const data =
        items[item.name];


    if(
        !data ||
        data.effect !== "energy"
    )
        return;


    if(player.energy >= 100){

        toast(
            "⚡ Deine Energie ist bereits voll."
        );

        return;

    }


    player.energy =
        Math.min(
            100,
            player.energy + data.value
        );


    if(data.happy){

        player.happiness =
            Math.min(
                100,
                player.happiness + data.happy
            );

    }


    item.uses--;


    if(item.uses <= 0){

        const index =
            player.inventory.indexOf(item);

        if(index !== -1)
            player.inventory.splice(index,1);

    }


    save();


    toast(
        "🥤 Item benutzt!"
    );


    inventory();

}

                "/api/admin/stats",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        password:
                            adminPassword
                    })

                }
            );


        if(!response.ok){

            adminPassword = null;

            sessionStorage.removeItem(
                "cubixAdmin"
            );

            showAdminButton();

            toast(
                "🔐 Admin-Sitzung abgelaufen."
            );

            return;

        }


        const data =
            await response.json();


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="admin-panel">

                <h2 class="admin-title">
                    👑 CUBIX ADMIN
                </h2>

                <div class="card">

                    <h3>
                        👥 Spieler online
                    </h3>

                    <p class="online">
                        🟢
                        ${data.onlinePlayers}
                        Spieler online
                    </p>

                    <button
                        class="action"
                        onclick="adminPanel()">
                        🔄 Aktualisieren
                    </button>

                </div>


                <div class="card">

                    <h3>
                        💰 Eigene Coins vergeben
                    </h3>

                    <input
                        id="adminCoins"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="z.B. 10000">

                    <button
                        class="action green"
                        onclick="adminGiveCoins()">
                        💰 Coins hinzufügen
                    </button>

                </div>


                <div class="card">

                    <h3>
                        ⭐ Eigene XP vergeben
                    </h3>

                    <input
                        id="adminXP"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="z.B. 5000">

                    <button
                        class="action green"
                        onclick="adminGiveXP()">
                        ⭐ XP hinzufügen
                    </button>

                </div>


                <div class="card">

                    <h3>
                        🔐 Admin-Sitzung
                    </h3>

                    <button
                        class="action gray"
                        onclick="adminLogout()">
                        Admin verlassen
                    </button>

                </div>

            </div>

        `;


    }catch(e){

        toast(
            "❌ Admin-Bereich konnte nicht geladen werden."
        );

    }

}


function adminGiveCoins(){

    const input =
        document.getElementById(
            "adminCoins"
        );


    if(!input)
        return;


    const amount =
        Number(input.value);


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        toast(
            "❌ Ungültige Coin-Anzahl."
        );

        return;

    }


    player.coins +=
        Math.floor(amount);


    save();


    toast(
        "👑 +" +
        Math.floor(amount) +
        " Coins"
    );


    adminPanel();

}


function adminGiveXP(){

    const input =
        document.getElementById(
            "adminXP"
        );


    if(!input)
        return;


    const amount =
        Number(input.value);


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        toast(
            "❌ Ungültige XP-Anzahl."
        );

        return;

    }


    addXP(
        Math.floor(amount)
    );


    save();


    toast(
        "👑 +" +
        Math.floor(amount) +
        " XP"
    );


    adminPanel();

}


function adminLogout(){

    adminPassword = null;


    sessionStorage.removeItem(
        "cubixAdmin"
    );


    showAdminButton();


    home();


    toast(
        "🔐 Admin verlassen."
    );

}


/* =====================================================
   ADMIN URL
===================================================== */

if(
    window.location.pathname === "/admin"
){

    setTimeout(
        () => {

            if(adminPassword){

                showAdminButton();

                adminPanel();

            }else{

                adminLogin();

            }

        },
        150
    );

}


/* =====================================================
   LIVE TIMER
===================================================== */

setInterval(
    () => {

        checkNewDay();

        updateStats();

        const content =
            document.getElementById(
                "content"
            );


        if(!content)
            return;


        /*
           Timer nur neu rendern,
           wenn die entsprechende Seite offen ist.
        */

        if(
            content.innerHTML.includes(
                "Nächste Schicht"
            ) ||
            content.innerHTML.includes(
                "Aktiver Beruf"
            )
        ){

            jobs();

        }

    },
    1000
);


/* =====================================================
   START
===================================================== */

checkNewDay();

updateStats();

showAdminButton();


if(
    window.location.pathname === "/admin"
){

    /*
       Admin-Seite wird oben gestartet.
    */

}else{

    home();

}

</script>

</body>
</html>
