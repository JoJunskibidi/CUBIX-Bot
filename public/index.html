<div class="stat-title">⚡ XP</div>
<div class="stat-value"><span id="xp">0</span>/<span id="xpNeeded">100</span></div>

</div>

</div>

<button onclick="home()">🏠 Stadt</button>

<div class="content" id="content"></div>

</div>

<div class="notice" id="notice"></div>

<script>

// =====================================================
// SPIELER
// =====================================================

let player = JSON.parse(localStorage.getItem("cubixPlayer")) || {
    coins:250,
    xp:0,
    level:1,
    energy:100,
    happiness:70,
    streak:0,
    lastDaily:null,
    inventory:[],
    jobs:{},
    equipped:{},
    itemUses:{},
    timedItems:{}
};

let adminPassword=sessionStorage.getItem("cubixAdmin")||null;


// =====================================================
// HILFSFUNKTIONEN
// =====================================================

function save(){
    localStorage.setItem("cubixPlayer",JSON.stringify(player));
    updateStats();
}

function notice(text){
    const el=document.getElementById("notice");
    el.textContent=text;
    el.classList.add("show");
    clearTimeout(window.noticeTimer);
    window.noticeTimer=setTimeout(()=>el.classList.remove("show"),2600);
}

function xpNeeded(){
    return 100+((player.level-1)*50);
}

function clampStats(){
    player.energy=Math.max(0,Math.min(100,player.energy));
    player.happiness=Math.max(0,Math.min(100,player.happiness));
}

function updateStats(){

    clampStats();

    document.getElementById("coins").textContent=Math.floor(player.coins);
    document.getElementById("level").textContent=player.level;
    document.getElementById("energy").textContent=player.energy;
    document.getElementById("happiness").textContent=player.happiness;
    document.getElementById("xp").textContent=player.xp;
    document.getElementById("xpNeeded").textContent=xpNeeded();

    document.getElementById("energyBar").style.width=player.energy+"%";
    document.getElementById("happyBar").style.width=player.happiness+"%";
    document.getElementById("xpBar").style.width=
        Math.min(100,player.xp/xpNeeded()*100)+"%";

    document.getElementById("adminButton").style.display=
        adminPassword ? "block" : "none";
}

function addXP(amount){

    player.xp+=amount;
    let levels=0;

    while(player.xp>=xpNeeded()){
        player.xp-=xpNeeded();
        player.level++;
        levels++;
    }

    if(levels>0){
        notice("🔥 Level Up! Du bist jetzt Level "+player.level+"!");
    }

    save();
}


// =====================================================
// ITEMS
// =====================================================

const shopItems=[

{
id:"energy",
name:"🥤 Energy Drink",
price:50,
description:"+30 Energie. Einmal verwendbar.",
type:"consumable",
uses:1
},

{
id:"coffee",
name:"☕ Kaffee",
price:35,
description:"+15 Energie und etwas Motivation.",
type:"consumable",
uses:1
},

{
id:"headphones",
name:"🎧 Kopfhörer",
price:150,
description:"5 Jobs lang +10% Coins und weniger Stimmungsverlust.",
type:"job",
uses:5
},

{
id:"controller",
name:"🎮 Controller",
price:250,
description:"5 Nutzungen: +15 Stimmung.",
type:"consumable",
uses:5
},

{
id:"bike",
name:"🚲 Fahrrad",
price:500,
description:"10 Jobs lang etwas weniger Energieverbrauch.",
type:"job",
uses:10
},

{
id:"lunch",
name:"🥪 Lunchbox",
price:120,
description:"3 Nutzungen: +20 Energie.",
type:"consumable",
uses:3
},

{
id:"sneakers",
name:"👟 Arbeitsschuhe",
price:280,
description:"8 Jobs lang −2 Energieverbrauch.",
type:"job",
uses:8
},

{
id:"luckyCharm",
name:"🍀 Glücksbringer",
price:220,
description:"7 Jobs lang kleine Chance auf einen Bonus.",
type:"job",
uses:7
},

{
id:"backpack",
name:"🎒 Rucksack",
price:350,
description:"10 Jobs lang +5% Job-XP.",
type:"job",
uses:10
},

{
id:"smartphone",
name:"📱 Smartphone",
price:450,
description:"7 Dailys lang +10 Coins auf deine Daily-Belohnung.",
type:"daily",
uses:7
},

{
id:"gamingPC",
name:"💻 Gaming PC",
price:750,
description:"10 Programmier-Jobs: +10% XP.",
type:"job",
uses:10
},

{
id:"bed",
name:"🛏️ Bequemes Bett",
price:600,
description:"7 Tage lang Ausruhen gibt zusätzlich +5 Stimmung.",
type:"timed",
days:7
},

{
id:"apartment",
name:"🏠 Kleine Wohnung",
price:1500,
description:"7 Tage lang +25 Coins beim Daily.",
type:"timed",
days:7
},

{
id:"music",
name:"🎵 Musik-Abo",
price:300,
description:"10 Jobs lang −1 Stimmung beim Arbeiten.",
type:"job",
uses:10
},

{
id:"water",
name:"💧 Wasserflasche",
price:90,
description:"3 Nutzungen: +10 Energie und +2 Stimmung.",
type:"consumable",
uses:3
}

];

function getItem(id){
    return shopItems.find(x=>x.id===id);
}

function countItem(id){
    return player.inventory.filter(x=>x===id).length;
}

function addItem(item){

    player.inventory.push(item.id);

    if(item.uses){
        player.itemUses[item.id]=(player.itemUses[item.id]||0)+item.uses;
    }

    if(item.days){
        player.timedItems[item.id]=Date.now()+item.days*86400000;
    }
}

function removeOneItem(id){

    const index=player.inventory.indexOf(id);

    if(index!==-1){
        player.inventory.splice(index,1);
    }
}

function consumeUse(id){

    if(!player.itemUses[id]) return;

    player.itemUses[id]--;

    if(player.itemUses[id]<=0){

        delete player.itemUses[id];

        if(player.equipped[id]){
            delete player.equipped[id];
        }

        removeOneItem(id);
    }
}

function itemUses(id){
    return player.itemUses[id]||0;
}

function timedActive(id){

    return player.timedItems[id] &&
           Date.now()<player.timedItems[id];
}

// HOME
// =====================================================

function home(){

    document.getElementById("content").innerHTML=`

<h2>🏠 Willkommen in CUBIX CITY</h2>

<p class="muted">
Verdiene Geld, manage deine Energie und Stimmung
und baue deine Sammlung auf.
</p>

<div class="home-grid">

<div class="big-card">
<h3>💼 Jobs</h3>

</div>

<div class="big-card">

<button onclick="daily()">Daily öffnen</button>
</div>

<div class="big-card">
<h3>🎒 Inventar</h3>
<p>${player.inventory.length} Items in deiner Sammlung.</p>
<button onclick="inventory()">Inventar öffnen</button>
</div>

<div class="big-card">
<h3>👥 CUBIX CITY</h3>
<p><span class="online" id="onlineCount">🟢 Lade...</span></p>

</div>

updateOnline();

// =====================================================
// JOBS
// =====================================================

const jobList=[

{
id:"trash",
emoji:"🧹",
name:"Müll sammeln",
reward:20,
xp:10,
energy:5,
happy:2,
cooldown:15000
},

{
id:"pizza",
emoji:"🍕",
name:"Pizza liefern",
reward:50,
xp:25,
energy:10,
happy:2,
cooldown:30000
},

{
id:"taxi",
emoji:"🚕",
name:"Taxi fahren",
reward:100,
xp:50,
energy:15,
happy:3,
cooldown:60000
},

{
id:"developer",
emoji:"💻",
name:"Programmieren",
reward:200,
xp:100,
energy:20,
happy:4,
cooldown:120000
}

];

function jobs(){

    let html=`
<h2>💼 Jobs</h2>
<p class="muted">Arbeiten bringt Coins und XP, kostet aber Energie und Stimmung.</p>
`;

    jobList.forEach(job=>{

        const last=player.jobs[job.id]||0;

        const remaining=Math.max(
            0,
            job.cooldown-(Date.now()-last)
        );

        const seconds=Math.ceil(remaining/1000);

        let disabled=remaining>0||player.energy<job.energy;

        html+=`

<div class="card">

<h3>${job.emoji} ${job.name}</h3>

<p>
💰 +${job.reward} Coins<br>
⭐ +${job.xp} XP<br>
⚡ −${job.energy} Energie<br>
😊 −${job.happy} Stimmung
</p>

${
remaining>0
?
`<button class="action gray" disabled>⏳ ${seconds}s warten</button>`
:
player.energy<job.energy
?
`<button class="action gray" disabled>⚡ Zu wenig Energie</button>`
:
`<button class="action" onclick="work('${job.id}')">Arbeiten</button>`
}

</div>
`;

    });

    document.getElementById("content").innerHTML=html;
}

function work(id){

    const job=jobList.find(x=>x.id===id);
    if(!job)return;

    const last=player.jobs[id]||0;

    if(Date.now()-last<job.cooldown){
        notice("⏳ Dieser Job ist noch nicht bereit.");
        return;
    }

    if(player.energy<job.energy){
        notice("⚡ Du hast nicht genug Energie.");
        return;
    }

    let reward=job.reward;
    let xp=job.xp;
    let energyCost=job.energy;
    let happyCost=job.happy;

    // Kopfhörer
    if(player.equipped.headphones && itemUses("headphones")>0){
        reward=Math.round(reward*1.10);
        happyCost=Math.max(0,happyCost-1);
        consumeUse("headphones");
    }

    // Fahrrad
    if(player.equipped.bike && itemUses("bike")>0){
        energyCost=Math.max(1,energyCost-3);
        consumeUse("bike");
    }

    // Arbeitsschuhe
    if(player.equipped.sneakers && itemUses("sneakers")>0){
        energyCost=Math.max(1,energyCost-2);
        consumeUse("sneakers");
    }

    // Rucksack
    if(player.equipped.backpack && itemUses("backpack")>0){
        xp=Math.round(xp*1.05);
        consumeUse("backpack");
    }

    // Gaming PC nur beim Programmieren
    if(
        job.id==="developer" &&
        player.equipped.gamingPC &&
        itemUses("gamingPC")>0
    ){
        xp=Math.round(xp*1.10);
        consumeUse("gamingPC");
    }

    // Musik
    if(player.equipped.music && itemUses("music")>0){
        happyCost=Math.max(0,happyCost-1);
        consumeUse("music");
    }

    // Glücksbringer
    if(
        player.equipped.luckyCharm &&
        itemUses("luckyCharm")>0
    ){
        if(Math.random()<0.15){
            reward+=Math.max(5,Math.round(job.reward*.20));
            notice("🍀 Glücksbringer! Kleiner Bonus!");
        }
        consumeUse("luckyCharm");
    }

    player.jobs[id]=Date.now();

    player.coins+=reward;
    player.energy-=energyCost;
    player.happiness-=happyCost;

    addXP(xp);
    save();

    notice(
        `💼 +${reward} Coins · +${xp} XP · ⚡ -${energyCost} · 😊 -${happyCost}`
    );

    jobs();
}


// =====================================================
// REST
// =====================================================

function rest(){

    if(player.energy>=100 && player.happiness>=100){
        notice("😌 Du bist bereits komplett erholt.");
        return;
    }

    player.energy=Math.min(100,player.energy+20);
    player.happiness=Math.min(100,player.happiness+5);

    if(player.equipped.bed && timedActive("bed")){
        player.happiness=Math.min(100,player.happiness+5);
    }

    save();

    notice("🛌 Du hast dich ausgeruht: +20 Energie, +5 Stimmung.");
}


// =====================================================
// DAILY
// =====================================================

function daily(){

    const today=new Date().toISOString().slice(0,10);

    if(player.lastDaily===today){

        document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3>😴 Schon abgeholt!</h3>

<p>Du kannst morgen wieder deine Belohnung abholen.</p>

<p class="warning">🔥 Streak: ${player.streak}</p>

</div>
`;

        return;
    }

    player.lastDaily=today;
    player.streak++;

    let reward=100+((player.streak-1)*10);

    // Smartphone
    if(player.equipped.smartphone && itemUses("smartphone")>0){
        reward+=10;
        consumeUse("smartphone");
    }

    // Wohnung
    if(timedActive("apartment")){
        reward+=25;
    }

    player.coins+=reward;
    player.energy=Math.min(100,player.energy+5);
    player.happiness=Math.min(100,player.happiness+5);

    addXP(20);
    save();

    document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3 class="success">🎉 Belohnung erhalten!</h3>

<p>💰 +${reward} Coins</p>
<p>⭐ +20 XP</p>
<p>⚡ +5 Energie</p>
<p>😊 +5 Stimmung</p>
<p>🔥 Streak: ${player.streak}</p>

</div>
`;
}


// =====================================================
// SHOP
// =====================================================

function shop(){

    let html=`
<h2>🏪 CUBIX Shop</h2>
<p class="muted">Kaufe Items und rüste sie im Inventar aus.</p>
`;

    shopItems.forEach((item,index)=>{

        html+=`

<div class="card">

<h3>${item.name}</h3>

<p>${item.description}</p>

<p>💰 <strong>${item.price} Coins</strong></p>

<button class="action"
onclick="buy(${index})"
${player.coins<item.price?"disabled":""}>
Kaufen
</button>

</div>
`;
    });

    document.getElementById("content").innerHTML=html;
}

function buy(index){

    const item=shopItems[index];

    if(player.coins<item.price){
        notice("❌ Nicht genug Coins.");
        return;
    }

    player.coins-=item.price;
    addItem(item);

    save();

    notice("🛍️ "+item.name+" gekauft!");

    shop();
}


// =====================================================
// INVENTAR
// =====================================================

function inventory(){

    // abgelaufene Zeititems entfernen
    Object.keys(player.timedItems).forEach(id=>{
        if(!timedActive(id)){
            delete player.timedItems[id];

            if(player.equipped[id]){
                delete player.equipped[id];
            }

            removeOneItem(id);
        }
    });

    if(player.inventory.length===0){

        document.getElementById("content").innerHTML=`

<h2>🎒 Inventar</h2>

<div class="card">
Dein Inventar ist leer.<br><br>
Besuche den Shop und kaufe dein erstes Item!
</div>
`;
        return;
    }

    let html=`
<h2>🎒 Dein Inventar</h2>
<p class="muted">Items mit Nutzungslimit werden automatisch verbraucht.</p>

<div class="inventory">
`;

    const unique=[...new Set(player.inventory)];

    unique.forEach(id=>{

        const item=getItem(id);
        if(!item)return;

        const count=countItem(id);
        const equipped=player.equipped[id];

        let status="";

        if(item.uses){
            status=`<span class="badge">🔋 ${itemUses(id)} Nutzungen</span>`;
        }

        if(item.days && timedActive(id)){
            const days=Math.ceil(
                (player.timedItems[id]-Date.now())/86400000
            );
            status=`<span class="badge">⏱️ ${days} Tage</span>`;
        }

        html+=`

<div class="item ${equipped?"active":""}">

<h3>${item.name}</h3>

<p>${item.description}</p>

<p>
Besitz: ${count}<br>
${status}
</p>

${
item.type==="consumable"
?
`<button class="action green"
onclick="useItem('${id}')">
Benutzen
</button>`
:
item.type==="job" || item.type==="daily"
?
`<button class="action ${equipped?"gray":"green"}"
onclick="toggleEquip('${id}')">
${equipped?"Ausgerüstet ✓":"Ausrüsten"}
</button>`
:
item.type==="timed"
?
`<button class="action gray" disabled>
${equipped?"Aktiv ✓":"Automatisch aktiv"}
</button>`

`;
    });

    html+="</div>";

// ITEM BENUTZEN
// =====================================================

function useItem(id){

    if(countItem(id)<=0){
        notice("❌ Dieses Item besitzt du nicht.");
        return;
    }

    if(id==="energy"){

        player.energy=Math.min(100,player.energy+30);
        consumeUse(id);
        save();
        notice("🥤 +30 Energie");
    }

    else if(id==="coffee"){

        player.energy=Math.min(100,player.energy+15);
        player.happiness=Math.min(100,player.happiness+3);
        consumeUse(id);
        save();
        notice("☕ +15 Energie · +3 Stimmung");
    }

    else if(id==="controller"){

        player.happiness=Math.min(100,player.happiness+15);
        consumeUse(id);
        save();
        notice("🎮 +15 Stimmung");
    }

    else if(id==="lunch"){

        player.energy=Math.min(100,player.energy+20);
        consumeUse(id);
        save();
        notice("🥪 +20 Energie");
    }

    else if(id==="water"){

        player.energy=Math.min(100,player.energy+10);
        player.happiness=Math.min(100,player.happiness+2);
        consumeUse(id);
        save();
        notice("💧 +10 Energie · +2 Stimmung");
    }

    inventory();
}


// =====================================================
// AUSRÜSTEN
// =====================================================

function toggleEquip(id){

    if(countItem(id)<=0)return;

    if(player.equipped[id]){
        delete player.equipped[id];
        save();
        notice("↩️ Item abgelegt.");
        inventory();
        return;
    }

    player.equipped[id]=true;

    save();

    notice("⚙️ Item ausgerüstet!");

    inventory();
}

function adminLogin(){

    const password=prompt("👑 Admin-Passwort:");

    if(!password)return;

    fetch("/api/admin/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password})
    })
    .then(r=>{
        if(!r.ok)throw new Error();
        return r.json();
    })
    .then(data=>{

        if(data.success){

            adminPassword=password;

            sessionStorage.setItem(
                "cubixAdmin",
                password
            );

            updateStats();
            adminPanel();
        }

    })
    .catch(()=>{
        notice("❌ Falsches Admin-Passwort.");
    });
}
