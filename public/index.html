<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at top,#3b0a0a 0%,#160505 35%,#050505 80%);
    color:#fff
}
button{
    border:0;
    color:#fff;
    cursor:pointer;
    font-weight:bold
}
button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none!important
}
.app{
    width:100%;
    max-width:900px;
    min-height:100vh;
    margin:auto;
    padding:12px
}
.header{
    background:#090909;
    border:1px solid #571414;
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 10px 35px rgba(0,0,0,.45)
}
.logo{
    text-align:center;
    font-size:34px;
    font-weight:900
}
.subtitle{
    text-align:center;
    color:#999;
    margin:6px 0 18px
}
.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px
}
.stat{
    background:#111;
    border:1px solid #351010;
    border-radius:12px;
    padding:10px 5px;
    text-align:center
}
.stat-title{
    color:#999;
    font-size:11px
}
.stat-value{
    margin-top:5px;
    font-size:17px;
    font-weight:bold
}
.bar{
    height:6px;
    margin-top:6px;
    background:#291010;
    border-radius:20px;
    overflow:hidden
}
.progress{
    height:100%;
    width:0%;
    transition:.3s
}
.energy{background:#d97706}
.happy{background:#db2777}
.xp{background:#b91c1c}
.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px
}
.menu button{
    padding:13px 6px;
    border-radius:12px;
    background:#100909;
    border:1px solid #4a1212
}
.menu button:hover{
    background:#250b0b;
    transform:translateY(-2px)
}
.content{
    background:#080808;
    border:1px solid #4a1212;
    border-radius:20px;
    padding:20px;
    min-height:450px
}
.card{
    background:#120909;
    border:1px solid #451111;
    border-radius:14px;
    padding:16px;
    margin:10px 0
}
.card h3{margin-top:0}
.action{
    width:100%;
    padding:13px;
    margin-top:9px;
    border-radius:10px;
    background:#991b1b
}
.action:hover{background:#b91c1c}
.green{background:#166534}
.blue{background:#1d4ed8}
.gray{background:#3f3f46}
.pink{background:#9d174d}
.gold{background:#92400e}
.danger{background:#7f1d1d}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}
.item{
    background:#120909;
    border:1px solid #451111;
    border-radius:12px;
    padding:15px
}
.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#261010;
    color:#ddd;
    font-size:12px;
    margin:3px
}
.good{color:#4ade80}
.warn{color:#fbbf24}
.bad{color:#f87171}
.muted{color:#999}
input{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:9px;
    border:1px solid #571414;
    background:#080808;
    color:#fff
}
.online{
    display:inline-block;
    padding:7px 11px;
    border-radius:20px;
    background:#092b16;
    color:#6ee7a0
}
.equipped{
    border-color:#b91c1c;
    box-shadow:0 0 12px rgba(185,28,28,.18)
}
.small{
    font-size:13px
}
@media(max-width:700px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .menu{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
}
</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo">🔥 CUBIX CITY</div>

<div class="subtitle">
Deine Stadt. Dein Charakter. Dein Fortschritt.
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">💰 COINS</div>
<div class="stat-value" id="coins">250</div>
</div>

<div class="stat">
<div class="stat-title">⭐ LEVEL</div>
<div class="stat-value" id="level">1</div>
</div>

<div class="stat">
<div class="stat-title">⚡ ENERGIE</div>
<div class="stat-value" id="energy">100</div>
<div class="bar"><div class="progress energy" id="energyBar"></div></div>
</div>

<div class="stat">
<div class="stat-title">😊 GLÜCK</div>
<div class="stat-value" id="happiness">70</div>
<div class="bar"><div class="progress happy" id="happyBar"></div></div>
</div>

<div class="stat">
<div class="stat-title">⚡ XP</div>
<div class="stat-value"><span id="xp">0</span>/<span id="xpNeeded">100</span></div>
<div class="bar"><div class="progress xp" id="xpBar"></div></div>
</div>

</div>
</div>

<div class="menu">

<button onclick="home()">🏠 Stadt</button> <button onclick="jobs()">💼 Jobs</button> <button onclick="shop()">🏪 Shop</button> <button onclick="inventory()">🎒 Inventar</button> <button onclick="rest()">😴 Ausruhen</button> <button onclick="fun()">🎮 Freizeit</button> <button onclick="daily()">🎁 Daily</button> <button onclick="profile()">👤 Profil</button>

</div>

<div id="content" class="content"></div>

</div>

<script>

/* =====================================================
   SPIELER
===================================================== */

const defaultPlayer={
    coins:250,
    xp:0,
    level:1,
    energy:100,
    happiness:70,
    streak:0,
    lastDaily:null,
    inventory:[],
    equipped:null,
    jobs:{},
    lastRest:0,
    lastFun:0
};

let player=JSON.parse(localStorage.getItem("cubixPlayer"))||defaultPlayer;


/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function save(){
    localStorage.setItem("cubixPlayer",JSON.stringify(player));
    updateStats();
}

function clamp(value,min=0,max=100){
    return Math.max(min,Math.min(max,value));
}

function xpNeeded(){
    return 100+(player.level-1)*50;
}

function updateStats(){

    document.getElementById("coins").textContent=player.coins;
    document.getElementById("level").textContent=player.level;
    document.getElementById("energy").textContent=player.energy;
    document.getElementById("happiness").textContent=player.happiness;
    document.getElementById("xp").textContent=player.xp;
    document.getElementById("xpNeeded").textContent=xpNeeded();

    document.getElementById("energyBar").style.width=player.energy+"%";
    document.getElementById("happyBar").style.width=player.happiness+"%";

    document.getElementById("xpBar").style.width=
        Math.min(100,player.xp/xpNeeded()*100)+"%";
}

function addXP(amount){

    player.xp+=amount;

    while(player.xp>=xpNeeded()){
        player.xp-=xpNeeded();
        player.level++;
    }

    save();
}

function spendEnergy(amount){
    player.energy=clamp(player.energy-amount);
}

function gainEnergy(amount){
    player.energy=clamp(player.energy+amount);
}

function gainHappy(amount){
    player.happiness=clamp(player.happiness+amount);
}

function loseHappy(amount){
    player.happiness=clamp(player.happiness-amount);
}

function hasItem(name){
    return player.inventory.some(x=>x.name===name);
}

function getItem(name){
    return player.inventory.find(x=>x.name===name);
}

function equippedItem(){
    return player.equipped ? getItem(player.equipped) : null;
}


/* =====================================================
   HOME
===================================================== */

function home(){

document.getElementById("content").innerHTML=`

<h2>🏠 CUBIX CITY</h2>

<p>
Willkommen zurück! Kümmere dich um deinen Charakter,
verdiene Geld und verbessere dein Leben.
</p>

<div class="grid">

<div class="card">
<h3>💼 Arbeiten</h3>
<p>Verdiene Coins und XP, aber achte auf deine Energie.</p>
<button class="action" onclick="jobs()">Jobs ansehen</button>
</div>

<div class="card">
<h3>😴 Erholung</h3>
<p>Energie und Glücklichkeit sind wichtig, um effektiv zu bleiben.</p>
<button class="action blue" onclick="rest()">Ausruhen</button>
</div>

<div class="card">
<h3>🎮 Freizeit</h3>
<p>Mach etwas Spaß, wenn deine Glücklichkeit sinkt.</p>
<button class="action pink" onclick="fun()">Freizeit</button>
</div>

<div class="card">
<h3>🎒 Ausrüstung</h3>
<p>${player.inventory.length} Items im Inventar.</p>
<button class="action gray" onclick="inventory()">Inventar</button>
</div>

</div>

`;

updateStats();

}


/* =====================================================
   JOBS
===================================================== */

const jobList=[

{
id:"trash",
emoji:"🧹",
name:"Müll sammeln",
reward:20,
xp:10,
energy:12,
happy:5,
cooldown:15000
},

{
id:"pizza",
emoji:"🍕",
name:"Pizza liefern",
reward:50,
xp:25,
energy:20,
happy:7,
cooldown:30000
},

{
id:"taxi",
emoji:"🚕",
name:"Taxi fahren",
reward:100,
xp:50,
energy:30,
happy:10,
cooldown:60000
},

{
id:"developer",
emoji:"💻",
name:"Programmieren",
reward:200,
xp:100,
energy:40,
happy:12,
cooldown:120000
}

];

function jobs(){

let html=`
<h2>💼 Jobs</h2>
<p class="muted">
Arbeiten bringt Geld und XP, kostet aber Energie und Glücklichkeit.
</p>
`;

jobList.forEach(job=>{

let last=player.jobs[job.id]||0;
let remaining=Math.max(0,job.cooldown-(Date.now()-last));

let seconds=Math.ceil(remaining/1000);

let energyCost=job.energy;

if(player.equipped==="🚲 Fahrrad"){
    energyCost=Math.max(1,energyCost-5);
}

let reward=job.reward;

if(player.equipped==="🎧 Kopfhörer"){
    reward=Math.floor(reward*1.08);
}

if(player.happiness>=80){
    reward=Math.floor(reward*1.05);
}

if(player.happiness<25){
    reward=Math.floor(reward*.8);
}

let disabled=
    remaining>0 ||
    player.energy<energyCost ||
    player.happiness<=0;

html+=`

<div class="card">

<h3>${job.emoji} ${job.name}</h3>

<p>
💰 +${reward} Coins<br>
⭐ +${job.xp} XP<br>
⚡ -${energyCost} Energie<br>
😊 -${job.happy} Glücklichkeit
</p>

${
remaining>0
?
`<button class="action gray" disabled>⏳ Noch ${seconds}s</button>`
:
player.energy<energyCost
?
`<button class="action gray" disabled>⚡ Zu wenig Energie</button>`
:
`<button class="action" onclick="work('${job.id}')">Arbeiten</button>`
}

</div>

`;

});

document.getElementById("content").innerHTML=html;

}

function work(id){

const job=jobList.find(x=>x.id===id);

if(!job)return;

const last=player.jobs[id]||0;

if(Date.now()-last<job.cooldown)return;

let energyCost=job.energy;

if(player.equipped==="🚲 Fahrrad"){
    energyCost=Math.max(1,energyCost-5);
}

if(player.energy<energyCost){
    jobs();
    return;
}

let reward=job.reward;

if(player.equipped==="🎧 Kopfhörer"){
    reward=Math.floor(reward*1.08);
}

if(player.happiness>=80){
    reward=Math.floor(reward*1.05);
}

if(player.happiness<25){
    reward=Math.floor(reward*.8);
}

player.jobs[id]=Date.now();
player.coins+=reward;

spendEnergy(energyCost);
loseHappy(job.happy);
addXP(job.xp);

/* Ausrüstung abnutzen */

if(player.equipped==="🎧 Kopfhörer") useEquipped(1);
if(player.equipped==="🚲 Fahrrad") useEquipped(1);

save();
jobs();

}


/* =====================================================
   ERHOLEN
===================================================== */

function rest(){

const now=Date.now();
const cooldown=30000;

if(now-player.lastRest<cooldown){

const seconds=Math.ceil(
(cooldown-(now-player.lastRest))/1000
);

document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<h3>🛌 Du brauchst eine Pause</h3>

<p>
Du kannst dich bald wieder ausruhen.
</p>

<p class="warn">⏳ Noch ${seconds} Sekunden</p>

</div>

`;

return;
}

player.lastRest=now;

let energy=15;
let happy=3;

if(player.equipped==="🏠 Kleine Wohnung"){
    energy+=5;
    happy+=4;
}

gainEnergy(energy);
gainHappy(happy);

save();

document.getElementById("content").innerHTML=`

<h2>😴 Erholung</h2>

<div class="card">

<h3 class="good">🌙 Erholt!</h3>

<p>⚡ +${energy} Energie</p>
<p>😊 +${happy} Glücklichkeit</p>

<p class="muted">
Du kannst dich in 30 Sekunden wieder ausruhen.
</p>

</div>

`;

}


/* =====================================================
   FREIZEIT
===================================================== */

function fun(){

const now=Date.now();
const cooldown=45000;

if(player.energy<10){

document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<h3>⚡ Zu wenig Energie</h3>
<p>Du bist zu erschöpft. Ruh dich zuerst etwas aus.</p>

<button class="action blue" onclick="rest()">😴 Ausruhen</button>

</div>

`;

return;
}

if(now-player.lastFun<cooldown){

const seconds=Math.ceil(
(cooldown-(now-player.lastFun))/1000
);

document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<h3>⏳ Noch nicht bereit</h3>

<p>
Du brauchst kurz eine Pause vom Zocken.
</p>

<p class="warn">${seconds} Sekunden</p>

</div>

`;

return;
}

let happy=15;

if(player.equipped==="🎮 Controller"){
    happy+=8;
    useEquipped(1);
}

if(player.equipped==="💻 Gaming PC"){
    happy+=5;
    useEquipped(1);
}

player.lastFun=now;

spendEnergy(10);
gainHappy(happy);

save();

document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<h3 class="good">😎 Spaß gehabt!</h3>

<p>😊 +${happy} Glücklichkeit</p>
<p>⚡ -10 Energie</p>

</div>

`;

}


/* =====================================================
   SHOP
===================================================== */

const shopItems=[

{
name:"🥤 Energy Drink",
price:50,
type:"consumable",
description:"+30 Energie. Wird sofort verbraucht."
},

{
name:"🎧 Kopfhörer",
price:180,
type:"equipment",
uses:15,
description:"Beim Arbeiten +8% Coins. Nutzt sich bei Jobs ab."
},

{
name:"🎮 Controller",
price:220,
type:"equipment",
uses:12,
description:"Beim Zocken mehr Glücklichkeit. Nutzt sich beim Zocken ab."
},

{
name:"🚲 Fahrrad",
price:400,
type:"equipment",
uses:20,
description:"Jobs benötigen 5 weniger Energie. Nutzt sich bei Jobs ab."
},

{
name:"💻 Gaming PC",
price:700,
type:"equipment",
uses:15,
description:"Freizeit bringt etwas mehr Glücklichkeit."
},

{
name:"🏠 Kleine Wohnung",
price:1500,
type:"equipment",
uses:999999,
description:"Beim Ausruhen bekommst du mehr Energie und Glück."
},

{
name:"🍔 Burger",
price:80,
type:"consumable",
description:"+20 Energie und +5 Glücklichkeit."
},

{
name:"☕ Kaffee",
price:35,
type:"consumable",
description:"+15 Energie. Ein schneller kleiner Boost."
},

{
name:"🎵 Musikbox",
price:300,
type:"equipment",
uses:18,
description:"Beim Ausruhen +2 zusätzliche Glücklichkeit."
}

];

function shop(){

let html=`

<h2>🏪 CUBIX SHOP</h2>

<p class="muted">
Kaufe Dinge, die deinen Alltag verbessern.
</p>

`;

shopItems.forEach((item,index)=>{

html+=`

<div class="card">

<h3>${item.name}</h3>

<p>${item.description}</p>

<p>💰 <strong>${item.price} Coins</strong></p>

<button class="action"
onclick="buy(${index})">
Kaufen
</button>

</div>

`;

});

document.getElementById("content").innerHTML=html;

}

function buy(index){

const item=shopItems[index];

if(player.coins<item.price){

document.getElementById("content").innerHTML=`

<h2>🏪 Shop</h2>

<div class="card">

<h3 class="bad">❌ Nicht genug Coins</h3>

<p>Du brauchst ${item.price} Coins.</p>

<button class="action" onclick="shop()">Zurück zum Shop</button>

</div>

`;

return;
}

player.coins-=item.price;

if(item.type==="consumable"){

/* Verbrauchsitems werden direkt ins Inventar gelegt */
player.inventory.push({
    name:item.name,
    type:"consumable"
});

}else{

player.inventory.push({
    name:item.name,
    type:"equipment",
    uses:item.uses
});

}

addXP(5);
save();
shop();

}


/* =====================================================
   INVENTAR
===================================================== */

function inventory(){

if(player.inventory.length===0){

document.getElementById("content").innerHTML=`

<h2>🎒 Inventar</h2>

<div class="card">

<h3>📦 Noch nichts vorhanden</h3>

<p>Besuche den Shop und kaufe deine erste Ausrüstung.</p>

<button class="action" onclick="shop()">🏪 Shop öffnen</button>

</div>

`;

return;
}

let html=`

<h2>🎒 Inventar</h2>

<p class="muted">
Ausrüstung kann angelegt werden. Verbrauchsitems werden benutzt.
</p>

`;

player.inventory.forEach((item,index)=>{

let equipped=player.equipped===item.name;

let button="";

if(item.type==="consumable"){

button=`
<button class="action green"
onclick="useItem(${index})">
Benutzen
</button>
`;

}else{

button=`

<button class="action ${equipped?"gray":"blue"}"
onclick="equip(${index})">

${equipped?"✓ Ausgerüstet":"Ausrüsten"}

</button>

`;

}

html+=`

<div class="item ${equipped?"equipped":""}">

<h3>${item.name}</h3>

${
item.type==="equipment"
?
`<p class="small">🔧 Haltbarkeit: ${item.uses}</p>`
:
`<p class="small">🥤 Verbrauchsitem</p>`
}

${equipped?`<span class="badge">✓ AUSGERÜSTET</span>`:""}

${button}

</div>

`;

});

document.getElementById("content").innerHTML=html;

}

function equip(index){

const item=player.inventory[index];

if(!item||item.type!=="equipment")return;

player.equipped=item.name;

save();
inventory();

}

function useItem(index){

const item=player.inventory[index];

if(!item)return;

if(item.name==="🥤 Energy Drink"){

gainEnergy(30);

}else if(item.name==="🍔 Burger"){

gainEnergy(20);
gainHappy(5);

}else if(item.name==="☕ Kaffee"){

gainEnergy(15);

}

player.inventory.splice(index,1);

save();
inventory();

}

function useEquipped(amount){

const item=equippedItem();

if(!item)return;

if(item.uses<900000){

item.uses-=amount;

if(item.uses<=0){

player.inventory=player.inventory.filter(
x=>x!==item
);

player.equipped=null;

}

}

}


/* =====================================================
   DAILY
===================================================== */

function daily(){

const today=new Date().toISOString().slice(0,10);

if(player.lastDaily===today){

document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3>😴 Schon abgeholt</h3>

<p>
Komm morgen wieder.
</p>

<p>🔥 Streak: ${player.streak}</p>

</div>

`;

return;
}

player.lastDaily=today;
player.streak++;

const reward=100+Math.min(100,(player.streak-1)*10);

player.coins+=reward;
gainHappy(5);
gainEnergy(10);
addXP(20);

save();

document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3 class="good">🎉 Belohnung erhalten!</h3>

<p>💰 +${reward} Coins</p>
<p>⭐ +20 XP</p>
<p>⚡ +10 Energie</p>
<p>😊 +5 Glücklichkeit</p>
<p>🔥 Streak: ${player.streak}</p>

</div>

`;

}


/* =====================================================
   PROFIL
===================================================== */

function profile(){

const equipped=player.equipped||"Keine";

document.getElementById("content").innerHTML=`

<h2>👤 Profil</h2>

<div class="card">

<h3>📊 Deine Statistik</h3>

<p>💰 Coins: ${player.coins}</p>
<p>⭐ Level: ${player.level}</p>
<p>⚡ Energie: ${player.energy}/100</p>
<p>😊 Glücklichkeit: ${player.happiness}/100</p>
<p>⚡ XP: ${player.xp}/${xpNeeded()}</p>
<p>🔥 Daily Streak: ${player.streak}</p>
<p>🎒 Items: ${player.inventory.length}</p>
<p>🛡️ Ausgerüstet: ${equipped}</p>

</div>

`;


/* =====================================================
   ONLINE
===================================================== */

updateStats();

async function heartbeat(){

try{

const response=await fetch("/api/heartbeat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
playerId:getPlayerId()
})
});

if(!response.ok)return;

}catch(e){}

}

function getPlayerId(){

let id=localStorage.getItem("cubixPlayerId");

if(!id){

id=crypto.randomUUID();

localStorage.setItem("cubixPlayerId",id);

}

return id;

}

setInterval(heartbeat,30000);
heartbeat();


/* =====================================================
   START
===================================================== */

home();

</script>

</body>
</html>
