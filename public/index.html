<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUBIX CITY</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #263b66 0%, #111827 45%, #080b12 100%);
    color: white;
}

button {
    border: 0;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.app {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
}

.header {
    background: rgba(17, 24, 39, .92);
    border: 1px solid #374151;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 15px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #111827;
    border-radius: 14px;
    padding: 13px;
    text-align: center;
}

.stat-title {
    font-size: 12px;
    color: #9ca3af;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

.xp-bar {
    height: 8px;
    background: #374151;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 8px;
}

.xp-progress {
    height: 100%;
    width: 0%;
    background: #60a5fa;
    transition: width .3s;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.menu button {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 14px;
    padding: 15px 10px;
    transition: .15s;
}

.menu button:hover {
    transform: translateY(-2px);
    background: #374151;
}

.content {
    background: rgba(17, 24, 39, .95);
    border: 1px solid #374151;
    border-radius: 20px;
    padding: 22px;
    min-height: 420px;
}

h2 {
    margin-top: 0;
}

.card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 15px;
    padding: 18px;
    margin: 10px 0;
}

.card h3 {
    margin-top: 0;
}

.action {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: #2563eb;
    margin-top: 10px;
}

.action:hover {
    background: #1d4ed8;
}

.green {
    background: #15803d;
}

.green:hover {
    background: #166534;
}

.red {
    background: #b91c1c;
}

.gray {
    background: #4b5563;
}

.warning {
    color: #fbbf24;
}

.success {
    color: #4ade80;
}

.danger {
    color: #f87171;
}

.home-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.big-card {
    padding: 22px;
    background: #1f2937;
    border-radius: 15px;
    border: 1px solid #374151;
}

.big-card button {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: #374151;
}

.inventory {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.item {
    background: #1f2937;
    border-radius: 12px;
    padding: 15px;
    border: 1px solid #374151;
}

.admin {
    border: 1px solid #ef4444;
}

.admin-title {
    color: #f87171;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #4b5563;
    background: #111827;
    color: white;
    font-size: 16px;
    margin: 8px 0;
}

.online {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #14532d;
    color: #86efac;
    font-weight: bold;
}

@media(max-width: 650px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

    .home-grid {
        grid-template-columns: 1fr;
    }

    .inventory {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">🎮 CUBIX CITY</div>

    <div class="subtitle">
        Deine eigene kleine virtuelle Stadt
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">💰 COINS</div>
            <div class="stat-value" id="coins">250</div>
        </div>

        <div class="stat">
            <div class="stat-title">⭐ LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-title">⚡ XP</div>
            <div class="stat-value">
                <span id="xp">0</span> / <span id="xpNeeded">100</span>
            </div>

            <div class="xp-bar">
                <div class="xp-progress" id="xpProgress"></div>
            </div>
        </div>

    </div>

</div>

<div class="menu">

    <button onclick="home()">🏠 Stadt</button>
    <button onclick="jobs()">💼 Jobs</button>
    <button onclick="shop()">🏪 Shop</button>
    <button onclick="daily()">🎁 Daily</button>
    <button onclick="inventory()">🎒 Inventar</button>
    <button onclick="profile()">👤 Profil</button>

</div>

<div class="content" id="content"></div>

</div>

<script>

// =====================================================
// SPIELDATEN
// =====================================================

let player = JSON.parse(localStorage.getItem("cubixPlayer")) || {
    coins: 250,
    xp: 0,
    level: 1,
    streak: 0,
    lastDaily: null,
    inventory: [],
    jobs: {}
};

let adminPassword = sessionStorage.getItem("cubixAdmin") || null;


// =====================================================
// SPEICHERN
// =====================================================

function save() {
    localStorage.setItem("cubixPlayer", JSON.stringify(player));
    updateStats();
}


// =====================================================
// STATS
// =====================================================

function xpNeeded() {
    return 100 + ((player.level - 1) * 50);
}

function updateStats() {

    document.getElementById("coins").textContent = player.coins;
    document.getElementById("level").textContent = player.level;
    document.getElementById("xp").textContent = player.xp;
    document.getElementById("xpNeeded").textContent = xpNeeded();

    const percentage =
        Math.min(100, (player.xp / xpNeeded()) * 100);

    document.getElementById("xpProgress").style.width =
        percentage + "%";
}


// =====================================================
// XP
// =====================================================

function addXP(amount) {

    player.xp += amount;

    let leveledUp = false;

    while (player.xp >= xpNeeded()) {

        player.xp -= xpNeeded();
        player.level++;

        leveledUp = true;
    }

    if (leveledUp) {
        alert("🎉 LEVEL UP!\n\nDu bist jetzt Level " + player.level + "!");
    }

    save();
}


// =====================================================
// HOME
// =====================================================

function home() {

    document.getElementById("content").innerHTML = `

        <h2>🏠 Willkommen in CUBIX CITY!</h2>

        <p>
            Verdiene Coins, sammle XP, kaufe Gegenstände
            und baue deinen Charakter auf.
        </p>

        <div class="home-grid">

            <div class="big-card">
                <h3>💼 Arbeiten</h3>
                <p>Verdiene Coins durch verschiedene Jobs.</p>
                <button onclick="jobs()">Jobs öffnen</button>
            </div>

            <div class="big-card">
                <h3>🎁 Daily Reward</h3>
                <p>Hole dir jeden Tag deine Belohnung.</p>
                <button onclick="daily()">Daily öffnen</button>
            </div>

            <div class="big-card">
                <h3>🏪 Shop</h3>
                <p>Gib deine Coins für Gegenstände aus.</p>
                <button onclick="shop()">Shop öffnen</button>
            </div>

            <div class="big-card">
                <h3>👥 CUBIX CITY</h3>
                <p>
                    <span class="online" id="onlineCount">
                        Online...
                    </span>
                </p>
            </div>

        </div>
    `;

    updateOnline();
}


// =====================================================
// JOBS
// =====================================================

const jobList = [

    {
        id: "trash",
        emoji: "🧹",
        name: "Müll sammeln",
        reward: 20,
        xp: 10,
        cooldown: 15000
    },

    {
        id: "pizza",
        emoji: "🍕",
        name: "Pizza liefern",
        reward: 50,
        xp: 25,
        cooldown: 30000
    },

    {
        id: "taxi",
        emoji: "🚕",
        name: "Taxi fahren",
        reward: 100,
        xp: 50,
        cooldown: 60000
    },

    {
        id: "developer",
        emoji: "💻",
        name: "Programmieren",
        reward: 200,
        xp: 100,
        cooldown: 120000
    }

];

function jobs() {

    let html = `<h2>💼 Jobs</h2>
    <p>Jeder Job besitzt einen kleinen Cooldown.</p>`;

    jobList.forEach(job => {

        const last =
            player.jobs[job.id] || 0;

        const remaining =
            Math.max(0, job.cooldown - (Date.now() - last));

        const seconds =
            Math.ceil(remaining / 1000);

        html += `

        <div class="card">

            <h3>
                ${job.emoji} ${job.name}
            </h3>

            <p>
                💰 +${job.reward} Coins<br>
                ⭐ +${job.xp} XP
            </p>

            ${
                remaining > 0
                ?
                `<button class="action gray" disabled>
                    ⏳ Noch ${seconds} Sekunden
                </button>`
                :
                `<button class="action"
                    onclick="work('${job.id}')">
                    Arbeiten
                </button>`
            }

        </div>
        `;
    });

    document.getElementById("content").innerHTML = html;
}

function work(id) {

    const job = jobList.find(x => x.id === id);

    if (!job) return;

    const last = player.jobs[id] || 0;

    if (Date.now() - last < job.cooldown) {
        alert("⏳ Dieser Job ist noch nicht bereit.");
        return;
    }

    player.jobs[id] = Date.now();

    player.coins += job.reward;

    addXP(job.xp);

    save();

    alert(
        "💼 Job erledigt!\n\n+" +
        job.reward +
        " Coins\n+" +
        job.xp +
        " XP"
    );

    jobs();
}


// =====================================================
// DAILY
// =====================================================

function daily() {

    const today =
        new Date().toISOString().slice(0, 10);

    if (player.lastDaily === today) {

        document.getElementById("content").innerHTML = `

            <h2>🎁 Daily Reward</h2>

            <div class="card">

                <h3>Schon abgeholt! 😴</h3>

                <p>
                    Du hast deine heutige Belohnung
                    bereits eingesammelt.
                </p>

                <p class="warning">
                    🔥 Aktuelle Streak: ${player.streak}
                </p>

            </div>
        `;

        return;
    }

    player.lastDaily = today;
    player.streak++;

    const reward =
        100 + ((player.streak - 1) * 10);

    player.coins += reward;

    addXP(20);

    save();

    document.getElementById("content").innerHTML = `

        <h2>🎁 Daily Reward</h2>

        <div class="card">

            <h3 class="success">
                🎉 Belohnung abgeholt!
            </h3>

            <p>
                💰 +${reward} Coins
            </p>

            <p>
                ⭐ +20 XP
            </p>

            <p>
                🔥 Streak: ${player.streak}
            </p>

        </div>
    `;
}


// =====================================================
// SHOP
// =====================================================

const shopItems = [

    {
        name: "🥤 Energy Drink",
        price: 50,
        description: "Ein kleiner Boost für deinen Charakter."
    },

    {
        name: "🎧 Kopfhörer",
        price: 150,
        description: "Style +1 😎"
    },

    {
        name: "🎮 Gaming Controller",
        price: 300,
        description: "Jetzt wird gezockt."
    },

    {
        name: "💻 Gaming PC",
        price: 750,
        description: "Das ultimative Setup."
    },

    {
        name: "🚲 Fahrrad",
        price: 500,
        description: "Schneller durch CUBIX CITY."
    },

    {
        name: "🏠 Kleine Wohnung",
        price: 1500,
        description: "Dein erstes eigenes Zuhause."
    }

];

function shop() {

    let html = `
        <h2>🏪 CUBIX Shop</h2>
        <p>Coins ausgeben und deine Sammlung erweitern.</p>
    `;

    shopItems.forEach((item, index) => {

        html += `

        <div class="card">

            <h3>${item.name}</h3>

            <p>${item.description}</p>

            <p>
                💰 <strong>${item.price} Coins</strong>
            </p>

            <button
                class="action"
                onclick="buy(${index})">
                Kaufen
            </button>

        </div>
        `;
    });

    document.getElementById("content").innerHTML = html;
}

function buy(index) {

    const item = shopItems[index];

    if (player.coins < item.price) {

        alert("❌ Du hast nicht genug Coins.");

        return;
    }

    player.coins -= item.price;

    player.inventory.push(item.name);

    addXP(5);

    save();

    alert(
        "🛍️ Gekauft!\n\n" +
        item.name +
        "\n\n- " +
        item.price +
        " Coins"
    );

    shop();
}


// =====================================================
// INVENTAR
// =====================================================

function inventory() {

    if (player.inventory.length === 0) {

        document.getElementById("content").innerHTML = `

            <h2>🎒 Inventar</h2>

            <div class="card">
                Dein Inventar ist noch leer.
                <br><br>
                Besuche den Shop!
            </div>
        `;

        return;
    }

    let html = `
        <h2>🎒 Dein Inventar</h2>
        <div class="inventory">
    `;

    player.inventory.forEach(item => {

        html += `
            <div class="item">
                ${item}
            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("content").innerHTML = html;
}


// =====================================================
// PROFIL
// =====================================================

function profile() {

    document.getElementById("content").innerHTML = `

        <h2>👤 Dein Profil</h2>

        <div class="card">

            <h3>📊 Statistiken</h3>

            <p>💰 Coins: ${player.coins}</p>

            <p>⭐ Level: ${player.level}</p>

            <p>⚡ XP: ${player.xp} / ${xpNeeded()}</p>

            <p>🔥 Daily Streak: ${player.streak}</p>

            <p>🎒 Items: ${player.inventory.length}</p>

        </div>

        <div class="card">

            <h3>💡 Fortschritt</h3>

            <p>
                Arbeite Jobs, hole deine Daily-Belohnung
                und sammle XP.
            </p>

        </div>

    `;
}


// =====================================================
// ONLINE SPIELER
// =====================================================

const playerId =
    localStorage.getItem("cubixPlayerId") ||
    crypto.randomUUID();

localStorage.setItem(
    "cubixPlayerId",
    playerId
);

async function heartbeat() {

    try {

        const response =
            await fetch("/api/heartbeat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    playerId: playerId
                })

            });

        const data =
            await response.json();

        const element =
            document.getElementById("onlineCount");

        if (element) {

            element.textContent =
                "🟢 " + data.online + " Spieler online";

        }

    } catch (error) {

        console.log("Heartbeat nicht verfügbar.");

    }
}

async function updateOnline() {

    try {

        const response =
            await fetch("/api/online");

        const data =
            await response.json();

        const element =
            document.getElementById("onlineCount");

        if (element) {

            element.textContent =
                "🟢 " + data.online + " Spieler online";

        }

    } catch (error) {}

}

setInterval(heartbeat, 30000);

heartbeat();


// =====================================================
// ADMIN
// =====================================================

function adminLogin() {

    const password =
        prompt("🔐 Admin-Passwort:");

    if (!password) return;

    fetch("/api/admin/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            password: password
        })

    })
    .then(response => {

        if (!response.ok) {
            throw new Error();
        }

        return response.json();

    })
    .then(data => {

        if (data.success) {

            adminPassword = password;

            sessionStorage.setItem(
                "cubixAdmin",
                password
            );

            adminPanel();

        }

    })
    .catch(() => {

        alert("❌ Falsches Admin-Passwort.");

    });
}

async function adminPanel() {

    if (!adminPassword) {

        adminLogin();

        return;
    }

    try {

        const response =
            await fetch("/api/admin/stats", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    password: adminPassword
                })

            });

        if (!response.ok) {

            adminPassword = null;

            sessionStorage.removeItem(
                "cubixAdmin"
            );

            adminLogin();

            return;
        }

        const data =
            await response.json();

        document.getElementById("content").innerHTML = `

            <div class="admin">

                <h2 class="admin-title">
                    👑 CUBIX ADMIN-BEREICH
                </h2>

                <div class="card">

                    <h3>👥 Spieler</h3>

                    <p class="online">
                        🟢 ${data.onlinePlayers}
                        Spieler gerade online
                    </p>

                </div>

                <div class="card">

                    <h3>💰 Coins geben</h3>

                    <input
                        id="adminCoins"
                        type="number"
                        min="1"
                        placeholder="Anzahl Coins"
                    >

                    <button
                        class="action green"
                        onclick="adminGiveCoins()">
                        💰 Coins geben
                    </button>

                </div>

                <div class="card">

                    <h3>⭐ XP geben</h3>

                    <input
                        id="adminXP"
                        type="number"
                        min="1"
                        placeholder="Anzahl XP"
                    >

                    <button
                        class="action green"
                        onclick="adminGiveXP()">
                        ⭐ XP geben
                    </button>

                </div>

                <div class="card">

                    <h3>⚙️ Admin</h3>

                    <button
                        class="action red"
                        onclick="adminLogout()">
                        Admin-Bereich verlassen
                    </button>

                </div>

            </div>
        `;

    } catch (error) {

        alert("Admin-Bereich konnte nicht geladen werden.");

    }
}

function adminGiveCoins() {

    const amount =
        Number(
            document.getElementById("adminCoins").value
        );

    if (!amount || amount <= 0) {

        alert("Bitte eine gültige Zahl eingeben.");

        return;
    }

    player.coins += amount;

    save();

    alert(
        "👑 Admin:\n\n+" +
        amount +
        " Coins"
    );

    adminPanel();
}

function adminGiveXP() {

    const amount =
        Number(
            document.getElementById("adminXP").value
        );

    if (!amount || amount <= 0) {

        alert("Bitte eine gültige Zahl eingeben.");

        return;
    }

    addXP(amount);

    alert(
        "👑 Admin:\n\n+" +
        amount +
        " XP"
    );

    adminPanel();
}

function adminLogout() {

    adminPassword = null;

    sessionStorage.removeItem(
        "cubixAdmin"
    );

    home();
}


// =====================================================
// ADMIN BUTTON
// =====================================================

// Absichtlich nicht im normalen Menü sichtbar.
// Nur durch eine spezielle Tastenkombination erreichbar:
//
// STRG + SHIFT + A
//

document.addEventListener("keydown", function(event) {

    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "a"
    ) {

        adminPanel();

    }

});


// =====================================================
// START
// =====================================================

updateStats();

home();

</script>

</body>
</html>
