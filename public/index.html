<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#3b0808,#100303 45%,#050505);
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    border:0;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.app{
    max-width:950px;
    margin:auto;
    padding:12px;
}

.header,.content{
    background:#090909;
    border:1px solid #4a1010;
    border-radius:18px;
    box-shadow:0 8px 30px #0008;
}

.header{
    padding:18px;
    margin-bottom:12px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:6px 0 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#111;
    border:1px solid #321010;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.stat-title{
    color:#888;
    font-size:11px;
}

.stat-value{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

.bar{
    height:7px;
    margin-top:6px;
    background:#241010;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
}

.energy{background:#d97706}
.happy{background:#db2777}

.menu{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-bottom:12px;
}

.menu button{
    padding:12px 6px;
    border-radius:10px;
    background:#180808;
    border:1px solid #511414;
}

.menu button:hover{
    background:#320c0c;
}

.content{
    padding:20px;
    min-height:500px;
}

.card{
    background:#120707;
    border:1px solid #461111;
    border-radius:14px;
    padding:15px;
    margin:10px 0;
}

.action{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:9px;
    background:#991b1b;
}

.action:hover{
    background:#b91c1c;
}

.green{background:#166534}
.gray{background:#3f3f46}
.gold{background:#92400e}
.blue{background:#1d4ed8}
.pink{background:#9d174d}

input{
    width:100%;
    padding:12px;
    margin:5px 0;
    background:#080808;
    border:1px solid #511414;
    color:#fff;
    border-radius:9px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.item{
    background:#120707;
    border:1px solid #461111;
    border-radius:12px;
    padding:14px;
    margin:8px 0;
}

.equipped{
    border-color:#dc2626;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#3f1111;
    font-size:12px;
}

.success{color:#4ade80}
.warning{color:#fbbf24}
.danger{color:#f87171}
.muted{color:#999}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#151515;
    border:1px solid #7f1d1d;
    padding:13px 18px;
    border-radius:12px;
    z-index:9999;
    box-shadow:0 8px 30px #0009;
}

canvas{
    width:100%;
    height:280px;
    background:#050505;
    border:1px solid #381010;
    border-radius:12px;
}

.stock{
    border:1px solid #461111;
    padding:14px;
    border-radius:12px;
    margin:10px 0;
    background:#100606;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">🔥 CUBIX CITY</div>

<div class="subtitle">
Deine Stadt. Dein Charakter. Dein Fortschritt.
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">👤 USERNAME</div>
<div class="stat-value" id="username">-</div>
</div>

<div class="stat">
<div class="stat-title">💰 COINS</div>
<div class="stat-value" id="coins">0</div>
</div>

<div class="stat">
<div class="stat-title">⭐ LEVEL</div>
<div class="stat-value" id="level">1</div>
</div>

<div class="stat">
<div class="stat-title">⚡ ENERGIE</div>
<div class="stat-value">
<span id="energy">100</span>/100
</div>
<div class="bar">
<div class="fill energy" id="energyBar"></div>
</div>
</div>

</div>

</div>

<div class="menu">

<button onclick="home()">🏠 Stadt</button>
<button onclick="jobs()">💼 Jobs</button>
<button onclick="shopPage()">🏪 Shop</button>
<button onclick="inventory()">🎒 Inventar</button>
<button onclick="rest()">😴 Ruhe</button>
<button onclick="freeTime()">🎮 Freizeit</button>
<button onclick="stocks()">📈 Stonks</button>
<button onclick="miner()">⛏️ Miner</button>
<button onclick="friends()">👥 Freunde</button>
<button onclick="leaderboard()">🏆 Rangliste</button>
<button onclick="daily()">🎁 Daily</button>
<button onclick="profile()">👤 Profil</button>
<button onclick="admin()">👑 Admin</button>

</div>

<div class="content" id="content"></div>

</div>

<script>
let token =
    localStorage.getItem("cubixToken");

let player = null;

function headers(){
    return {
        "Content-Type":
            "application/json",
        "Authorization":
            "Bearer " + token
    };
}

async function api(url,options={}){
    const r =
        await fetch(
            url,
            {
                ...options,
                headers:{
                    ...headers(),
                    ...(options.headers||{})
                }
            }
        );

    const d =
        await r.json();

    if(!r.ok || !d.success)
        throw new Error(
            d.error || "Fehler"
        );

    if(d.player)
        player=d.player;

    update();

    return d;
}

function toast(text){
    const old=
        document.querySelector(".toast");

    if(old) old.remove();

    const x=
        document.createElement("div");

    x.className="toast";
    x.textContent=text;

    document.body.appendChild(x);

    setTimeout(
        ()=>x.remove(),
        2500
    );
}

function update(){
    if(!player)return;

    document.getElementById(
        "username"
    ).textContent=
        player.username;

    document.getElementById(
        "coins"
    ).textContent=
        Math.floor(player.coins)
        .toLocaleString("de-DE");

    document.getElementById(
        "level"
    ).textContent=
        player.level;

    document.getElementById(
        "energy"
    ).textContent=
        Math.round(player.energy);

    document.getElementById(
        "energyBar"
    ).style.width=
        player.energy+"%";
}

async function load(){
    if(!token){
        loginPage();
        return;
    }

    try{
        const d=
            await api("/api/me");

        player=d.player;
        update();
        home();
    }catch{
        localStorage.removeItem(
            "cubixToken"
        );
        token=null;
        loginPage();
    }
}

function loginPage(){

    document.getElementById(
        "content"
    ).innerHTML=`

    <h2>👤 CUBIX CITY</h2>

    <div class="card">

    <h3>Neuer Spieler</h3>

    <p class="muted">
    Beim ersten Besuch wählst du deinen
    eindeutigen Username.
    </p>

    <input
        id="newUser"
        placeholder="Username"
        maxlength="16">

    <button
        class="action"
        onclick="register()">
        🚀 Account erstellen
    </button>

    </div>

    <div class="card">

    <h3>Bereits registriert?</h3>

    <input
        id="oldUser"
        placeholder="Username">

    <button
        class="action gray"
        onclick="login()">
        🔑 Einloggen
    </button>

    </div>
    `;
}

async function register(){
    try{
        const username=
            document.getElementById(
                "newUser"
            ).value.trim();

        const r=
            await fetch(
                "/api/register",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        const d=
            await r.json();

        if(!r.ok)
            throw new Error(d.error);

        token=d.token;

        localStorage.setItem(
            "cubixToken",
            token
        );

        player=d.player;

        toast(
            "🎉 Willkommen in CUBIX CITY!"
        );

        home();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function login(){
    try{
        const username=
            document.getElementById(
                "oldUser"
            ).value.trim();

        const r=
            await fetch(
                "/api/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        const d=
            await r.json();

        if(!r.ok)
            throw new Error(d.error);

        token=d.token;

        localStorage.setItem(
            "cubixToken",
            token
        );

        player=d.player;

        home();
    }catch(e){
        toast("❌ "+e.message);
    }
}

function home(){

    document.getElementById(
        "content"
    ).innerHTML=`

    <h2>🏠 CUBIX CITY</h2>

    <div class="card">

    <h3>
    Willkommen,
    ${player.username}! 👋
    </h3>

    <p>
    💰 ${player.coins.toLocaleString("de-DE")} Coins
    </p>

    <p>
    ⚡ ${Math.round(player.energy)}/100 Energie
    </p>

    <p>
    😊 ${Math.round(player.happiness)}/100 Glück
    </p>

    </div>

    <div class="card">

    <h3>💼 Arbeit</h3>

    <p>
    ${
        player.activeJob
        ?
        "Aktiver Job: "+
        player.activeJob
        :
        "Du hast aktuell keinen Job."
    }
    </p>

    ${
        player.jobFired
        ?
        `<p class="danger">
        ⚠️ Du wurdest wegen Inaktivität
        gefeuert. Bewirb dich erneut.
        </p>`
        :
        ""
    }

    </div>

    <div class="card">

    <h3>📅 Heute</h3>

    <p>
    😴 Ruhepausen:
    ${player.restsToday}/3
    </p>

    <p>
    🎮 Freizeit:
    ${player.freeTimeToday}/5
    </p>

    </div>
    `;
}

async function jobs(){

    try{
        const d=
            await api("/api/me");

        const list=d.jobs;

        let html=
            "<h2>💼 Jobs</h2>";

        html+=`
        <p class="muted">
        Du kannst immer nur einen Job gleichzeitig haben.
        Nach 7 Tagen ohne Arbeit wirst du gefeuert.
        </p>
        `;

        if(player.activeJob){

            const active=
                list.find(
                    j =>
                    j.id===player.activeJob
                );

            html+=`
            <div class="card">

            <h3>👔 Aktueller Job</h3>

            <p>
            ${active?.name || player.activeJob}
            </p>

            ${
                player.lastWorkedAt
                ?
                `<p class="muted">
                Wenn du 7 Tage nicht arbeitest,
                wirst du gefeuert.
                </p>`
                :
                ""
            }

            <button
            class="action green"
            onclick="work()">
            💼 Arbeiten
            </button>

            </div>
            `;

        }else{

            html+=`
            <div class="card">
            <h3>📋 Jobs</h3>
            <p>
            Bewirb dich bei einem Job.
            </p>
            </div>
            `;

            list.forEach(j=>{

                html+=`

                <div class="card">

                <h3>${j.name}</h3>

                <p>
                💰 ${j.reward} Coins<br>
                ⭐ ${j.xp} XP<br>
                ⚡ ${j.energy} Energie<br>
                😊 -${j.happiness} Glück
                </p>

                <button
                class="action"
                onclick="applyJob('${j.id}')">
                📋 Bewerben
                </button>

                </div>
                `;
            });
        }

        document.getElementById(
            "content"
        ).innerHTML=html;

    }catch(e){
        toast("❌ "+e.message);
    }
}

async function applyJob(id){
    try{
        await api(
            "/api/job/apply",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        jobId:id
                    })
            }
        );

        toast(
            "👔 Bewerbung angenommen!"
        );

        jobs();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function work(){

    try{
        const d=
            await api(
                "/api/job/work",
                {
                    method:"POST"
                }
            );

        toast(
            `💼 +${d.reward} Coins · +${d.xp} XP`
        );

        jobs();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function rest(){

    try{
        const d=
            await api(
                "/api/rest",
                {
                    method:"POST"
                }
            );

        toast(
            `😴 +${d.energy} Energie`
        );

        home();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function freeTime(){

    try{
        const d=
            await api(
                "/api/freetime",
                {
                    method:"POST"
                }
            );

        toast(
            `🎮 +${d.happiness} Glück`
        );

        home();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function shopPage(){

    const d=
        await api("/api/me");

    let html=
        "<h2>🏪 Shop</h2>";

    Object.entries(d.shop)
    .forEach(
        ([name,item])=>{

        html+=`

        <div class="card">

        <h3>${name}</h3>

        <p>
        ${item.text}
        </p>

        <p>
        💰 ${item.price.toLocaleString("de-DE")}
        Coins
        </p>

        ${
            item.type==="energy"
            ?
            `<p>🔋 ${item.uses} Nutzungen</p>`
            :
            ""
        }

        <button
        class="action"
        onclick="buy('${name}')">
        Kaufen
        </button>

        </div>

        `;
    });

    document.getElementById(
        "content"
    ).innerHTML=html;
}

async function buy(name){

    try{
        await api(
            "/api/shop/buy",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        toast("🛍️ Gekauft!");

        shopPage();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function inventory(){

    if(!player.inventory.length){

        document.getElementById(
            "content"
        ).innerHTML=`

        <h2>🎒 Inventar</h2>

        <div class="card">
        Dein Inventar ist leer.
        </div>

        `;

        return;
    }

    let html=
        "<h2>🎒 Inventar</h2>";

    player.inventory
    .forEach(item=>{

        const equipped=
            player.equipped
            .includes(item.name);

        const energy =
            item.name==="🥤 Energy Drink" ||
            item.name==="☕ Kaffee";

        html+=`

        <div class="item
        ${equipped?"equipped":""}">

        <h3>${item.name}</h3>

        <p>
        🔋 ${item.uses} Nutzungen
        </p>

        ${
            energy
            ?
            `<button
            class="action green"
            onclick="useItem('${item.name}')">
            ⚡ Benutzen
            </button>`
            :
            equipped
            ?
            `
            <span class="badge">
            ✅ Ausgerüstet
            </span>

            <button
            class="action gray"
            onclick="unequip('${item.name}')">
            Ablegen
            </button>
            `
            :
            `
            <button
            class="action"
            onclick="equip('${item.name}')">
            Ausrüsten
            </button>
            `
        }

        </div>
        `;
    });

    document.getElementById(
        "content"
    ).innerHTML=html;
}

async function equip(name){

    try{
        await api(
            "/api/item/equip",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        inventory();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function unequip(name){

    try{
        await api(
            "/api/item/unequip",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        inventory();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function useItem(name){

    try{
        await api(
            "/api/item/use",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        name
                    })
            }
        );

        toast("⚡ Item benutzt!");

        inventory();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function daily(){

    try{
        const d=
            await api(
                "/api/daily",
                {
                    method:"POST"
                }
            );

        toast(
            `🎁 +${d.reward} Coins`
        );

        home();
    }catch(e){
        toast("❌ "+e.message);
    }
}

async function leaderboard(){

    try{

        const d=
            await api(
                "/api/leaderboard"
            );

        let html=
            "<h2>🏆 Rangliste</h2>";

        html+=`
        <div class="grid">

        <div class="card">

        <h3>💰 Reichste Spieler</h3>
        `;

        d.money.forEach(x=>{

            html+=`
            <p>
            #${x.rank}
            <strong>${x.username}</strong>
            —
            ${x.value.toLocaleString("de-DE")}
            Coins
            </p>
            `;
        });

        html+=`
        </div>

        <div class="card">

        <h3>⭐ XP-Rangliste</h3>
        `;

        d.xp.forEach(x=>{

            html+=`
            <p>
            #${x.rank}
            <strong>${x.username}</strong>
            —
            Level ${x.level}
            · ${x.value} XP
            </p>
            `;
        });

        html+=`
        </div>

        </div>
        `;

        document.getElementById(
            "content"
        ).innerHTML=html;

    }catch(e){
        toast("❌ "+e.message);
    }
}

async function friends(){

    document.getElementById(
        "content"
    ).innerHTML=`

    <h2>👥 Freunde</h2>

    <div class="card">

    <h3>➕ Freund hinzufügen</h3>

    <input
    id="friendName"
    placeholder="Username">

    <button
    class="action"
    onclick="addFriend()">
    Freund hinzufügen
    </button>

    </div>

    <div class="card">

    <h3>👥 Deine Freunde</h3>

    ${
        player.friends.length
        ?
        player.friends.join("<br>")
        :
        "Noch keine Freunde."
    }

    </div>
    `;
}

async function addFriend(){

    try{

        const username=
            document.getElementById(
                "friendName"
            ).value.trim();

        await api(
            "/api/friend/add",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        username
                    })
            }
        );

        toast("👥 Freund hinzugefügt!");

        friends();

    }catch(e){
        toast("❌ "+e.message);
    }
}

async function stocks(){

    try{

        const d=
            await api(
                "/api/stocks"
            );

        const symbols=
            Object.keys(d.stocks);

        let html=
            "<h2>📈 STONKS</h2>";

        html+=`
        <p class="muted">
        Die Kurse verändern sich regelmäßig.
        Kaufe günstig und verkaufe hoffentlich
        später teurer.
        </p>
        `;

        symbols.forEach(
            symbol=>{

            const s=
                d.stocks[symbol];

            html+=`

            <div class="stock">

            <h3>
            ${symbol} · ${s.name}
            </h3>

            <p>
            💰
            <strong>
            ${s.price.toLocaleString("de-DE")}
            </strong>
            pro Aktie
            </p>

            <canvas
            id="chart-${symbol}"
            width="800"
            height="280">
            </canvas>

            <div class="row">

            <input
            id="buy-${symbol}"
            type="number"
            min="1"
            value="1">

            <button
            class="action green"
            onclick="buyStock('${symbol}')">
            📈 Kaufen
            </button>

            </div>

            <div class="row">

            <input
            id="sell-${symbol}"
            type="number"
            min="1"
            value="1">

            <button
            class="action"
            onclick="sellStock('${symbol}')">
            📉 Verkaufen
            </button>

            </div>

            </div>
            `;
        });

        document.getElementById(
            "content"
        ).innerHTML=html;

        symbols.forEach(
            symbol =>
                drawChart(
                    "chart-"+symbol,
                    d.stocks[symbol].history
                )
        );

    }catch(e){
        toast("❌ "+e.message);
    }
}

function drawChart(id,data){

    const canvas=
        document.getElementById(id);

    if(!canvas)return;

    const ctx=
        canvas.getContext("2d");

    const w=canvas.width;
    const h=canvas.height;

    ctx.clearRect(
        0,0,w,h
    );

    const min=
        Math.min(...data);

    const max=
        Math.max(...data);

    const range=
        Math.max(
            1,
            max-min
        );

    ctx.strokeStyle="#333";
    ctx.lineWidth=1;

    for(let i=1;i<5;i++){

        const y=
            (h/5)*i;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
        ctx.stroke();
    }

    ctx.strokeStyle="#ef4444";
    ctx.lineWidth=3;

    ctx.beginPath();

    data.forEach(
        (value,i)=>{

        const x=
            i/
            Math.max(
                1,
                data.length-1
            )*
            (w-20)+10;

        const y=
            h-20-
            (
                (value-min)/
                range
            )*
            (h-40);

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    });

    ctx.stroke();
}

async function admin(){

    let password=
        sessionStorage.getItem(
            "cubixAdmin"
        );

    if(!password){

        password=
            prompt(
                "👑 Admin-Passwort:"
            );

        if(!password)return;

        try{

            const r=
                await fetch(
                    "/api/admin/login",
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                password
                            })
                    }
                );

            const d=
                await r.json();

            if(!r.ok)
                throw new Error(
                    d.error ||
                    "Falsches Passwort."
                );

            sessionStorage.setItem(
                "cubixAdmin",
                password
            );

        }catch(e){

            toast(
                "❌ "+e.message
            );

            return;
        }
    }

    const stats=
        await fetch(
            "/api/admin/stats",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        password
                    })
            }
        );

    const d=
        await stats.json();

    if(!stats.ok){

        sessionStorage.removeItem(
            "cubixAdmin"
        );

        toast(
            "❌ Admin-Sitzung abgelaufen."
        );

        return;
    }

    document.getElementById(
        "content"
    ).innerHTML=`

    <h2>👑 CUBIX ADMIN</h2>

    <div class="card">

    <p>
    🟢 Online:
    ${d.onlinePlayers}
    </p>

    <p>
    👥 Spieler gesamt:
    ${d.totalPlayers}
    </p>

    </div>

    <div class="card">

    <h3>💰 Coins / ⭐ XP vergeben</h3>

    <input
    id="adminTarget"
    placeholder="Username">

    <input
    id="adminAmount"
    type="number"
    min="1"
    placeholder="Menge">

    <div class="row">

    <button
    class="action green"
    onclick="adminGive('coins')">
    💰 Coins geben
    </button>

    <button
    class="action green"
    onclick="adminGive('xp')">
    ⭐ XP geben
    </button>

    </div>

    </div>

    <button
    class="action gray"
    onclick="adminLogout()">
    Admin verlassen
    </button>
    `;
}

async function adminGive(type){

    const password=
        sessionStorage.getItem(
            "cubixAdmin"
        );

    try{

        const username=
            document.getElementById(
                "adminTarget"
            ).value.trim();

        const amount=
            Number(
                document.getElementById(
                    "adminAmount"
                ).value
            );

        const r=
            await fetch(
                "/api/admin/give",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            password,
                            username,
                            amount,
                            type
                        })
                }
            );

        const d=
            await r.json();

        if(!r.ok)
            throw new Error(d.error);

        toast(
            `👑 ${amount} ${type} an ${username}`
        );

        admin();

    }catch(e){
        toast(
            "❌ "+e.message
        );
    }
}

function adminLogout(){

    sessionStorage.removeItem(
        "cubixAdmin"
    );

    home();
}
