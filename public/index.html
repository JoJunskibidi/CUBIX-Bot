<script>

/* =====================================================
   SPIELER
===================================================== */

const todayKey=()=>new Date().toISOString().slice(0,10);

let player;

try{
    player=JSON.parse(localStorage.getItem("cubixPlayer"));
}catch{
    player=null;
}

if(!player){
    player={
        coins:250,
        xp:0,
        level:1,
        energy:100,
        happiness:70,
        streak:0,
        lastDaily:null,
        inventory:[],
        equipped:[],
        jobs:{},
        workToday:0,
        restsToday:0,
        freeTimeToday:0,
        lastActionDay:todayKey()
    };
}


/* =====================================================
   DATEN REPARIEREN
===================================================== */

if(!Array.isArray(player.inventory))
    player.inventory=[];

if(!Array.isArray(player.equipped))
    player.equipped=[];

if(!player.jobs)
    player.jobs={};

if(typeof player.coins!=="number")
    player.coins=250;

if(typeof player.xp!=="number")
    player.xp=0;

if(typeof player.level!=="number")
    player.level=1;

if(typeof player.energy!=="number")
    player.energy=100;

if(typeof player.happiness!=="number")
    player.happiness=70;

if(typeof player.streak!=="number")
    player.streak=0;

if(typeof player.workToday!=="number")
    player.workToday=0;

if(typeof player.restsToday!=="number")
    player.restsToday=0;

if(typeof player.freeTimeToday!=="number")
    player.freeTimeToday=0;

if(!player.lastActionDay)
    player.lastActionDay=todayKey();


/* =====================================================
   ALTES INVENTAR KONVERTIEREN
===================================================== */

player.inventory=player.inventory.map(item=>{

    if(typeof item==="string"){
        return {
            name:item,
            uses:items[item]?.uses||1
        };
    }

    if(!item || !item.name){
        return null;
    }

    if(typeof item.uses!=="number"){
        item.uses=items[item.name]?.uses||1;
    }

    return item;

}).filter(Boolean);


/* =====================================================
   TAGESRESET
===================================================== */

function checkNewDay(){

    const today=todayKey();

    if(player.lastActionDay!==today){

        player.workToday=0;
        player.restsToday=0;
        player.freeTimeToday=0;

        player.lastActionDay=today;

        save(false);
    }
}


/* =====================================================
   SPEICHERN
===================================================== */

function save(update=true){

    localStorage.setItem(
        "cubixPlayer",
        JSON.stringify(player)
    );

    if(update)
        updateStats();
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(message,type=""){

    const element=document.getElementById("toast");

    element.textContent=message;

    element.className="toast show";

    if(type==="success")
        element.classList.add("success-toast");

    if(type==="error")
        element.classList.add("error-toast");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        element.className="toast";
    },2600);
}


/* =====================================================
   XP
===================================================== */

function xpNeeded(){

    return 100+((player.level-1)*50);
}

function addXP(amount){

    player.xp+=amount;

    let levels=0;

    while(player.xp>=xpNeeded()){

        player.xp-=xpNeeded();
        player.level++;
        levels++;

    }

    if(levels>0){
        toast(
            "🔥 Level Up! Du bist jetzt Level "+player.level+"!",
            "success"
        );
    }

    save();
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    player.energy=Math.max(
        0,
        Math.min(100,player.energy)
    );

    player.happiness=Math.max(
        0,
        Math.min(100,player.happiness)
    );

    document.getElementById("coins").textContent=
        Math.floor(player.coins);

    document.getElementById("level").textContent=
        player.level;

    document.getElementById("energy").textContent=
        Math.round(player.energy);

    document.getElementById("happy").textContent=
        Math.round(player.happiness);

    document.getElementById("energyBar").style.width=
        player.energy+"%";

    document.getElementById("happyBar").style.width=
        player.happiness+"%";
}


/* =====================================================
   ITEMS
===================================================== */

const items={

"🥤 Energy Drink":{
    price:50,
    uses:3,
    type:"consumable",
    effect:"energy",
    value:25,
    text:"+25 Energie"
},

"☕ Kaffee":{

    type:"consumable",
    effect:"energy",
    value:15,
    text:"+15 Energie"
},

    value:10,
    text:"+10% Coins bei einem Job"
},

"👟 Arbeitsschuhe":{

    uses:12,

    effect:"workEnergy",
    value:3,
    text:"3 Energie weniger pro Job"
},

"🚲 Fahrrad":{
    price:500,
    uses:10,
    type:"work",
    effect:"workEnergy",
    value:5,
    text:"5 Energie weniger pro Job"
},

"🎮 Controller":{
    price:300,
    uses:8,
    type:"free",
    effect:"happiness",
    value:15,
    text:"+15 zusätzliche Glücklichkeit bei Freizeit"
},

"📱 Smartphone":{
    price:250,
    uses:12,
    type:"free",
    effect:"happiness",
    value:8,
    text:"+8 zusätzliche Glücklichkeit bei Freizeit"
},

"💻 Gaming PC":{
    price:750,
    uses:8,
    type:"free",
    effect:"happiness",
    value:20,
    text:"+20 zusätzliche Glücklichkeit bei Freizeit"
},

"🏠 Kleine Wohnung":{
    price:1500,
    uses:10,
    type:"rest",
    effect:"restEnergy",
    value:15,
    text:"+15 zusätzliche Energie beim Ausruhen"
},

"🛏️ Bequemes Bett":{
    price:900,
    uses:12,
    type:"rest",
    effect:"restEnergy",
    value:10,
    text:"+10 zusätzliche Energie beim Ausruhen"
}

};


/* =====================================================
   ITEM VERBRAUCH
===================================================== */

function consumeItem(name){

    const index=player.inventory.findIndex(
        item=>item.name===name && item.uses>0
    );

    if(index===-1)
        return false;

    player.inventory[index].uses--;

    if(player.inventory[index].uses<=0){

        player.inventory.splice(index,1);

        player.equipped=
            player.equipped.filter(
                x=>x!==name
            );
    }

    return true;
}


/* =====================================================
   BESITZT ITEM?
===================================================== */

function hasEquipped(name){

    return player.equipped.includes(name) &&
        player.inventory.some(
            item=>item.name===name && item.uses>0
        );
}


/* =====================================================
   HOME
===================================================== */

function home(){

    checkNewDay();

    document.getElementById("content").innerHTML=`

<h2>🏠 CUBIX CITY</h2>

</div>
</div>

</div>

<div class="card">

<h3>📅 Deine heutigen Aktionen</h3>

<p>🎮 Freizeit: <strong>${player.freeTimeToday}/5</strong></p>

</div>

<div class="card">

<h3>🎯 Dein Fortschritt</h3>

<p>💰 ${Math.floor(player.coins)} Coins</p>
<p>⭐ Level ${player.level}</p>
<p>⚡ XP ${player.xp}/${xpNeeded()}</p>

</div>

<div class="card">

<h3>👥 CUBIX CITY</h3>

<span class="online" id="onlineCount">
🟢 Lade Spieler...
</span>

</div>

`;

updateOnline();

}


/* =====================================================
   JOBS
===================================================== */

const jobList=[

{
    name:"🧹 Müll sammeln",
    reward:25,
    xp:10,
    energy:12,
    happiness:3,
    cooldown:60*1000
},

{
    name:"🍕 Pizza liefern",
    reward:60,
    xp:25,
    energy:20,
    happiness:5,
    cooldown:3*60*1000
},

{
    name:"🚕 Taxi fahren",
    reward:120,
    xp:45,
    energy:30,
    happiness:7,
    cooldown:7*60*1000
},

{
    name:"💻 Programmieren",
    reward:200,
    xp:70,
    energy:40,
    happiness:10,
    cooldown:12*60*1000
}

];


function getJobEnergy(job){

    let cost=job.energy;

    if(hasEquipped("🚲 Fahrrad"))
        cost-=5;

    if(hasEquipped("👟 Arbeitsschuhe"))
        cost-=3;

    return Math.max(5,cost);
}


function formatTime(ms){

    const total=Math.ceil(ms/1000);

    const minutes=Math.floor(total/60);
    const seconds=total%60;

    if(minutes>0)
        return `${minutes}m ${String(seconds).padStart(2,"0")}s`;

    return `${seconds}s`;
}


function jobs(){

    checkNewDay();

    let html=`

<h2>💼 Jobs</h2>

<div class="limit">
💼 Heute gearbeitet:
<strong>${player.workToday}/8</strong>
</div>

<p class="muted">
Jeder Job hat einen eigenen Cooldown. Außerdem kannst du insgesamt nur 8 Jobs pro Tag machen.
</p>

`;

    jobList.forEach((job,index)=>{

        const last=player.jobs[index]||0;

        const remaining=Math.max(
            0,
            job.cooldown-(Date.now()-last)
        );

        const energyCost=getJobEnergy(job);

        const canWork=
            remaining<=0 &&
            player.workToday<8 &&
            player.energy>=energyCost;

        let buttonText="Arbeiten";

        if(remaining>0)
            buttonText="⏳ "+formatTime(remaining);

        else if(player.workToday>=8)
            buttonText="📅 Tageslimit erreicht";

        else if(player.energy<energyCost)
            buttonText="⚡ Zu wenig Energie";

        html+=`

<div class="card">

<h3>${job.name}</h3>

<p>
💰 +${job.reward} Coins<br>
⭐ +${job.xp} XP<br>
⚡ -${energyCost} Energie<br>
😊 -${job.happiness} Glück
</p>

${remaining>0?
`<div class="cooldown">⏳ Bereit in ${formatTime(remaining)}</div>`
:""}

<button
class="action"
onclick="work(${index})"
${canWork?"":"disabled"}>

${buttonText}

</button>

</div>

`;

    });

    document.getElementById("content").innerHTML=html;
}


function work(index){

    checkNewDay();

    const job=jobList[index];

    if(!job)
        return;

    if(player.workToday>=8){

        toast(
            "📅 Du hast heute bereits 8 Jobs gemacht.",
            "error"
        );

        jobs();
        return;
    }

    const last=player.jobs[index]||0;

    const remaining=
        job.cooldown-(Date.now()-last);

    if(remaining>0){

        toast(
            "⏳ Dieser Job ist noch "+formatTime(remaining)+" gesperrt.",
            "error"
        );

        jobs();
        return;
    }

    const energyCost=getJobEnergy(job);

    if(player.energy<energyCost){

        toast(
            "⚡ Du brauchst mindestens "+energyCost+" Energie.",
            "error"
        );

        jobs();
        return;
    }

    let reward=job.reward;

    const headphones=hasEquipped("🎧 Kopfhörer");
    const bike=hasEquipped("🚲 Fahrrad");
    const shoes=hasEquipped("👟 Arbeitsschuhe");

    if(headphones)
        reward=Math.round(reward*1.10);

    player.jobs[index]=Date.now();

    player.workToday++;

    player.energy-=energyCost;

    player.happiness=
        Math.max(
            0,
            player.happiness-job.happiness
        );

    player.coins+=reward;

    player.xp+=job.xp;

    if(headphones)
        consumeItem("🎧 Kopfhörer");

    if(bike)
        consumeItem("🚲 Fahrrad");

    if(shoes)
        consumeItem("👟 Arbeitsschuhe");

    levelCheck();

    save();

    toast(
        `💼 ${job.name} erledigt! +${reward} Coins · +${job.xp} XP`,
        "success"
    );

    jobs();
}


/* =====================================================
   LEVEL
===================================================== */

function levelCheck(){

    let leveled=false;

    while(player.xp>=xpNeeded()){

        player.xp-=xpNeeded();
        player.level++;
        leveled=true;

    }

    if(leveled){

        toast(
            "🔥 Level Up! Level "+player.level+" erreicht!",
            "success"
        );

    }
}


/* =====================================================
   AUSRUHEN
===================================================== */

function rest(){

    checkNewDay();

    if(player.restsToday>=3){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<p class="danger">
🚫 Du hast heute bereits 3 Ruhepausen benutzt.
</p>

<p class="muted">
Morgen werden die Ruhepausen zurückgesetzt.
</p>

</div>

`;

        return;
    }

    if(player.energy>=100){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<p>
⚡ Du bist bereits vollständig erholt.
</p>

<p class="muted">
Eine Ruhepause lohnt sich erst, wenn deine Energie unter 100 liegt.
</p>

</div>

`;

        return;
    }

    let amount=30;

    const apartment=hasEquipped("🏠 Kleine Wohnung");
    const bed=hasEquipped("🛏️ Bequemes Bett");

    if(apartment)
        amount+=15;

    if(bed)
        amount+=10;

    amount=Math.min(
        amount,
        100-player.energy
    );

    player.energy+=amount;

    player.happiness=
        Math.min(
            100,
            player.happiness+3
        );

    player.restsToday++;

    if(apartment)
        consumeItem("🏠 Kleine Wohnung");

    if(bed)
        consumeItem("🛏️ Bequemes Bett");

    save();

    document.getElementById("content").innerHTML=`

<h2>😴 Ruhepause</h2>

<div class="card">

<p class="success">
⚡ +${amount} Energie
</p>

<p>
😊 +3 Glück
</p>

<p>
📅 Ruhepausen heute:
${player.restsToday}/3
</p>

</div>

`;

}

function freeTime(){

    checkNewDay();

    if(player.freeTimeToday>=5){

        document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="danger">
🚫 Dein Freizeitlimit von 5 Aktionen ist heute erreicht.
</p>

<p>
Morgen stehen dir wieder 5 Aktionen zur Verfügung.
</p>

</div>

`;

        return;
    }

    const energyCost=15;

    if(player.energy<energyCost){

    player.coins+=reward;
    player.xp+=20;

    levelCheck();

/* =====================================================
   AUSRÜSTEN
===================================================== */

function equip(name){

    const data=items[name];

    if(!data || data.type==="consumable")
        return;

    const exists=player.inventory.some(
        item=>item.name===name && item.uses>0
    );

    if(!exists){

        toast(
            "❌ Dieses Item ist nicht mehr verfügbar.",
            "error"
        );

        inventory();
        return;
    }

    /*
       Nur ein Item pro Kategorie gleichzeitig.
    */

    player.equipped=
        player.equipped.filter(existing=>{

            const existingData=items[existing];

            return !existingData ||
                existingData.type!==data.type;

        });

    if(!player.equipped.includes(name))
        player.equipped.push(name);

    save();

    toast(
        "⚙️ "+name+" ausgerüstet.",
        "success"
    );

    inventory();
}


function unequip(name){

    player.equipped=
        player.equipped.filter(
            x=>x!==name
        );

    save();

    inventory();
}


/* =====================================================
   VERBRAUCHS-ITEM BENUTZEN
===================================================== */

function useConsumable(index){

    const item=player.inventory[index];

    if(!item)
        return;

    const data=items[item.name];

    if(!data || data.type!=="consumable")
        return;

    if(data.effect==="energy"){

        if(player.energy>=100){

            toast(
                "⚡ Deine Energie ist bereits voll.",
                "error"
            );

            return;
        }

        const old=player.energy;

        player.energy=
            Math.min(
                100,
                player.energy+data.value
            );

        const gained=
            Math.round(player.energy-old);

        consumeItem(item.name);

        save();

        toast(
            "🥤 "+item.name+" benutzt: +"+gained+" Energie!",
            "success"
        );

        inventory();
    }
}
