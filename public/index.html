```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at top,#3b0808,#100303 45%,#050505);
    color:white;
}

button{
    border:0;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.app{
    max-width:900px;
    min-height:100vh;
    margin:auto;
    padding:12px;
}

.header,.content{
    background:#090909;
    border:1px solid #4a1010;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.header{
    padding:20px;
    margin-bottom:12px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:7px 0 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#111;
    border:1px solid #321010;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.stat-title{
    color:#888;
    font-size:11px;
}

.stat-value{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

.bar{
    height:7px;
    background:#251010;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.fill{
    height:100%;
    width:0%;
}

.energy{background:#d97706}
.happy{background:#db2777}
.xp{background:#b91c1c}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.menu button{
    padding:13px 8px;
    border-radius:11px;
    background:#180808;
    border:1px solid #511414;
}

.menu button:hover{
    background:#320c0c;
}

.content{
    padding:20px;
    min-height:450px;
}

.card{
    background:#120707;
    border:1px solid #461111;
    border-radius:14px;
    padding:16px;
    margin:10px 0;
}

.action{
    width:100%;
    margin-top:8px;
    padding:13px;
    border-radius:10px;
    background:#991b1b;
}

.action:hover{
    background:#b91c1c;
}

.green{background:#166534}
.gray{background:#3f3f46}
.pink{background:#9d174d}

.item{
    background:#120707;
    border:1px solid #461111;
    border-radius:12px;
    padding:14px;
    margin:9px 0;
}

.equipped{
    border-color:#dc2626;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#3f1111;
}

.success{color:#4ade80}
.warning{color:#fbbf24}
.danger{color:#f87171}
.muted{color:#999}

.limit{
    background:#1a0b0b;
    border:1px solid #511414;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:9px;
    border:1px solid #511414;
    background:#080808;
    color:white;
}

@media(max-width:650px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .menu{grid-template-columns:repeat(2,1fr)}
    .logo{font-size:27px}
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">🔥 CUBIX CITY</div>

<div class="subtitle">
Deine Stadt. Dein Charakter. Dein Fortschritt.
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">💰 COINS</div>
<div class="stat-value" id="coins">250</div>
</div>

<div class="stat">
<div class="stat-title">⭐ LEVEL</div>
<div class="stat-value" id="level">1</div>
</div>

<div class="stat">
<div class="stat-title">⚡ ENERGIE</div>
<div class="stat-value">
<span id="energy">100</span>/100
</div>
<div class="bar">
<div class="fill energy" id="energyBar"></div>
</div>
</div>

<div class="stat">
<div class="stat-title">😊 GLÜCK</div>
<div class="stat-value">
<span id="happy">70</span>/100
</div>
<div class="bar">
<div class="fill happy" id="happyBar"></div>
</div>
</div>

</div>
</div>


<div class="menu">

<button onclick="home()">🏠 Stadt</button>
<button onclick="jobs()">💼 Jobs</button>
<button onclick="shop()">🏪 Shop</button>
<button onclick="inventory()">🎒 Inventar</button>
<button onclick="rest()">😴 Ausruhen</button>
<button onclick="freeTime()">🎮 Freizeit</button>
<button onclick="daily()">🎁 Daily</button>
<button onclick="profile()">👤 Profil</button>

</div>


<div class="content" id="content"></div>

</div>


<script>

/* =====================================================
   SPIELER
===================================================== */

let player=JSON.parse(
    localStorage.getItem("cubixPlayer")
)||{

    coins:250,
    xp:0,
    level:1,

    energy:100,
    happiness:70,

    streak:0,
    lastDaily:null,

    inventory:[],
    equipped:[],

    jobs:{},

    restsToday:0,
    freeTimeToday:0,

    lastActionDay:
        new Date().toISOString().slice(0,10)

};


/* =====================================================
   DATEN REPARIEREN
===================================================== */

if(!Array.isArray(player.inventory))
    player.inventory=[];

if(!Array.isArray(player.equipped))
    player.equipped=[];

if(!player.jobs)
    player.jobs={};

if(typeof player.energy!=="number")
    player.energy=100;

if(typeof player.happiness!=="number")
    player.happiness=70;

if(typeof player.restsToday!=="number")
    player.restsToday=0;

if(typeof player.freeTimeToday!=="number")
    player.freeTimeToday=0;


/* =====================================================
   TAGESRESET
===================================================== */

function checkNewDay(){

    const today=
        new Date().toISOString().slice(0,10);

    if(player.lastActionDay!==today){

        player.restsToday=0;
        player.freeTimeToday=0;

        player.lastActionDay=today;

        save(false);
    }
}


/* =====================================================
   SPEICHERN
===================================================== */

function save(update=true){

    localStorage.setItem(
        "cubixPlayer",
        JSON.stringify(player)
    );

    if(update)
        updateStats();
}


/* =====================================================
   XP
===================================================== */

function xpNeeded(){

    return 100+
        ((player.level-1)*50);
}

function addXP(amount){

    player.xp+=amount;

    while(player.xp>=xpNeeded()){

        player.xp-=xpNeeded();
        player.level++;

    }

    save();
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    player.energy=
        Math.max(0,Math.min(100,player.energy));

    player.happiness=
        Math.max(0,Math.min(100,player.happiness));

    document.getElementById("coins").textContent=
        player.coins;

    document.getElementById("level").textContent=
        player.level;

    document.getElementById("energy").textContent=
        Math.round(player.energy);

    document.getElementById("happy").textContent=
        Math.round(player.happiness);

    document.getElementById("energyBar").style.width=
        player.energy+"%";

    document.getElementById("happyBar").style.width=
        player.happiness+"%";
}


/* =====================================================
   ITEMS
===================================================== */

const items={

"🥤 Energy Drink":{
    price:50,
    uses:3,
    effect:"energy",
    value:25,
    text:"+25 Energie bei Verwendung"
},

"☕ Kaffee":{
    price:80,
    uses:4,
    effect:"energy",
    value:15,
    text:"+15 Energie bei Verwendung"
},

"🎧 Kopfhörer":{
    price:150,
    uses:10,
    effect:"work",
    value:0.10,
    text:"Jobs bringen 10% mehr Coins"
},

"🎮 Controller":{
    price:300,
    uses:8,
    effect:"free",
    value:15,
    text:"Freizeit gibt +15 zusätzliche Glücklichkeit"
},

"🚲 Fahrrad":{
    price:500,
    uses:12,
    effect:"jobenergy",
    value:5,
    text:"Jobs kosten 5 Energie weniger"
},

"👟 Arbeitsschuhe":{
    price:350,
    uses:15,
    effect:"jobenergy",
    value:3,
    text:"Jobs kosten 3 Energie weniger"
},

"💻 Gaming PC":{
    price:750,
    uses:8,
    effect:"free",
    value:20,
    text:"Freizeit gibt +20 zusätzliche Glücklichkeit"
},

"📱 Smartphone":{
    price:250,
    uses:10,
    effect:"free",
    value:8,
    text:"Freizeit gibt +8 zusätzliche Glücklichkeit"
},

"🏠 Kleine Wohnung":{
    price:1500,
    uses:10,
    effect:"rest",
    value:15,
    text:"Ausruhen gibt 15 zusätzliche Energie"
}

};


/* =====================================================
   ITEM VERBRAUCH
===================================================== */

function consumeItem(name){

    const index=
        player.inventory.findIndex(
            item=>
                item.name===name &&
                item.uses>0
        );

    if(index===-1)
        return false;

    player.inventory[index].uses--;

    if(player.inventory[index].uses<=0){

        player.inventory.splice(index,1);

        player.equipped=
            player.equipped.filter(
                x=>x!==name
            );
    }

    return true;
}


/* =====================================================
   HOME
===================================================== */

function home(){

    checkNewDay();

    document.getElementById("content").innerHTML=`

<h2>🏠 CUBIX CITY</h2>

<p class="muted">
Baue deinen Charakter auf und manage deine Ressourcen.
</p>

<div class="card">

<h3>📊 Dein Zustand</h3>

<p>💰 ${player.coins} Coins</p>

<p>⭐ Level ${player.level}</p>

<p>⚡ ${Math.round(player.energy)}/100 Energie</p>

<p>😊 ${Math.round(player.happiness)}/100 Glücklichkeit</p>

</div>

<div class="card">

<h3>📅 Heute</h3>

<p>
😴 Ausruhen:
${player.restsToday}/3
</p>

<p>
🎮 Freizeit:
${player.freeTimeToday}/5
</p>

</div>

<div class="card">

<h3>💡 Wichtig</h3>

<p>
Energie und Glücklichkeit regenerieren sich
nicht automatisch.
Nutze deine begrenzten Aktionen sinnvoll.
</p>

</div>

`;
}


/* =====================================================
   JOBS
===================================================== */

const jobList=[

{
    name:"🧹 Müll sammeln",
    reward:25,
    xp:10,
    energy:12,
    happiness:3,
    cooldown:15000
},

{
    name:"🍕 Pizza liefern",
    reward:60,
    xp:25,
    energy:20,
    happiness:5,
    cooldown:30000
},

{
    name:"🚕 Taxi fahren",
    reward:120,
    xp:45,
    energy:30,
    happiness:7,
    cooldown:60000
},

{
    name:"💻 Programmieren",
    reward:200,
    xp:70,
    energy:40,
    happiness:10,
    cooldown:120000
}

];


function jobs(){

    checkNewDay();

    let html=`

<h2>💼 Jobs</h2>

<p class="muted">
Arbeiten bringt Geld, kostet aber Energie und Glücklichkeit.
</p>

`;

    jobList.forEach((job,index)=>{

        const last=
            player.jobs[index]||0;

        const remaining=
            Math.max(
                0,
                job.cooldown-
                (Date.now()-last)
            );

        let energyCost=
            job.energy;

        if(player.equipped.includes("🚲 Fahrrad"))
            energyCost-=5;

        if(player.equipped.includes("👟 Arbeitsschuhe"))
            energyCost-=3;

        energyCost=Math.max(
            5,
            energyCost
        );

        html+=`

<div class="card">

<h3>${job.name}</h3>

<p>
💰 +${job.reward} Coins<br>
⭐ +${job.xp} XP<br>
⚡ -${energyCost} Energie<br>
😊 -${job.happiness} Glück
</p>

<button
class="action"
onclick="work(${index})"
${remaining>0||player.energy<energyCost?"disabled":""}>

${
remaining>0
?"⏳ Cooldown"
:
player.energy<energyCost
?"⚡ Zu wenig Energie"
:"Arbeiten"
}

</button>

</div>

`;

    });

    document.getElementById("content").innerHTML=html;
}


function work(index){

    checkNewDay();

    const job=jobList[index];

    if(!job)
        return;

    const last=
        player.jobs[index]||0;

    if(Date.now()-last<job.cooldown)
        return;

    let energyCost=job.energy;

    if(player.equipped.includes("🚲 Fahrrad"))
        energyCost-=5;

    if(player.equipped.includes("👟 Arbeitsschuhe"))
        energyCost-=3;

    energyCost=Math.max(
        5,
        energyCost
    );

    if(player.energy<energyCost)
        return;

    let reward=job.reward;

    if(player.equipped.includes("🎧 Kopfhörer"))
        reward=Math.round(reward*1.10);

    player.jobs[index]=Date.now();

    player.energy-=energyCost;

    player.happiness=
        Math.max(
            0,
            player.happiness-job.happiness
        );

    player.coins+=reward;

    addXP(job.xp);

    if(player.equipped.includes("🎧 Kopfhörer"))
        consumeItem("🎧 Kopfhörer");

    if(player.equipped.includes("🚲 Fahrrad"))
        consumeItem("🚲 Fahrrad");

    if(player.equipped.includes("👟 Arbeitsschuhe"))
        consumeItem("👟 Arbeitsschuhe");

    save();

    jobs();
}


/* =====================================================
   AUSRUHEN
===================================================== */

function rest(){

    checkNewDay();

    if(player.restsToday>=3){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<p class="danger">
Du hast heute bereits 3 Ruhepausen benutzt.
</p>

<p>
Morgen stehen dir wieder 3 zur Verfügung.
</p>

</div>

`;

        return;
    }

    if(player.energy>=100){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">
Du bist bereits vollständig erholt.
</div>

`;

        return;
    }

    let amount=30;

    if(player.equipped.includes("🏠 Kleine Wohnung"))
        amount+=15;

    player.energy=
        Math.min(
            100,
            player.energy+amount
        );

    player.happiness=
        Math.min(
            100,
            player.happiness+3
        );

    player.restsToday++;

    if(player.equipped.includes("🏠 Kleine Wohnung"))
        consumeItem("🏠 Kleine Wohnung");

    save();

    document.getElementById("content").innerHTML=`

<h2>😴 Ruhepause</h2>

<div class="card">

<p class="success">
⚡ +${amount} Energie
</p>

<p>
😊 +3 Glück
</p>

<p>
Heute:
${player.restsToday}/3 Ruhepausen
</p>

</div>

`;

}


/* =====================================================
   FREIZEIT
===================================================== */

function freeTime(){

    checkNewDay();

    if(player.freeTimeToday>=5){

        document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="danger">
Du hast dein Freizeitlimit für heute erreicht.
</p>

<p>
Morgen kannst du wieder 5 Freizeitaktionen machen.
</p>

</div>

`;

        return;
    }

    if(player.energy<15){

        document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="warning">
⚡ Du hast nicht genug Energie.
</p>

<p>
Du brauchst mindestens 15 Energie.
</p>

</div>

`;

        return;
    }

    let happiness=12;

    if(player.equipped.includes("🎮 Controller")){

        happiness+=15;
        consumeItem("🎮 Controller");

    }

    if(player.equipped.includes("💻 Gaming PC")){

        happiness+=20;
        consumeItem("💻 Gaming PC");

    }

    if(player.equipped.includes("📱 Smartphone")){

        happiness+=8;
        consumeItem("📱 Smartphone");

    }

    player.energy-=15;

    player.happiness=
        Math.min(
            100,
            player.happiness+happiness
        );

    player.freeTimeToday++;

    addXP(5);

    save();

    document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="success">
😊 +${happiness} Glück
</p>

<p>
⚡ -15 Energie
</p>

<p>
⭐ +5 XP
</p>

<p>
Heute:
${player.freeTimeToday}/5 Freizeitaktionen
</p>

</div>

`;

}


/* =====================================================
   DAILY
===================================================== */

function daily(){

    checkNewDay();

    const today=
        new Date().toISOString().slice(0,10);

    if(player.lastDaily===today){

        document.getElementById("content").innerHTML=`

<h2>🎁 Daily</h2>

<div class="card">

<p>
😴 Deine Daily wurde heute bereits abgeholt.
</p>

<p>
🔥 Streak: ${player.streak}
</p>

</div>

`;

        return;
    }

    player.lastDaily=today;
    player.streak++;

    const reward=
        100+
        Math.min(
            100,
            (player.streak-1)*10
        );

    player.coins+=reward;

    addXP(20);

    save();

    document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3 class="success">
🎉 Belohnung erhalten!
</h3>

<p>💰 +${reward} Coins</p>
<p>⭐ +20 XP</p>
<p>🔥 Streak: ${player.streak}</p>

</div>

`;

}


/* =====================================================
   SHOP
===================================================== */

function shop(){

    let html=`

<h2>🏪 CUBIX SHOP</h2>

<p class="muted">
Kaufe Items und nutze sie strategisch.
</p>

`;

    Object.keys(items).forEach(name=>{

        const item=items[name];

        html+=`

<div class="card">

<h3>${name}</h3>

<p>${item.text}</p>

<p>
💰 <strong>${item.price}</strong> Coins
</p>

<p>
🔋 ${item.uses} Nutzungen
</p>

<button
class="action"
onclick="buy('${name}')">

Kaufen

</button>

</div>

`;

    });

    document.getElementById("content").innerHTML=html;
}


function buy(name){

    const item=items[name];

    if(!item)
        return;

    if(player.coins<item.price)
        return;

    player.coins-=item.price;

    player.inventory.push({

        name:name,
        uses:item.uses

    });

    save();

    shop();
}


/* =====================================================
   INVENTAR
===================================================== */

function inventory(){

    if(player.inventory.length===0){

        document.getElementById("content").innerHTML=`

<h2>🎒 Inventar</h2>

<div class="card">
Dein Inventar ist leer.
</div>

`;

        return;
    }

    let html="<h2>🎒 Inventar</h2>";

    player.inventory.forEach((item,index)=>{

        const equipped=
            player.equipped.includes(item.name);

        const data=items[item.name];

        html+=`

<div class="item ${equipped?"equipped":""}">

<h3>${item.name}</h3>

<p>
🔋 ${item.uses} Nutzungen übrig
</p>

<p class="muted">
${data?data.text:"Item"}
</p>

`;

        if(
            data &&
            data.effect==="energy"
        ){

            html+=`

<button
class="action green"
onclick="useEnergy('${item.name}')">

⚡ Benutzen

</button>

`;

        }else{

            html+=`

${
equipped

?

`

<span class="badge">
✅ Ausgerüstet
</span>

<button
class="action gray"
onclick="unequip('${item.name}')">

Ablegen

</button>

`

:

`

<button
class="action"
onclick="equip('${item.name}')">

Ausrüsten

</button>

`
}

`;

        }

        html+=`</div>`;

    });

    document.getElementById("content").innerHTML=html;
}


function equip(name){

    if(!player.inventory.some(
        item=>item.name===name&&item.uses>0
    ))
        return;

    if(!player.equipped.includes(name))
        player.equipped.push(name);

    save();

    inventory();
}


function unequip(name){

    player.equipped=
        player.equipped.filter(
            x=>x!==name
        );

    save();

    inventory();
}


function useEnergy(name){

    const item=items[name];

    if(!item)
        return;

    if(player.energy>=100)
        return;

    if(!consumeItem(name))
        return;

    player.energy=
        Math.min(
            100,
            player.energy+item.value
        );

    save();

    inventory();
}


/* =====================================================
   PROFIL
===================================================== */

function profile(){

    document.getElementById("content").innerHTML=`

<h2>👤 Profil</h2>

<div class="card">

<p>💰 Coins: ${player.coins}</p>

<p>⭐ Level: ${player.level}</p>

<p>
⚡ XP:
${player.xp}/${xpNeeded()}
</p>

<p>
⚡ Energie:
${Math.round(player.energy)}/100
</p>

<p>
😊 Glück:
${Math.round(player.happiness)}/100
</p>

<p>
🔥 Daily Streak:
${player.streak}
</p>

</div>

<div class="card">

<h3>🎒 Ausrüstung</h3>

${
player.equipped.length
?
player.equipped.join("<br>")
:
"Keine Items ausgerüstet."
}

</div>

`;


}


/* =====================================================
   START
===================================================== */

checkNewDay();

updateStats();

home();

</script>

</body>
</html>
```
