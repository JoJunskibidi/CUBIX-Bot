<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at top,#3b0808,#100303 45%,#050505);
    color:white;
}

button{
    border:0;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.app{
    max-width:900px;
    min-height:100vh;
    margin:auto;
    padding:12px;
}

.header,.content{
    background:#090909;
    border:1px solid #4a1010;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.header{
    padding:20px;
    margin-bottom:12px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:7px 0 18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#111;
    border:1px solid #321010;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.stat-title{
    color:#888;
    font-size:11px;
}

.stat-value{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

.bar{
    height:7px;
    background:#251010;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.fill{
    height:100%;
    width:0%;
}

.energy{background:#d97706}
.happy{background:#db2777}
.xp{background:#b91c1c}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.menu button{
    padding:13px 8px;
    border-radius:11px;
    background:#180808;
    border:1px solid #511414;
}

.menu button:hover{
    background:#320c0c;
}

.content{
    padding:20px;
    min-height:450px;
}

.card{
    background:#120707;
    border:1px solid #461111;
    border-radius:14px;
    padding:16px;
    margin:10px 0;
}

.action{
    width:100%;
    margin-top:8px;
    padding:13px;
    border-radius:10px;
    background:#991b1b;
}

.action:hover{
    background:#b91c1c;
}

.green{background:#166534}
.gray{background:#3f3f46}
.pink{background:#9d174d}

.item{
    background:#120707;
    border:1px solid #461111;
    border-radius:12px;
    padding:14px;
    margin:9px 0;
}

.equipped{
    border-color:#dc2626;
    box-shadow:0 0 10px rgba(220,38,38,.12);
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#3f1111;
}

.success{color:#4ade80}
.warning{color:#fbbf24}
.danger{color:#f87171}
.muted{color:#999}

.limit{
    background:#1a0b0b;
    border:1px solid #511414;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:9px;
    border:1px solid #511414;
    background:#080808;
    color:white;
}

.small{
    font-size:13px;
}

@media(max-width:650px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .menu{grid-template-columns:repeat(2,1fr)}
    .logo{font-size:27px}
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">🔥 CUBIX CITY</div>

<div class="subtitle">
Deine Stadt. Dein Charakter. Dein Fortschritt.
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">💰 COINS</div>
<div class="stat-value" id="coins">250</div>
</div>

<div class="stat">
<div class="stat-title">⭐ LEVEL</div>
<div class="stat-value" id="level">1</div>
</div>

<div class="stat">
<div class="stat-title">⚡ ENERGIE</div>
<div class="stat-value">
<span id="energy">100</span>/100
</div>
<div class="bar">
<div class="fill energy" id="energyBar"></div>
</div>
</div>

<div class="stat">
<div class="stat-title">😊 GLÜCK</div>
<div class="stat-value">
<span id="happy">70</span>/100
</div>
<div class="bar">
<div class="fill happy" id="happyBar"></div>
</div>
</div>

</div>
</div>

<div class="menu">

<button onclick="home()">🏠 Stadt</button>
<button onclick="jobs()">💼 Jobs</button>
<button onclick="shop()">🏪 Shop</button>
<button onclick="inventory()">🎒 Inventar</button>
<button onclick="rest()">😴 Ausruhen</button>
<button onclick="freeTime()">🎮 Freizeit</button>
<button onclick="daily()">🎁 Daily</button>
<button onclick="profile()">👤 Profil</button>

</div>

<div class="content" id="content"></div>

</div>

<script>

/* =====================================================
   SPIELER
===================================================== */

let player = JSON.parse(
    localStorage.getItem("cubixPlayer")
) || {

    coins:250,
    xp:0,
    level:1,

    energy:100,
    happiness:70,

    streak:0,
    lastDaily:null,

    inventory:[],

    jobs:{},

    restsToday:0,
    freeTimeToday:0,

    lastActionDay:
        new Date().toISOString().slice(0,10)

};


/* =====================================================
   DATEN REPARIEREN
===================================================== */

if(!Array.isArray(player.inventory))
    player.inventory=[];

if(!player.jobs)
    player.jobs={};

if(typeof player.energy!=="number")
    player.energy=100;

if(typeof player.happiness!=="number")
    player.happiness=70;

if(typeof player.restsToday!=="number")
    player.restsToday=0;

if(typeof player.freeTimeToday!=="number")
    player.freeTimeToday=0;

if(typeof player.streak!=="number")
    player.streak=0;


/* =====================================================
   ALTES INVENTAR MIGRIEREN
===================================================== */

player.inventory = player.inventory
    .map(item => {

        if(typeof item === "string"){

            const data = items[item];

            if(!data)
                return null;

            return {
                id: crypto.randomUUID(),
                name:item,
                uses:data.uses,
                equipped:false
            };
        }

        if(
            item &&
            typeof item === "object" &&
            item.name
        ){

            if(!item.id)
                item.id=crypto.randomUUID();

            if(typeof item.uses!=="number"){

                const data=items[item.name];

                item.uses=data
                    ? data.uses
                    : 1;
            }

            if(typeof item.equipped!=="boolean")
                item.equipped=false;

            return item;
        }

        return null;

    })
    .filter(Boolean);


/* =====================================================
   ITEMS
===================================================== */

const items={

"🥤 Energy Drink":{
    price:50,
    uses:3,
    effect:"energy",
    value:25,
    text:"+25 Energie beim Benutzen"
},

"☕ Kaffee":{
    price:80,
    uses:4,
    effect:"energy",
    value:15,
    text:"+15 Energie beim Benutzen"
},

"🍫 Schokoriegel":{
    price:70,
    uses:3,
    effect:"energy",
    value:10,
    happy:4,
    text:"+10 Energie und +4 Glück"
},

"🎧 Kopfhörer":{
    price:150,
    uses:8,
    effect:"work",
    value:.10,
    text:"Beim Arbeiten +10% Coins"
},

"🎮 Controller":{
    price:300,
    uses:6,
    effect:"free",
    value:15,
    text:"Freizeit gibt +15 zusätzliches Glück"
},

"📱 Smartphone":{
    price:250,
    uses:8,
    effect:"free",
    value:7,
    text:"Freizeit gibt +7 zusätzliches Glück"
},

"💻 Gaming PC":{
    price:750,
    uses:6,
    effect:"free",
    value:20,
    text:"Freizeit gibt +20 zusätzliches Glück"
},

"🚲 Fahrrad":{
    price:500,
    uses:10,
    effect:"jobenergy",
    value:5,
    text:"Arbeiten kostet 5 Energie weniger"
},

"👟 Arbeitsschuhe":{
    price:350,
    uses:12,
    effect:"jobenergy",
    value:3,
    text:"Arbeiten kostet 3 Energie weniger"
},

"🏠 Kleine Wohnung":{
    price:1500,
    uses:8,
    effect:"rest",
    value:15,
    text:"Eine Ruhepause gibt 15 zusätzliche Energie"
},

"🛏️ Bequemes Bett":{
    price:900,
    uses:10,
    effect:"rest",
    value:8,
    text:"Eine Ruhepause gibt 8 zusätzliche Energie"
},

"🎒 Rucksack":{
    price:400,
    uses:10,
    effect:"jobenergy",
    value:2,
    text:"Arbeiten kostet 2 Energie weniger"
}

};


/* =====================================================
   SPEICHERN
===================================================== */

function save(update=true){

    localStorage.setItem(
        "cubixPlayer",
        JSON.stringify(player)
    );

    if(update)
        updateStats();
}


/* =====================================================
   TAGESRESET
===================================================== */

function checkNewDay(){

    const today=
        new Date().toISOString().slice(0,10);

    if(player.lastActionDay!==today){

        player.restsToday=0;
        player.freeTimeToday=0;

        player.lastActionDay=today;

        save(false);
    }
}


/* =====================================================
   XP
===================================================== */

function xpNeeded(){

    return 100+
        ((player.level-1)*50);
}

function addXP(amount){

    player.xp+=amount;

    while(player.xp>=xpNeeded()){

        player.xp-=xpNeeded();
        player.level++;

    }

    save(false);
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    player.energy=
        Math.max(
            0,
            Math.min(100,player.energy)
        );

    player.happiness=
        Math.max(
            0,
            Math.min(100,player.happiness)
        );

    document.getElementById("coins").textContent=
        Math.floor(player.coins);

    document.getElementById("level").textContent=
        player.level;

    document.getElementById("energy").textContent=
        Math.round(player.energy);

    document.getElementById("happy").textContent=
        Math.round(player.happiness);

    document.getElementById("energyBar").style.width=
        player.energy+"%";

    document.getElementById("happyBar").style.width=
        player.happiness+"%";
}


/* =====================================================
   ITEM HILFSFUNKTIONEN
===================================================== */

function equipped(name){

    return player.inventory.find(
        item =>
            item.name===name &&
            item.equipped &&
            item.uses>0
    );
}


function consumeItem(name){

    const item=equipped(name);

    if(!item)
        return false;

    item.uses--;

    if(item.uses<=0){

        const index=
            player.inventory.indexOf(item);

        if(index!==-1)
            player.inventory.splice(index,1);
    }

    return true;
}


function hasUsableItem(name){

    return player.inventory.some(
        item =>
            item.name===name &&
            item.uses>0
    );
}


/* =====================================================
   HOME
===================================================== */

function home(){

    checkNewDay();

    document.getElementById("content").innerHTML=`

<h2>🏠 CUBIX CITY</h2>

<p class="muted">
Verdiene Geld, sammle XP und passe auf deine Energie
und Glücklichkeit auf.
</p>

<div class="card">

<h3>📊 Dein Zustand</h3>

<p>💰 ${Math.floor(player.coins)} Coins</p>
<p>⭐ Level ${player.level}</p>
<p>⚡ ${Math.round(player.energy)}/100 Energie</p>
<p>😊 ${Math.round(player.happiness)}/100 Glücklichkeit</p>

</div>

<div class="card">

<h3>📅 Deine Limits heute</h3>

<p>
😴 Ruhepausen:
<strong>${player.restsToday}/3</strong>
</p>

<p>
🎮 Freizeit:
<strong>${player.freeTimeToday}/5</strong>
</p>

</div>

<div class="card">

<h3>💡 Stadtleben</h3>

<p>
Arbeiten bringt Geld, verbraucht aber Energie und
Glücklichkeit.
</p>

<p>
Freizeit macht dich glücklicher, verbraucht aber Energie.
</p>

<p>
Ausruhen stellt Energie wieder her, ist aber begrenzt.
</p>

</div>

`;
}


/* =====================================================
   JOBS
===================================================== */

const jobList=[

{
    name:"🧹 Müll sammeln",
    reward:25,
    xp:10,
    energy:12,
    happiness:3,
    cooldown:15000
},

{
    name:"🍕 Pizza liefern",
    reward:60,
    xp:25,
    energy:20,
    happiness:5,
    cooldown:30000
},

{
    name:"🚕 Taxi fahren",
    reward:120,
    xp:45,
    energy:30,
    happiness:7,
    cooldown:60000
},

{
    name:"💻 Programmieren",
    reward:200,
    xp:70,
    energy:40,
    happiness:10,
    cooldown:120000
}

];


function jobs(){

    checkNewDay();

    let html=`

<h2>💼 Jobs</h2>

<p class="muted">
Jeder Job hat einen eigenen Cooldown.
Du kannst nicht einfach dauerhaft denselben Job spammen.
</p>

`;

    jobList.forEach((job,index)=>{

        const last=
            player.jobs[index]||0;

        const remaining=
            Math.max(
                0,
                job.cooldown-
                (Date.now()-last)
            );

        let energyCost=
            job.energy;

        if(equipped("🚲 Fahrrad"))
            energyCost-=5;

        if(equipped("👟 Arbeitsschuhe"))
            energyCost-=3;

        if(equipped("🎒 Rucksack"))
            energyCost-=2;

        energyCost=Math.max(
            5,
            energyCost
        );

        let reason="Arbeiten";

        if(remaining>0)
            reason=
                "⏳ Noch "+
                Math.ceil(remaining/1000)+
                " Sekunden";

        else if(player.energy<energyCost)
            reason="⚡ Zu wenig Energie";

        html+=`

<div class="card">

<h3>${job.name}</h3>

<p>
💰 +${job.reward} Coins<br>
⭐ +${job.xp} XP<br>
⚡ -${energyCost} Energie<br>
😊 -${job.happiness} Glück
</p>

<button
class="action"
onclick="work(${index})"
${remaining>0||player.energy<energyCost?"disabled":""}>

${reason}

</button>

</div>

`;

    });

    document.getElementById("content").innerHTML=
        html;
}


function work(index){

    checkNewDay();

    const job=jobList[index];

    if(!job)
        return;

    const now=Date.now();

    const last=
        player.jobs[index]||0;

    if(now-last<job.cooldown){

        jobs();
        return;
    }

    let energyCost=
        job.energy;

    if(equipped("🚲 Fahrrad"))
        energyCost-=5;

    if(equipped("👟 Arbeitsschuhe"))
        energyCost-=3;

    if(equipped("🎒 Rucksack"))
        energyCost-=2;

    energyCost=
        Math.max(5,energyCost);

    if(player.energy<energyCost){

        jobs();
        return;
    }

    let reward=
        job.reward;

    if(equipped("🎧 Kopfhörer")){

        reward=
            Math.round(
                reward*1.10
            );
    }

    player.jobs[index]=now;

    player.energy-=energyCost;

    player.happiness=
        Math.max(
            0,
            player.happiness-job.happiness
        );

    player.coins+=reward;

    addXP(job.xp);

    /* Verbrauch der Ausrüstung */

    if(equipped("🎧 Kopfhörer"))
        consumeItem("🎧 Kopfhörer");

    if(equipped("🚲 Fahrrad"))
        consumeItem("🚲 Fahrrad");

    if(equipped("👟 Arbeitsschuhe"))
        consumeItem("👟 Arbeitsschuhe");

    if(equipped("🎒 Rucksack"))
        consumeItem("🎒 Rucksack");

    save();

    jobs();
}


/* =====================================================
   AUSRUHEN
===================================================== */

function rest(){

    checkNewDay();

    if(player.restsToday>=3){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<p class="danger">
Du hast heute bereits alle 3 Ruhepausen benutzt.
</p>

<p>
Morgen stehen wieder 3 zur Verfügung.
</p>

</div>

`;

        return;
    }

    if(player.energy>=100){

        document.getElementById("content").innerHTML=`

<h2>😴 Ausruhen</h2>

<div class="card">

<p>
Du bist bereits vollständig erholt.
</p>

<p class="muted">
Eine Ruhepause wird nicht verschwendet.
</p>

</div>

`;

        return;
    }

    let amount=30;

    if(equipped("🏠 Kleine Wohnung"))
        amount+=15;

    if(equipped("🛏️ Bequemes Bett"))
        amount+=8;

    amount=Math.min(
        amount,
        100-player.energy
    );

    player.energy+=amount;

    player.happiness=
        Math.min(
            100,
            player.happiness+3
        );

    player.restsToday++;

    if(equipped("🏠 Kleine Wohnung"))
        consumeItem("🏠 Kleine Wohnung");

    if(equipped("🛏️ Bequemes Bett"))
        consumeItem("🛏️ Bequemes Bett");

    save();

    document.getElementById("content").innerHTML=`

<h2>😴 Ruhepause</h2>

<div class="card">

<p class="success">
⚡ +${Math.round(amount)} Energie
</p>

<p>
😊 +3 Glücklichkeit
</p>

<p>
📅 Heute:
${player.restsToday}/3 Ruhepausen
</p>

</div>

`;

}


/* =====================================================
   FREIZEIT
===================================================== */

function freeTime(){

    checkNewDay();

    if(player.freeTimeToday>=5){

        document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="danger">
Dein Freizeitlimit für heute ist erreicht.
</p>

<p>
Morgen stehen wieder 5 Aktionen zur Verfügung.
</p>

</div>

`;

        return;
    }

    if(player.energy<15){

        document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="warning">
⚡ Du hast nicht genug Energie.
</p>

<p>
Du brauchst mindestens 15 Energie.
</p>

</div>

`;

        return;
    }

    let happiness=12;

    if(equipped("🎮 Controller")){

        happiness+=15;

        consumeItem("🎮 Controller");
    }

    if(equipped("💻 Gaming PC")){

        happiness+=20;

        consumeItem("💻 Gaming PC");
    }

    if(equipped("📱 Smartphone")){

        happiness+=7;

        consumeItem("📱 Smartphone");
    }

    player.energy-=15;

    player.happiness=
        Math.min(
            100,
            player.happiness+happiness
        );

    player.freeTimeToday++;

    addXP(5);

    save();

    document.getElementById("content").innerHTML=`

<h2>🎮 Freizeit</h2>

<div class="card">

<p class="success">
😊 +${happiness} Glücklichkeit
</p>

<p>
⚡ -15 Energie
</p>

<p>
⭐ +5 XP
</p>

<p>
📅 Heute:
${player.freeTimeToday}/5 Freizeitaktionen
</p>

</div>

`;
}


/* =====================================================
   DAILY
===================================================== */

function daily(){

    checkNewDay();

    const today=
        new Date().toISOString().slice(0,10);

    if(player.lastDaily===today){

        document.getElementById("content").innerHTML=`

<h2>🎁 Daily</h2>

<div class="card">

<p>
😴 Deine Daily wurde heute bereits abgeholt.
</p>

<p>
🔥 Streak: ${player.streak}
</p>

</div>

`;

        return;
    }

    player.lastDaily=today;

    player.streak++;

    const reward=
        100+
        Math.min(
            100,
            (player.streak-1)*10
        );

    player.coins+=reward;

    addXP(20);

    save();

    document.getElementById("content").innerHTML=`

<h2>🎁 Daily Reward</h2>

<div class="card">

<h3 class="success">
🎉 Belohnung erhalten!
</h3>

<p>💰 +${reward} Coins</p>
<p>⭐ +20 XP</p>
<p>🔥 Streak: ${player.streak}</p>

</div>

`;
}


/* =====================================================
   SHOP
===================================================== */

function shop(){

    let html=`

<h2>🏪 CUBIX SHOP</h2>

<p class="muted">
Items sind Verbrauchsgegenstände. Überlege dir,
wann du sie einsetzen möchtest.
</p>

`;

    Object.keys(items).forEach(name=>{

        const item=items[name];

        html+=`

<div class="card">

<h3>${name}</h3>

<p>${item.text}</p>

<p>
💰 <strong>${item.price}</strong> Coins
</p>

<p>
🔋 ${item.uses} Nutzungen pro gekauftem Item
</p>

<button
class="action"
onclick='buy(${JSON.stringify(name)})'>

🛒 Kaufen

</button>

</div>

`;

    });

    document.getElementById("content").innerHTML=
        html;
}


function buy(name){

    const item=items[name];

    if(!item)
        return;

    if(player.coins<item.price){

        shop();
        return;
    }

    player.coins-=item.price;

    player.inventory.push({

        id:crypto.randomUUID(),

        name:name,

        uses:item.uses,

        equipped:false

    });

    addXP(2);

    save();

    shop();
}


/* =====================================================
   INVENTAR
===================================================== */

function inventory(){

    if(player.inventory.length===0){

        document.getElementById("content").innerHTML=`

<h2>🎒 Inventar</h2>

<div class="card">

<p>
Dein Inventar ist leer.
</p>

<button
class="action"
onclick="shop()">

🏪 Zum Shop

</button>

</div>

`;

        return;
    }

    let html=`

<h2>🎒 Inventar</h2>

<p class="muted">
Ausrüsten aktiviert die Wirkung des Items.
Die Nutzungen werden bei der passenden Aktion verbraucht.
</p>

`;

    player.inventory.forEach(item=>{

        const data=items[item.name];

        if(!data)
            return;

        const isEquipped=
            item.equipped===true;

        html+=`

<div class="item ${isEquipped?"equipped":""}">

<h3>${item.name}</h3>

<p>

/* =====================================================
   AUS-/EQUIPPEN
===================================================== */

function equip(id){

    const item=
        player.inventory.find(
            x=>x.id===id
        );

    if(!item||item.uses<=0)
        return;

    /*
       Nur ein Item derselben Kategorie
       gleichzeitig ausrüsten.
    */

    const data=items[item.name];

    if(data){

        player.inventory.forEach(other=>{

            if(
                other.id!==item.id &&
                other.equipped &&
                items[other.name] &&
                items[other.name].effect===data.effect
            ){

                other.equipped=false;
            }

        });

    }

    item.equipped=true;

    save();

    inventory();
}


function unequip(id){

    const item=
        player.inventory.find(
            x=>x.id===id
        );

    if(!item)
        return;

    item.equipped=false;

    save();

    inventory();
}


/* =====================================================
   ENERGIE ITEMS
===================================================== */

function useEnergy(id){

    const item=
        player.inventory.find(
            x=>x.id===id
        );

    if(!item)
        return;

    const data=items[item.name];

    if(!data||data.effect!=="energy")
        return;

    if(player.energy>=100){

        inventory();
        return;
    }

    player.energy=
        Math.min(
            100,
            player.energy+data.value
        );

    if(data.happy){

        player.happiness=
            Math.min(
                100,
                player.happiness+data.happy
            );
    }

    item.uses--;

    if(item.uses<=0){

        const index=
            player.inventory.indexOf(item);

        if(index!==-1)
            player.inventory.splice(index,1);
    }

    save();

    inventory();
}
