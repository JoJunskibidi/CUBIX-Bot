<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBIX CITY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#430909,#140404 45%,#050505);
    color:#fff
}

.app{
    max-width:1000px;
    margin:auto;
    padding:10px
}

.header,.content{
    background:#090909;
    border:1px solid #551313;
    border-radius:20px;
    box-shadow:0 10px 35px #0008
}

.header{
    padding:18px;
    margin-bottom:10px
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900
}

.sub{
    text-align:center;
    color:#999;
    margin:7px 0 16px
}

.stats,.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px
}

.stat,.card,.item{
    background:#120707;
    border:1px solid #421010;
    border-radius:13px;
    padding:13px
}

.stat{
    text-align:center
}

.small{
    font-size:11px;
    color:#888
}

.bar{
    height:7px;
    background:#260d0d;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px
}

.fill{
    height:100%;
    width:0
}

.energy{
    background:#d97706
}

.happy{
    background:#db2777
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:10px
}

.menu button,button{
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
    border-radius:10px;
    padding:12px;
    background:#200909;
    border:1px solid #551313
}

.menu button:hover,button:hover{
    background:#350c0c
}

button:disabled{
    opacity:.45;
    cursor:not-allowed
}

.content{
    padding:18px;
    min-height:500px
}

.card{
    margin:9px 0
}

.action{
    width:100%;
    margin-top:7px;
    background:#991b1b
}

.green{
    background:#166534
}

.gray{
    background:#3f3f46
}

.gold{
    background:#92400e
}

.pink{
    background:#9d174d
}

.danger{
    color:#f87171
}

.success{
    color:#4ade80
}

.muted{
    color:#999
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px
}

.item{
    margin:8px 0
}

.badge{
    display:inline-block;
    background:#3d1111;
    padding:5px 8px;
    border-radius:20px;
    font-size:12px;
    margin:2px
}

.online{
    color:#6ee7a0
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    background:#111;
    border:1px solid #8b2020;
    padding:12px 16px;
    border-radius:12px;
    transition:.2s;
    z-index:9;
    max-width:90%;
    text-align:center
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0)
}

input,select{
    width:100%;
    padding:12px;
    background:#080808;
    color:#fff;
    border:1px solid #551313;
    border-radius:9px;
    margin:4px 0
}

table{
    width:100%;
    border-collapse:collapse
}

td,th{
    padding:8px;
    border-bottom:1px solid #351010;
    text-align:left
}

@media(max-width:650px){

    .stats,.grid{
        grid-template-columns:repeat(2,1fr)
    }

    .menu{
        grid-template-columns:repeat(2,1fr)
    }

    .row{
        grid-template-columns:1fr
    }

    .logo{
        font-size:27px
    }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
🔥 CUBIX CITY
</div>

<div class="sub">
Deine Stadt. Dein Charakter. Dein Fortschritt.
</div>

<div class="stats">

<div class="stat">
<div class="small">👤 USER</div>
<b id="username">–</b>
</div>

<div class="stat">
<div class="small">💰 COINS</div>
<b id="coins">0</b>
</div>

<div class="stat">
<div class="small">⭐ LEVEL / XP</div>
<b>
<span id="level">1</span>
·
<span id="xp">0</span>
</b>
</div>

<div class="stat">
<div class="small">⚡ ENERGIE</div>

<b>
<span id="energy">100</span>/100
</b>

<div class="bar">
<div id="energyBar" class="fill energy"></div>
</div>

</div>

</div>
</div>

<div class="menu">

<button onclick="home()">🏠 Stadt</button>
<button onclick="jobs()">💼 Jobs</button>
<button onclick="shopPage()">🏪 Shop</button>
<button onclick="inventory()">🎒 Inventar</button>

<button onclick="minerPage()">⛏️ Miner</button>
<button onclick="bankPage()">🏦 Bank</button>
<button onclick="socialPage()">🤝 Freunde</button>
<button onclick="leaderboard()">🏆 Rangliste</button>

<button onclick="rest()">😴 Ausruhen</button>
<button onclick="freeTime()">🎮 Freizeit</button>
<button onclick="daily()">🎁 Daily</button>
<button onclick="profile()">👤 Profil</button>

<button
id="adminBtn"
style="display:none"
onclick="adminPage()">
👑 Admin
</button>

</div>

<div
id="content"
class="content">
</div>

</div>

<div
id="toast"
class="toast">
</div>

<script>

const $ =
id =>
document.getElementById(id);

const today =
() =>
new Date()
.toISOString()
.slice(0,10);

let token =
localStorage.getItem(
"cubixToken"
);

let p = null;

let adminPassword =
sessionStorage.getItem(
"cubixAdmin"
) || null;

const jobsData = [

{
id:"trash",
name:"🧹 Müll sammeln",
reward:25,
xp:10,
energy:12,
happy:3,
cooldown:60000
},

{
id:"pizza",
name:"🍕 Pizza liefern",
reward:60,
xp:25,
energy:20,
happy:5,
cooldown:180000
},

{
id:"taxi",
name:"🚕 Taxi fahren",
reward:120,
xp:45,
energy:30,
happy:7,
cooldown:420000
},

{
id:"code",
name:"💻 Programmieren",
reward:200,
xp:70,
energy:40,
happy:10,
cooldown:720000
}

];

const items = {

"🥤 Energy Drink":{
price:50,
uses:3,
type:"consumable",
value:25,
text:"+25 Energie"
},

"☕ Kaffee":{
price:80,
uses:4,
type:"consumable",
value:15,
text:"+15 Energie"
},

"🎧 Kopfhörer":{
price:150,
uses:10,
type:"work",
text:"+10% Job-Einnahmen"
},

"👟 Arbeitsschuhe":{
price:350,
uses:12,
type:"work",
text:"-3 Energie pro Job"
},

"🚲 Fahrrad":{
price:500,
uses:10,
type:"work",
text:"-5 Energie pro Job"
},

"🎮 Controller":{
price:300,
uses:8,
type:"free",
text:"+15 Glück bei Freizeit"
},

"📱 Smartphone":{
price:250,
uses:12,
type:"free",
text:"+8 Glück bei Freizeit"
},

"💻 Gaming PC":{
price:750,
uses:8,
type:"free",
text:"+20 Glück bei Freizeit"
},

"🏠 Kleine Wohnung":{
price:1500,
uses:10,
type:"rest",
text:"+15 Energie beim Ausruhen"
},

"🛏️ Bequemes Bett":{
price:900,
uses:12,
type:"rest",
text:"+10 Energie beim Ausruhen"
}

};

const shopSpecials = {

"⚡ Einnahmen-Boost":{
price:5000,
text:"10 Stunden: Jobs und Miner produzieren/verdienen doppelt."
},

"🧾 Gebührenpass":{
price:2500,
text:"24 Stunden: Keine Gebühren zwischen Konto und Börse."
}

};

function toast(x){

$("toast").textContent=x;

$("toast")
.classList
.add("show");

clearTimeout(
window.tt
);

window.tt =
setTimeout(
() =>
$("toast")
.classList.remove("show"),
2400
);

}

async function api(
url,
body={}
){

const r =
await fetch(
url,
{
method:"POST",
headers:{
"Content-Type":
"application/json",

...(token
?{
Authorization:
"Bearer "+token
}
:{})
},

body:
JSON.stringify(body)
}
);

let d={};

try{
d=await r.json();
}
catch{}

if(
!r.ok ||
d.success===false
){
throw Error(
d.error ||
"Fehler"
);
}

return d;
}

function setPlayer(x){

p=x;

$("username")
.textContent=
p.username;

$("coins")
.textContent=
p.coins
.toLocaleString("de-DE");

$("level")
.textContent=
p.level;

$("xp")
.textContent=
p.xp;

$("energy")
.textContent=
Math.round(
p.energy
);

$("energyBar")
.style
.width=
p.energy+"%";

}

async function sync(){

if(!token){
loginScreen();
return;
}

try{

let d =
await api(
"/api/state"
);

setPlayer(
d.player
);

home();

}

catch{

localStorage
.removeItem(
"cubixToken"
);

token=null;

loginScreen();

}

}

function loginScreen(){

$("content")
.innerHTML=`

<h2>👤 Willkommen</h2>

<div class="card">

<p>
Wähle einen eindeutigen Username.
Erlaubt sind 3–16 Zeichen:
A-Z, 0-9 und _.
</p>

<input
id="userInput"
maxlength="16"
placeholder="z.B. CubixPlayer">

<div class="row">

<button
class="action"
onclick="register()">

✨ Registrieren

</button>

<button
class="action gray"
onclick="login()">

🔑 Einloggen

</button>

</div>

</div>

`;

}

async function register(){

try{

let u =
$("userInput")
.value
.trim();

let d =
await api(
"/api/register",
{
username:u
}
);

token =
d.token;

localStorage.setItem(
"cubixToken",
token
);

setPlayer(
d.player
);

home();

toast(
"Willkommen in CUBIX CITY!"
);

}

catch(e){

toast(
e.message
);

}

}

async function login(){

try{

let d =
await api(
"/api/login",
{
username:
$("userInput")
.value
.trim()
}
);

token =
d.token;

localStorage.setItem(
"cubixToken",
token
);

setPlayer(
d.player
);

home();

}

catch(e){

toast(
e.message
);

}

}

function home(){

if(!p)return;

$("content")
.innerHTML=`

<h2>🏠 CUBIX CITY</h2>

<p class="muted">
Willkommen,
<b>${p.username}</b>!
</p>

<div class="grid">

<div class="card">
<h3>💰 Coins</h3>
<b>
${p.coins.toLocaleString("de-DE")}
</b>
</div>

<div class="card">
<h3>⚡ Energie</h3>
<b>
${Math.round(p.energy)}/100
</b>
</div>

<div class="card">
<h3>😊 Glück</h3>
<b>
${Math.round(p.happiness)}/100
</b>
</div>

<div class="card">
<h3>⛏️ Miner</h3>
<b>
${
p.miner
?
`Level ${p.miner.level}`
:
"Noch keiner"
}
</b>
</div>

</div>

<div class="card">

<h3>📅 Heute</h3>

<p>
💼 Jobs:
${p.workToday}/8
</p>

<p>
😴 Ruhepausen:
${p.restsToday}/3
</p>

<p>
🎮 Freizeit:
${p.freeTimeToday}/5
</p>

</div>

`;

}

function fmt(ms){

let s =
Math.ceil(
ms/1000
);

return s>=60
?
Math.floor(s/60)
+"m "
+
String(
s%60
).padStart(2,"0")
+"s"
:
s+"s";

}

async function jobs(){

let html=`

<h2>💼 Jobs</h2>

<div class="card">

💼 Heute:
<b>
${p.workToday}/8
</b>

Jobs.

Jeder Job hat einen eigenen Cooldown.

</div>

`;

jobsData.forEach(j=>{

let last =
p.jobs?.[j.id] ||
0;

let rem =
Math.max(
0,
j.cooldown -
(
Date.now() -
last
)
);

let e =
j.energy;

if(
p.equipped
.includes(
"🚲 Fahrrad"
)
){
e-=5;
}

if(
p.equipped
.includes(
"👟 Arbeitsschuhe"
)
){
e-=3;
}

e=Math.max(
5,
e
);

html+=`

<div class="card">

<h3>
${j.name}
</h3>

<p>

💰 +${j.reward}

${
p.boostUntil>Date.now()
?
" → BOOST ×2"
:
""
}

<br>

⭐ +${j.xp} XP

<br>

⚡ -${e} Energie

<br>

😊 -${j.happy} Glück

</p>

<p class="muted">

${
rem
?
"⏳ Bereit in "+fmt(rem)
:
"🟢 Bereit"
}

</p>

<button
class="action"
${
rem ||
p.workToday>=8 ||
p.energy<e
?
"disabled"
:
""
}
onclick="work('${j.id}')">

${
rem
?
"⏳ Cooldown"
:
p.workToday>=8
?
"📅 Tageslimit"
:
p.energy<e
?
"⚡ Zu wenig Energie"
:
"Arbeiten"
}

</button>

</div>

`;

});

$("content")
.innerHTML=
html;

}

async function work(id){

try{

let d =
await api(
"/api/work",
{id}
);

setPlayer(
d.player
);

toast(
"💼 Job erledigt! +"
+
d.reward
+
" Coins"
);

jobs();

}

catch(e){

toast(
e.message
);

jobs();

}

}

function shopPage(){

let html=`

<h2>🏪 Shop</h2>

<p class="muted">
Verbrauchs- und Ausrüstungs-Items
plus zeitlich begrenzte Services.
</p>

`;

for(
const [n,d]
of Object.entries(items)
){

html+=`

<div class="card">

<h3>${n}</h3>

<p>
${d.text}
</p>

<p>
💰
${d.price.toLocaleString("de-DE")}
Coins

·

🔋
${d.uses}
Nutzungen
</p>

<button
class="action"
onclick="buy(${JSON.stringify(n)})"
${p.coins<d.price?"disabled":""}>

🛒 Kaufen

</button>

</div>

`;

}

for(
const [n,d]
of Object.entries(
shopSpecials
)
){

html+=`

<div class="card">

<h3>${n}</h3>

<p>
${d.text}
</p>

<p>
💰
${d.price.toLocaleString("de-DE")}
Coins
</p>

<button
class="action gold"
onclick="buy(${JSON.stringify(n)})"
${p.coins<d.price?"disabled":""}>

⚡ Kaufen

</button>

</div>

`;

}

$("content")
.innerHTML=
html;

}

async function buy(name){

try{

let d =
await api(
"/api/shop/buy",
{name}
);

setPlayer(
d.player
);

toast(
name+
" gekauft!"
);

shopPage();

}

catch(e){

e.message
);

}

function inventory(){

if(
!p.inventory.length
){

$("content")
.innerHTML=`

<h2>🎒 Inventar</h2>

<div class="card">

Leer.

<button
class="action"
onclick="shopPage()">

Zum Shop

</button>

</div>

`;

return;

}

let h =
"<h2>🎒 Inventar</h2>";

p.inventory.forEach(
(it,i)=>{

let d =
items[it.name];

let eq =
p.equipped
.includes(
it.name
);

h+=`

<div
class="item
${eq?"equipped":""}">

<h3>
${it.name}
</h3>

<p>
🔋
${it.uses}
Nutzungen

·

${d?.text||""}
</p>

${
d?.type==="consumable"

?

`

<button
class="action green"
onclick="useItem(${i})">

⚡ Benutzen

</button>

`

:

eq

?

`

<span class="badge">
✅ Ausgerüstet
</span>

<button
class="action gray"
onclick="unequip(${JSON.stringify(it.name)})">

Ablegen

</button>

`

:

`

<button
class="action"
onclick="equip(${JSON.stringify(it.name)})">

⚙️ Ausrüsten

</button>

`
}

<button
class="action pink"
onclick="giftItem(${i})">

🎁 Verschenken

</button>

</div>

`;

});

$("content")
.innerHTML=
h;

}

function minerPage(){

if(!p.miner){

$("content")
.innerHTML=`

<h2>⛏️ Miner</h2>

<div class="card">

<h3>
Baue deine passive Einnahmequelle auf.
</h3>

<p>
Level 1 · 2.000 Coins/h
· Kaufpreis 10.000 Coins
</p>

<button
class="action"
onclick="minerBuy()">

⛏️ Miner kaufen

</button>

</div>

`;

return;

}

api(
"/api/miner/state"
)

.then(
d=>{

setPlayer(
d.player
);

renderMiner();

}
)

.catch(
e =>
toast(
e.message
)
);

}

function renderMiner(){

let m =
p.miner;

let eff =
(
0.70 +
0.30 *
m.condition /
100
)
*
(
p.boostUntil>Date.now()
?
2
:
1
);

let rate =
Math.floor(
m.rate *
eff
);

$("content")
.innerHTML=`

<h2>⛏️ Miner</h2>

<div class="card">

<h3>
🟢 Miner Level ${m.level}
</h3>

<p>
💰 Basis:
${m.rate.toLocaleString("de-DE")}
Coins/h
</p>

<p>
📈 Aktuell:
<b>
${rate.toLocaleString("de-DE")}
Coins/h
</b>

${
p.boostUntil>Date.now()
?
" · ⚡ BOOST ×2"
:
""
}

</p>

<p>
📦 Gespeichert:
<b>
${m.stored.toLocaleString("de-DE")}
Coins
</b>
</p>

<p>
🔧 Zustand:
<b>
${m.condition.toFixed(1)}%
</b>
</p>

<button
class="action green"
onclick="collectMiner()">

💰 Einnahmen abholen

</button>

<button
class="action gray"
onclick="repairMiner()">

🔧 Reparieren

</button>

</div>

<div class="card">

<h3>
⬆️ Nächstes Upgrade
</h3>

${
m.upgradeCost===null ||
!isFinite(m.upgradeCost)

?

"Maximales Level erreicht."

:

`

<p>
Level ${m.level+1}
·
${m.upgradeCost.toLocaleString("de-DE")}
Coins
</p>

<button
class="action"
onclick="upgradeMiner()">

⬆️ Upgrade

</button>

`
}

</div>

async function bankMove(dir){

dir==="withdraw"

$("ba").value
:

dir==="deposit"
?
"toBankFromCoins"
:
dir==="withdraw"
?
"fromBankToCoins"
:
dir;

let d =
await api(
"/api/bank/transfer",
{
direction,
amount
}
);

setPlayer(
d.player
);

toast(
"🏦 Transfer erfolgreich"

(
d.fee
?
" · Gebühr "
+
d.fee
:
""
)
);

bankPage();

}

catch(e){

toast(
e.message
);

}

}

async function apiAdmin(
url,
password
){

let r =
await fetch(
url,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
password
})
}
);

let d =
await r.json();

if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Admin-Fehler"
);

}

return d;

}

async function adminGive(type){

try{

let r =
await fetch(
"/api/admin/give",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

password:
adminPassword,

username:
$("target")
.value
.trim(),

type,

amount:
Number(
$("adminAmount")
.value
)

})
}
);

let d =
await r.json();

if(
!r.ok ||
!d.success
){

throw Error(
d.error ||
"Admin-Fehler"
);

}

toast(
"👑 Erfolgreich vergeben!"
);

adminPage();

}

catch(e){

toast(
e.message
);

}

}
