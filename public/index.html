<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUBIX CITY</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #3b0a0a 0%, #160505 35%, #050505 80%);
    color: #fff;
}

button {
    border: none;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.app {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    margin: auto;
    padding: 18px;
}

.header {
    background: rgba(10, 10, 10, .96);
    border: 1px solid #571414;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.45);
}

.logo {
    text-align: center;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(220, 38, 38, .4);
}

.subtitle {
    text-align: center;
    color: #999;
    margin: 8px 0 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #090909;
    border: 1px solid #351010;
    border-radius: 14px;
    padding: 13px;
    text-align: center;
}

.stat-title {
    color: #999;
    font-size: 12px;
}

.stat-value {
    margin-top: 5px;
    font-size: 20px;
    font-weight: bold;
}

.xp-bar {
    height: 8px;
    margin-top: 8px;
    background: #2b1111;
    border-radius: 20px;
    overflow: hidden;
}

.xp-progress {
    height: 100%;
    width: 0%;
    background: #b91c1c;
    transition: width .3s;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 14px;
}

.menu button {
    padding: 15px 8px;
    border-radius: 13px;
    background: #100909;
    border: 1px solid #4a1212;
    transition: .15s;
}

.menu button:hover {
    background: #250b0b;
    transform: translateY(-2px);
}

.content {
    background: rgba(8, 8, 8, .97);
    border: 1px solid #4a1212;
    border-radius: 20px;
    padding: 22px;
    min-height: 430px;
}

h2 {
    margin-top: 0;
}

.card {
    background: #120909;
    border: 1px solid #451111;
    border-radius: 15px;
    padding: 18px;
    margin: 11px 0;
}

.card h3 {
    margin-top: 0;
}

.action {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    background: #991b1b;
}

.action:hover {
    background: #b91c1c;
}

.green {
    background: #166534;
}

.green:hover {
    background: #15803d;
}

.gray {
    background: #3f3f46;
}

.red {
    background: #7f1d1d;
}

.home-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.big-card {
    background: #120909;
    border: 1px solid #451111;
    border-radius: 15px;
    padding: 20px;
}

.big-card button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: #2a0d0d;
}

.inventory {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.item {
    padding: 16px;
    background: #120909;
    border: 1px solid #451111;
    border-radius: 12px;
}

.online {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #092b16;
    color: #6ee7a0;
    font-weight: bold;
}

.admin {
    border: 1px solid #7f1d1d;
    border-radius: 15px;
    padding: 5px;
}

.admin-title {
    color: #ef4444;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #571414;
    background: #080808;
    color: white;
    font-size: 16px;
}

.warning {
    color: #fbbf24;
}

.success {
    color: #4ade80;
}

.danger {
    color: #f87171;
}

@media(max-width: 650px) {

    .app {
        padding: 10px;
    }

    .logo {
        font-size: 29px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

    .home-grid {
        grid-template-columns: 1fr;
    }

    .inventory {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">🔥 CUBIX CITY</div>

    <div class="subtitle">
        Deine Stadt. Dein Charakter. Dein Fortschritt.
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">💰 COINS</div>
            <div class="stat-value" id="coins">250</div>
        </div>

        <div class="stat">
            <div class="stat-title">⭐ LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">

            <div class="stat-title">⚡ XP</div>

            <div class="stat-value">
                <span id="xp">0</span> /
                <span id="xpNeeded">100</span>
            </div>

            <div class="xp-bar">
                <div class="xp-progress" id="xpProgress"></div>
            </div>

        </div>

    </div>

</div>

<div class="menu">

    <button onclick="home()">🏠 Stadt</button>
    <button onclick="jobs()">💼 Jobs</button>
    <button onclick="shop()">🏪 Shop</button>
    <button onclick="daily()">🎁 Daily</button>
    <button onclick="inventory()">🎒 Inventar</button>
    <button onclick="profile()">👤 Profil</button>

</div>

<div class="content" id="content"></div>

</div>

<script>

// =====================================================
// SPIELER
// =====================================================

let player = JSON.parse(
    localStorage.getItem("cubixPlayer")
) || {

    coins: 250,
    xp: 0,
    level: 1,
    streak: 0,
    lastDaily: null,
    inventory: [],
    jobs: {}

};

let adminPassword =
    sessionStorage.getItem("cubixAdmin") || null;


// =====================================================
// SPEICHERN
// =====================================================

function save() {

    localStorage.setItem(
        "cubixPlayer",
        JSON.stringify(player)
    );

    updateStats();

}


// =====================================================
// XP
// =====================================================

function xpNeeded() {

    return 100 + ((player.level - 1) * 50);

}

function updateStats() {

    document.getElementById("coins").textContent =
        player.coins;

    document.getElementById("level").textContent =
        player.level;

    document.getElementById("xp").textContent =
        player.xp;

    document.getElementById("xpNeeded").textContent =
        xpNeeded();

    document.getElementById("xpProgress").style.width =
        Math.min(
            100,
            player.xp / xpNeeded() * 100
        ) + "%";

}

function addXP(amount) {

    player.xp += amount;

    let levelUps = 0;

    while (player.xp >= xpNeeded()) {

        player.xp -= xpNeeded();
        player.level++;

        levelUps++;

    }

    if (levelUps > 0) {

        alert(
            "🔥 LEVEL UP!\n\n" +
            "Du bist jetzt Level " +
            player.level +
            "!"
        );

    }

    save();

}


// =====================================================
// HOME
// =====================================================

function home() {

    document.getElementById("content").innerHTML = `

        <h2>🏠 Willkommen in CUBIX CITY</h2>

        <p>
            Verdiene Coins, sammle XP und baue deine
            Sammlung auf.
        </p>

        <div class="home-grid">

            <div class="big-card">

                <h3>💼 Jobs</h3>

                <p>
                    Arbeite und verdiene Geld.
                </p>

                <button onclick="jobs()">
                    Jobs öffnen
                </button>

            </div>

            <div class="big-card">

                <h3>🎁 Daily</h3>

                <p>
                    Hole dir jeden Tag deine Belohnung.
                </p>

                <button onclick="daily()">
                    Daily öffnen
                </button>

            </div>

            <div class="big-card">

                <h3>🏪 Shop</h3>

                <p>
                    Kaufe Items für deine Sammlung.
                </p>

                <button onclick="shop()">
                    Shop öffnen
                </button>

            </div>

            <div class="big-card">

                <h3>👥 CUBIX CITY</h3>

                <p>
                    <span class="online" id="onlineCount">
                        🟢 Lade...
                    </span>
                </p>

            </div>

        </div>

    `;

    updateOnline();

}


// =====================================================
// JOBS
// =====================================================

const jobList = [

    {
        id: "trash",
        emoji: "🧹",
        name: "Müll sammeln",
        reward: 20,
        xp: 10,
        cooldown: 15000
    },

    {
        id: "pizza",
        emoji: "🍕",
        name: "Pizza liefern",
        reward: 50,
        xp: 25,
        cooldown: 30000
    },

    {
        id: "taxi",
        emoji: "🚕",
        name: "Taxi fahren",
        reward: 100,
        xp: 50,
        cooldown: 60000
    },

    {
        id: "developer",
        emoji: "💻",
        name: "Programmieren",
        reward: 200,
        xp: 100,
        cooldown: 120000
    }

];

function jobs() {

    let html = `
        <h2>💼 Jobs</h2>

        <p>
            Je besser der Job, desto länger der Cooldown.
        </p>
    `;

    jobList.forEach(job => {

        const last =
            player.jobs[job.id] || 0;

        const remaining =
            Math.max(
                0,
                job.cooldown -
                (Date.now() - last)
            );

        const seconds =
            Math.ceil(remaining / 1000);

        html += `

        <div class="card">

            <h3>
                ${job.emoji} ${job.name}
            </h3>

            <p>
                💰 +${job.reward} Coins<br>
                ⭐ +${job.xp} XP
            </p>

            ${
                remaining > 0

                ?

                `<button class="action gray" disabled>
                    ⏳ Noch ${seconds} Sekunden
                </button>`

                :

                `<button
                    class="action"
                    onclick="work('${job.id}')">
                    Arbeiten
                </button>`
            }

        </div>

        `;

    });

    document.getElementById("content").innerHTML =
        html;

}

function work(id) {

    const job =
        jobList.find(x => x.id === id);

    if (!job) return;

    const last =
        player.jobs[id] || 0;

    if (
        Date.now() - last <
        job.cooldown
    ) {

        alert(
            "⏳ Dieser Job ist noch nicht bereit."
        );

        return;
    }

    player.jobs[id] = Date.now();

    player.coins += job.reward;

    addXP(job.xp);

    save();

    alert(
        "💼 Job erledigt!\n\n+" +
        job.reward +
        " Coins\n+" +
        job.xp +
        " XP"
    );

    jobs();

}


// =====================================================
// DAILY
// =====================================================

function daily() {

    const today =
        new Date().toISOString().slice(0, 10);

    if (player.lastDaily === today) {

        document.getElementById("content").innerHTML = `

            <h2>🎁 Daily Reward</h2>

            <div class="card">

                <h3>😴 Schon abgeholt!</h3>

                <p>
                    Deine heutige Belohnung hast du
                    bereits eingesammelt.
                </p>

                <p class="warning">
                    🔥 Streak: ${player.streak}
                </p>

            </div>

        `;

        return;
    }

    player.lastDaily = today;

    player.streak++;

    const reward =
        100 + ((player.streak - 1) * 10);

    player.coins += reward;

    addXP(20);

    save();

    document.getElementById("content").innerHTML = `

        <h2>🎁 Daily Reward</h2>

        <div class="card">

            <h3 class="success">
                🎉 Belohnung erhalten!
            </h3>

            <p>
                💰 +${reward} Coins
            </p>

            <p>
                ⭐ +20 XP
            </p>

            <p>
                🔥 Streak: ${player.streak}
            </p>

        </div>

    `;

}


// =====================================================
// SHOP
// =====================================================

const shopItems = [

    {
        name: "🥤 Energy Drink",
        price: 50,
        description: "Ein kleiner Boost."
    },

    {
        name: "🎧 Kopfhörer",
        price: 150,
        description: "Style +1 😎"
    },

    {
        name: "🎮 Gaming Controller",
        price: 300,
        description: "Jetzt wird gezockt."
    },

    {
        name: "🚲 Fahrrad",
        price: 500,
        description: "Schneller durch die Stadt."
    },

    {
        name: "💻 Gaming PC",
        price: 750,
        description: "Das ultimative Setup."
    },

    {
        name: "🏠 Kleine Wohnung",
        price: 1500,
        description: "Dein erstes eigenes Zuhause."
    }

];

function shop() {

    let html = `
        <h2>🏪 CUBIX Shop</h2>
        <p>Erweitere deine Sammlung.</p>
    `;

    shopItems.forEach((item, index) => {

        html += `

        <div class="card">

            <h3>${item.name}</h3>

            <p>${item.description}</p>

            <p>
                💰 <strong>
                    ${item.price} Coins
                </strong>
            </p>

            <button
                class="action"
                onclick="buy(${index})">
                Kaufen
            </button>

        </div>

        `;

    });

    document.getElementById("content").innerHTML =
        html;

}

function buy(index) {

    const item =
        shopItems[index];

    if (player.coins < item.price) {

        alert(
            "❌ Du hast nicht genug Coins."
        );

        return;
    }

    player.coins -= item.price;

    player.inventory.push(item.name);

    addXP(5);

    save();

    alert(
        "🛍️ Gekauft!\n\n" +
        item.name +
        "\n\n-" +
        item.price +
        " Coins"
    );

    shop();

}


// =====================================================
// INVENTAR
// =====================================================

function inventory() {

    if (
        player.inventory.length === 0
    ) {

        document.getElementById("content").innerHTML = `

            <h2>🎒 Inventar</h2>

            <div class="card">

                Dein Inventar ist noch leer.

                <br><br>

                Besuche den Shop!

            </div>

        `;

        return;
    }

    let html = `
        <h2>🎒 Dein Inventar</h2>

        <div class="inventory">
    `;

    player.inventory.forEach(item => {

        html += `
            <div class="item">
                ${item}
            </div>
        `;

    });

    html += `</div>`;

    document.getElementById("content").innerHTML =
        html;

}


// =====================================================
// PROFIL
// =====================================================

function profile() {

    document.getElementById("content").innerHTML = `

        <h2>👤 Dein Profil</h2>

        <div class="card">

            <h3>📊 Statistiken</h3>

            <p>
                💰 Coins:
                ${player.coins}
            </p>

            <p>
                ⭐ Level:
                ${player.level}
            </p>

            <p>
                ⚡ XP:
                ${player.xp} /
                ${xpNeeded()}
            </p>

            <p>
                🔥 Daily Streak:
                ${player.streak}
            </p>

            <p>
                🎒 Items:
                ${player.inventory.length}
            </p>

        </div>

    `;

}


// =====================================================
// ONLINE
// =====================================================

const playerId =
    localStorage.getItem("cubixPlayerId") ||
    crypto.randomUUID();

localStorage.setItem(
    "cubixPlayerId",
    playerId
);

async function heartbeat() {

    try {

        const response =
            await fetch("/api/heartbeat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    playerId
                })

            });

        const data =
            await response.json();

        const element =
            document.getElementById(
                "onlineCount"
            );

        if (element) {

            element.textContent =
                "🟢 " +
                data.online +
                " Spieler online";

        }

    } catch (error) {

        console.log(
            "Online-System momentan nicht erreichbar."
        );

    }

}

async function updateOnline() {

    try {

        const response =
            await fetch("/api/online");

        const data =
            await response.json();

        const element =
            document.getElementById(
                "onlineCount"
            );

        if (element) {

            element.textContent =
                "🟢 " +
                data.online +
                " Spieler online";

        }

    } catch (error) {}

}

setInterval(
    heartbeat,
    30000
);

heartbeat();


// =====================================================
// ADMIN LOGIN
// =====================================================

function adminLogin() {

    const password =
        prompt("👑 Admin-Passwort:");

    if (!password) return;

    fetch("/api/admin/login", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({
            password
        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error();
        }

        return response.json();

    })

    .then(data => {

        if (data.success) {

            adminPassword =
                password;

            sessionStorage.setItem(
                "cubixAdmin",
                password
            );

            adminPanel();

        }

    })

    .catch(() => {

        alert(
            "❌ Falsches Admin-Passwort."
        );

    });

}


// =====================================================
// ADMIN PANEL
// =====================================================

async function adminPanel() {

    if (!adminPassword) {

        adminLogin();

        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/stats",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password:
                            adminPassword
                    })

                }
            );

        if (!response.ok) {

            adminPassword = null;

            sessionStorage.removeItem(
                "cubixAdmin"
            );

            adminLogin();

            return;
        }

        const data =
            await response.json();

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="admin">

                <h2 class="admin-title">
                    👑 CUBIX ADMIN
                </h2>

                <div class="card">

                    <h3>
                        👥 Spieler online
                    </h3>

                    <p class="online">
                        🟢
                        ${data.onlinePlayers}
                        Spieler online
                    </p>

                    <button
                        class="action"
                        onclick="adminPanel()">
                        🔄 Aktualisieren
                    </button>

                </div>

                <div class="card">

                    <h3>
                        💰 Coins vergeben
                    </h3>

                    <input
                        id="adminCoins"
                        type="number"
                        min="1"
                        placeholder="z.B. 10000"
                    >

                    <button
                        class="action green"
                        onclick="adminGiveCoins()">
                        💰 Coins geben
                    </button>

                </div>

                <div class="card">

                    <h3>
                        ⭐ XP vergeben
                    </h3>

                    <input
                        id="adminXP"
                        type="number"
                        min="1"
                        placeholder="z.B. 500"
                    >

                    <button
                        class="action green"
                        onclick="adminGiveXP()">
                        ⭐ XP geben
                    </button>

                </div>

                <div class="card">

                    <h3>
                        🔐 Admin
                    </h3>

                    <button
                        class="action red"
                        onclick="adminLogout()">
                        Admin verlassen
                    </button>

                </div>

            </div>

        `;

    } catch (error) {

        alert(
            "Admin-Bereich konnte nicht geladen werden."
        );

    }

}


// =====================================================
// ADMIN COINS
// =====================================================

function adminGiveCoins() {

    const amount =
        Number(
            document.getElementById(
                "adminCoins"
            ).value
        );

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        alert(
            "Bitte eine gültige Zahl eingeben."
        );

        return;
    }

    player.coins += amount;

    save();

    alert(
        "👑 ADMIN\n\n+" +
        amount +
        " Coins"
    );

    adminPanel();

}


// =====================================================
// ADMIN XP
// =====================================================

function adminGiveXP() {

    const amount =
        Number(
            document.getElementById(
                "adminXP"
            ).value
        );

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        alert(
            "Bitte eine gültige Zahl eingeben."
        );

        return;
    }

    addXP(amount);

    alert(
        "👑 ADMIN\n\n+" +
        amount +
        " XP"
    );

    adminPanel();

}


// =====================================================
// ADMIN LOGOUT
// =====================================================

function adminLogout() {

    adminPassword = null;

    sessionStorage.removeItem(
        "cubixAdmin"
    );

    home();

}


// =====================================================
// ADMIN URL
// =====================================================

if (
    window.location.pathname === "/admin"
) {

    setTimeout(() => {

        adminLogin();

    }, 300);

}


// =====================================================
// START
// =====================================================

updateStats();

if (
    window.location.pathname !== "/admin"
) {
    home();
}

</script>

</body>
</html>
